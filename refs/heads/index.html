      /* =====================================================================
         6. UNDO / REDO HISTORY
         ===================================================================== */
      function pushHistory() {
        if (state.historyIndex < state.history.length - 1) {
          state.history = state.history.slice(0, state.historyIndex + 1);
        }
        const snapshot = {
          photoLayers: state.photoLayers.map(l => ({
            ...l,
            cropNorm: { ...l.cropNorm }
          })),
          annotations: state.annotations.map(a => ({
            ...a,
            points: a.points ? a.points.map(p => ({ x: p.x, y: p.y })) : undefined
          }))
        };
        state.history.push(snapshot);
        if (state.history.length > 50) {
          state.history.shift();
        } else {
          state.historyIndex++;
        }
        updateUndoRedoUI();
      }

      function applyHistorySnapshot(snap) {
        state.photoLayers = snap.photoLayers.map(l => ({
          ...l,
          cropNorm: { ...l.cropNorm }
        }));
        state.annotations = snap.annotations.map(a => ({
          ...a,
          points: a.points ? a.points.map(p => ({ x: p.x, y: p.y })) : undefined
        }));
        if (!state.photoLayers.some(l => l.id === state.selectedLayerId)) {
          state.selectedLayerId = null;
        }
        if (!state.annotations.some(a => a.id === state.selectedAnnotationId)) {
          state.selectedAnnotationId = null;
        }
        updateContextBars();
        updateUndoRedoUI();
        renderMainCanvas();
      }

      function undo() {
        if (state.historyIndex <= 0) return;
        state.historyIndex--;
        applyHistorySnapshot(state.history[state.historyIndex]);
        showToast('已復原');
      }

      function redo() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex++;
        applyHistorySnapshot(state.history[state.historyIndex]);
        showToast('已重做');
      }

      function updateUndoRedoUI() {
        el.btnUndo.disabled = state.historyIndex <= 0;
        el.btnRedo.disabled = state.historyIndex >= state.history.length - 1;
      }

      /* =====================================================================
         7. VIEWPORT & MAIN CANVAS RENDERING
         ===================================================================== */
      function fitCadToScreen() {
        const rect = el.canvasStage.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const pad = 24;
        const scale = Math.min(
          Math.max(40, rect.width - pad * 2) / state.cadWidth,
          Math.max(40, rect.height - pad * 2) / state.cadHeight
        );
        state.viewport.scale = Math.max(0.1, Math.min(6, scale));
        state.viewport.offsetX = (rect.width - state.cadWidth * state.viewport.scale) / 2;
        state.viewport.offsetY = (rect.height - state.cadHeight * state.viewport.scale) / 2;
        updateZoomUI();
        renderMainCanvas();
      }

      function zoomAtScreenPoint(factor, screenX, screenY) {
        const oldScale = state.viewport.scale;
        const newScale = Math.max(0.1, Math.min(8, oldScale * factor));
        const ratio = newScale / oldScale;
        state.viewport.offsetX = screenX - (screenX - state.viewport.offsetX) * ratio;
        state.viewport.offsetY = screenY - (screenY - state.viewport.offsetY) * ratio;
        state.viewport.scale = newScale;
        updateZoomUI();
        renderMainCanvas();
      }

      function updateZoomUI() {
        el.zoomPercent.textContent = `${Math.round(state.viewport.scale * 100)}%`;
      }

      function screenToWorld(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        return {
          x: (sx - state.viewport.offsetX) / state.viewport.scale,
          y: (sy - state.viewport.offsetY) / state.viewport.scale
        };
      }

      function resizeMainCanvas() {
        const rect = el.canvasStage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.mainCanvas.width = Math.max(1, Math.round(rect.width * dpr));
        el.mainCanvas.height = Math.max(1, Math.round(rect.height * dpr));
        renderMainCanvas();
      }

      function roundRectPath(c, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
      }

      /**
       * Transform a world-space point into the local unrotated coordinate frame
       * of a rotatable shape (rect / circle), centered at (cx, cy).
       */
      function worldToShapeLocal(pt, ann) {
        const cx = ann.x + ann.w / 2;
        const cy = ann.y + ann.h / 2;
        const dx = pt.x - cx;
        const dy = pt.y - cy;
        const rot = ann.rotation || 0;
        const cos = Math.cos(-rot);
        const sin = Math.sin(-rot);
        return {
          x: dx * cos - dy * sin,
          y: dx * sin + dy * cos
        };
      }

      function drawScene(targetCtx, showHandles) {
        // 1. CAD Base
        if (state.cadImage) {
          targetCtx.drawImage(state.cadImage, 0, 0, state.cadWidth, state.cadHeight);
        } else {
          targetCtx.fillStyle = '#0f172a';
          targetCtx.fillRect(0, 0, state.cadWidth, state.cadHeight);
        }

        // 2. Photo Layers
        for (const layer of state.photoLayers) {
          targetCtx.save();
          targetCtx.translate(layer.x, layer.y);
          targetCtx.rotate(layer.rotation);

          targetCtx.shadowColor = 'rgba(0, 0, 0, 0.55)';
          targetCtx.shadowBlur = 12;
          targetCtx.shadowOffsetY = 4;
          targetCtx.drawImage(layer.croppedCanvas, -layer.width / 2, -layer.height / 2, layer.width, layer.height);

          targetCtx.shadowColor = 'transparent';
          targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          targetCtx.lineWidth = 2;
          targetCtx.strokeRect(-layer.width / 2, -layer.height / 2, layer.width, layer.height);
          targetCtx.restore();
        }

        // 3. Vector Annotations
        const list = state.activeDrawing ? [...state.annotations, state.activeDrawing] : state.annotations;
        for (const ann of list) {
          drawAnnotation(targetCtx, ann);
        }

        // 4. Selection Handles & Eraser Cursor Preview
        if (showHandles) {
          if (state.mode === 'layer' && state.selectedLayerId) {
            const selLayer = state.photoLayers.find(l => l.id === state.selectedLayerId);
            if (selLayer) drawLayerHandles(targetCtx, selLayer);
          }
          if (state.mode === 'draw' && state.selectedAnnotationId) {
            const selAnn = state.annotations.find(a => a.id === state.selectedAnnotationId);
            if (selAnn) drawAnnotationHandles(targetCtx, selAnn);
          }
          if (state.mode === 'draw' && state.drawTool === 'eraser' && state.eraserPreviewPt) {
            const inv = 1 / state.viewport.scale;
            const r = state.toolSizes.eraser * inv;
            targetCtx.save();
            targetCtx.strokeStyle = 'rgba(252, 211, 77, 0.9)';
            targetCtx.fillStyle = 'rgba(252, 211, 77, 0.14)';
            targetCtx.lineWidth = 2 * inv;
            targetCtx.setLineDash([5 * inv, 4 * inv]);
            targetCtx.beginPath();
            targetCtx.arc(state.eraserPreviewPt.x, state.eraserPreviewPt.y, r, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.stroke();
            targetCtx.restore();
          }
        }
      }

      function drawAnnotation(c, ann) {
        c.save();
        c.strokeStyle = ann.color;
        c.fillStyle = ann.color;
        c.lineWidth = ann.width || 6;
        c.lineCap = 'round';
        c.lineJoin = 'round';

        if (ann.type === 'line') {
          c.beginPath();
          c.moveTo(ann.x1, ann.y1);
          c.lineTo(ann.x2, ann.y2);
          c.stroke();
        } else if (ann.type === 'arrow') {
          const angle = Math.atan2(ann.y2 - ann.y1, ann.x2 - ann.x1);
          const headLen = Math.max(18, ann.width * 3.5);
          c.beginPath();
          c.moveTo(ann.x1, ann.y1);
          c.lineTo(ann.x2, ann.y2);
          c.stroke();

          c.beginPath();
          c.moveTo(ann.x2, ann.y2);
          c.lineTo(ann.x2 - headLen * Math.cos(angle - Math.PI / 6), ann.y2 - headLen * Math.sin(angle - Math.PI / 6));
          c.lineTo(ann.x2 - headLen * Math.cos(angle + Math.PI / 6), ann.y2 - headLen * Math.sin(angle + Math.PI / 6));
          c.closePath();
          c.fill();
        } else if (ann.type === 'rect') {
          const cx = ann.x + ann.w / 2;
          const cy = ann.y + ann.h / 2;
          c.translate(cx, cy);
          c.rotate(ann.rotation || 0);
          c.strokeRect(-ann.w / 2, -ann.h / 2, ann.w, ann.h);
        } else if (ann.type === 'circle') {
          const cx = ann.x + ann.w / 2;
          const cy = ann.y + ann.h / 2;
          const rx = Math.max(1, Math.abs(ann.w) / 2);
          const ry = Math.max(1, Math.abs(ann.h) / 2);
          c.translate(cx, cy);
          c.rotate(ann.rotation || 0);
          c.beginPath();
          c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          c.stroke();
        } else if (ann.type === 'freehand' && ann.points && ann.points.length > 0) {
          c.beginPath();
          c.moveTo(ann.points[0].x, ann.points[0].y);
          for (let i = 1; i < ann.points.length; i++) {
            c.lineTo(ann.points[i].x, ann.points[i].y);
          }
          c.stroke();
        } else if (ann.type === 'text' && ann.text) {
          const bounds = getTextBounds(c, ann);
          c.fillStyle = 'rgba(15, 23, 42, 0.85)';
          roundRectPath(c, bounds.x, bounds.y, bounds.w, bounds.h, 8);
          c.fill();
          c.strokeStyle = ann.color;
          c.lineWidth = 2.5;
          c.stroke();

          c.font = `700 ${ann.size}px system-ui, "Noto Sans TC", sans-serif`;
          c.textBaseline = 'top';
          c.fillStyle = ann.color === '#000000' ? '#ffffff' : ann.color;
          c.fillText(ann.text, bounds.x + 10, bounds.y + 6);
        }
        c.restore();
      }

      function getTextBounds(c, ann) {
        c.save();
        c.font = `700 ${ann.size}px system-ui, "Noto Sans TC", sans-serif`;
        const w = Math.max(50, c.measureText(ann.text || '').width + 20);
        c.restore();
        return { x: ann.x, y: ann.y, w, h: ann.size + 12 };
      }

      function drawLayerHandles(c, layer) {
        const inv = 1 / state.viewport.scale;
        c.save();
        c.translate(layer.x, layer.y);
        c.rotate(layer.rotation);

        const hw = layer.width / 2;
        const hh = layer.height / 2;
        const rotDist = 36 * inv;
        const r = 10 * inv;

        c.strokeStyle = '#38bdf8';
        c.lineWidth = 2.5 * inv;
        c.strokeRect(-hw, -hh, layer.width, layer.height);

        // Rotation stem & knob
        c.beginPath();
        c.moveTo(0, -hh);
        c.lineTo(0, -hh - rotDist);
        c.stroke();

        c.fillStyle = '#38bdf8';
        c.strokeStyle = '#0f172a';
        c.lineWidth = 2 * inv;
        c.beginPath();
        c.arc(0, -hh - rotDist, r, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 4 Corner scale handles
        c.fillStyle = '#ffffff';
        c.strokeStyle = '#0284c7';
        [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach(([cx, cy]) => {
          c.beginPath();
          c.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        });
        c.restore();
      }

      function getAnnotationBox(ann) {
        if (ann.type === 'text') return getTextBounds(ctx, ann);
        if (ann.type === 'line' || ann.type === 'arrow') {
          const minX = Math.min(ann.x1, ann.x2);
          const maxX = Math.max(ann.x1, ann.x2);
          const minY = Math.min(ann.y1, ann.y2);
          const maxY = Math.max(ann.y1, ann.y2);
          return { x: minX, y: minY, w: Math.max(10, maxX - minX), h: Math.max(10, maxY - minY) };
        }
        if (ann.type === 'rect' || ann.type === 'circle') {
          const minX = Math.min(ann.x, ann.x + ann.w);
          const maxX = Math.max(ann.x, ann.x + ann.w);
          const minY = Math.min(ann.y, ann.y + ann.h);
          const maxY = Math.max(ann.y, ann.y + ann.h);
          return { x: minX, y: minY, w: Math.max(10, maxX - minX), h: Math.max(10, maxY - minY) };
        }
        if (ann.type === 'freehand' && ann.points.length) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          for (const p of ann.points) {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
          }
          const pad = ann.width || 6;
          return { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
        }
        return { x: 0, y: 0, w: 0, h: 0 };
      }

      function getAnnotationHandlePoints(ann) {
        if (ann.type === 'line' || ann.type === 'arrow') {
          return { p1: { x: ann.x1, y: ann.y1 }, p2: { x: ann.x2, y: ann.y2 } };
        }
        return {};
      }

      function drawAnnotationHandles(c, ann) {
        const inv = 1 / state.viewport.scale;

        // Rotated selection box + 4 corner handles + top-center rotation handle for rect & circle
        if (ann.type === 'rect' || ann.type === 'circle') {
          const cx = ann.x + ann.w / 2;
          const cy = ann.y + ann.h / 2;
          const hw = Math.abs(ann.w) / 2;
          const hh = Math.abs(ann.h) / 2;
          const pad = 6 * inv;
          const rotDist = 34 * inv;
          const r = 9 * inv;

          c.save();
          c.translate(cx, cy);
          c.rotate(ann.rotation || 0);

          // Dashed bounding box
          c.strokeStyle = '#38bdf8';
          c.lineWidth = 2 * inv;
          c.setLineDash([6 * inv, 4 * inv]);
          c.strokeRect(-hw - pad, -hh - pad, (hw + pad) * 2, (hh + pad) * 2);
          c.setLineDash([]);

          // Top-center rotation stem & touch-friendly circular knob
          c.beginPath();
          c.moveTo(0, -hh - pad);
          c.lineTo(0, -hh - pad - rotDist);
          c.stroke();

          c.fillStyle = '#38bdf8';
          c.strokeStyle = '#0f172a';
          c.lineWidth = 2 * inv;
          c.beginPath();
          c.arc(0, -hh - pad - rotDist, r * 1.12, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          // Subtle inner dot on rotation knob for visual distinction
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, -hh - pad - rotDist, r * 0.36, 0, Math.PI * 2);
          c.fill();

          // 4 rotated corner resize handles
          c.fillStyle = '#ffffff';
          c.strokeStyle = '#0284c7';
          c.lineWidth = 2 * inv;
          [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach(([hx, hy]) => {
            c.beginPath();
            c.arc(hx, hy, r * 0.92, 0, Math.PI * 2);
            c.fill();
            c.stroke();
          });

          c.restore();
          return;
        }

        // Standard axis-aligned handles for arrow, line, freehand, text
        const box = getAnnotationBox(ann);
        c.save();
        c.strokeStyle = '#38bdf8';
        c.lineWidth = 2 * inv;
        c.setLineDash([6 * inv, 4 * inv]);
        c.strokeRect(box.x - 6 * inv, box.y - 6 * inv, box.w + 12 * inv, box.h + 12 * inv);
        c.setLineDash([]);

        const handles = getAnnotationHandlePoints(ann);
        const r = 9 * inv;
        c.fillStyle = '#38bdf8';
        c.strokeStyle = '#ffffff';
        c.lineWidth = 2 * inv;
        Object.values(handles).forEach(pt => {
          c.beginPath();
          c.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        });
        c.restore();
      }

      function renderMainCanvas() {
        const dpr = window.devicePixelRatio || 1;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, el.mainCanvas.width, el.mainCanvas.height);

        ctx.scale(dpr, dpr);
        ctx.translate(state.viewport.offsetX, state.viewport.offsetY);
        ctx.scale(state.viewport.scale, state.viewport.scale);

        drawScene(ctx, true);
        ctx.restore();
      }

      /* =====================================================================
         8. MODE & TOOLBAR SWITCHING
         ===================================================================== */
      function setMode(mode) {
        state.mode = mode;
        state.eraserPreviewPt = null;
        [el.tabView, el.tabLayer, el.tabDraw].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        el.drawSubbar.classList.toggle('hidden', mode !== 'draw');

        if (mode === 'view') {
          el.modeBadge.textContent = '底圖檢視：拖曳平移、滾輪或雙指縮放';
        } else if (mode === 'layer') {
          el.modeBadge.textContent = '圖層編輯：點選疊圖可移動、拉四角縮放、拉頂端旋轉';
        } else if (mode === 'draw') {
          updateDrawModeBadge();
        }
        updateContextBars();
        renderMainCanvas();
      }

      function updateDrawModeBadge() {
        if (state.drawTool === 'select') {
          el.modeBadge.textContent = '選取編輯：可移動、拉四角縮放、拉頂端旋轉矩形/圓形或雙擊改字';
        } else if (state.drawTool === 'eraser') {
          el.modeBadge.textContent = '橡皮擦：點擊或滑過標註即可刪除（可用 −/+ 調整半徑）';
        } else if (state.drawTool === 'text') {
          el.modeBadge.textContent = '文字註解：點擊新增文字後，可直接按 −/+ 即時調整字體大小';
        } else {
          el.modeBadge.textContent = '標註繪圖：繪製完成後，可直接按 −/+ 即時調整該標註大小';
        }
      }

      function setDrawTool(tool) {
        state.drawTool = tool;
        state.eraserPreviewPt = null;
        el.drawSubbar.querySelectorAll('.tool-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tool === tool);
        });
        if (tool !== 'select') {
          state.selectedAnnotationId = null;
        }
        updateDrawModeBadge();
        updateContextBars();
        renderMainCanvas();
      }

      function updateContextBars() {
        const showLayerBar = state.mode === 'layer' && state.photoLayers.some(l => l.id === state.selectedLayerId);
        el.layerContextBar.classList.toggle('hidden', !showLayerBar);

        const selAnn = state.annotations.find(a => a.id === state.selectedAnnotationId);
        const showAnnBar = state.mode === 'draw' && Boolean(selAnn);
        el.annContextBar.classList.toggle('hidden', !showAnnBar);
        if (selAnn) {
          el.btnAnnEditText.classList.toggle('hidden', selAnn.type !== 'text');
          syncColorSwatch(selAnn.color);
        }
      }

      function syncColorSwatch(colorHex) {
        el.drawSubbar.querySelectorAll('.swatch').forEach(b => {
          b.classList.toggle('active', b.dataset.color.toLowerCase() === colorHex.toLowerCase());
        });
      }

      /* =====================================================================
         9. PARTIAL CROP MODAL (LOCAL CROP BEFORE OVERLAY + RE-CROP)
         ===================================================================== */
      function loadImageFromFile(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
          img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
          img.src = url;
        });
      }

      function getRotatedCanvas(img, quarter) {
        const q = ((quarter % 4) + 4) % 4;
        const off = document.createElement('canvas');
        off.width = q % 2 === 1 ? img.height : img.width;
        off.height = q % 2 === 1 ? img.width : img.height;
        const c = off.getContext('2d');
        c.translate(off.width / 2, off.height / 2);
        c.rotate((q * Math.PI) / 2);
        c.drawImage(img, -img.width / 2, -img.height / 2);
        return off;
      }

      function openNextQueuedPhoto() {
        if (state.photoQueue.length === 0) return;
        const item = state.photoQueue.shift();
        openCropModal({
          mode: 'new',
          targetLayerId: null,
          origImg: item.origImg,
          rotationQuarter: 0,
          dateStr: item.dateStr,
          hasGps: item.hasGps,
          aspect: null,
          cropNorm: { x: 0.12, y: 0.12, w: 0.76, h: 0.76 }
        });
      }

      function openCropModal(session) {
        state.cropSession = session;
        el.cropModalTitle.textContent = session.mode === 'recrop' ? '重新裁切局部' : '局部裁切';
        const gpsLabel = session.hasGps ? '已含 GPS' : '⚠ 無 GPS 訊號';
        el.cropModalSubtitle.textContent = `拍攝日: ${session.dateStr} ｜ ${gpsLabel}`;

        el.cropModal.querySelectorAll('.aspect-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.aspect === 'free');
        });
        el.cropModal.classList.remove('hidden');
        layoutCropCanvas();
      }

      function layoutCropCanvas() {
        const s = state.cropSession;
        if (!s) return;
        s.rotatedCanvas = getRotatedCanvas(s.origImg, s.rotationQuarter);
        const availW = Math.max(240, el.cropBody.clientWidth - 24);
        const availH = Math.max(240, el.cropBody.clientHeight - 24);
        const scale = Math.min(availW / s.rotatedCanvas.width, availH / s.rotatedCanvas.height);

        const cw = Math.max(120, Math.round(s.rotatedCanvas.width * scale));
        const ch = Math.max(120, Math.round(s.rotatedCanvas.height * scale));
        el.cropCanvas.width = cw;
        el.cropCanvas.height = ch;

        s.cropBox = {
          x: s.cropNorm.x * cw,
          y: s.cropNorm.y * ch,
          w: s.cropNorm.w * cw,
          h: s.cropNorm.h * ch
        };
        clampCropBox(s.cropBox, cw, ch);
        renderCropCanvas();
      }

      function clampCropBox(box, cw, ch) {
        const minSize = 36;
        box.w = Math.max(minSize, Math.min(cw, box.w));
        box.h = Math.max(minSize, Math.min(ch, box.h));
        box.x = Math.max(0, Math.min(cw - box.w, box.x));
        box.y = Math.max(0, Math.min(ch - box.h, box.y));
      }

      function getCropCornerHandles(box) {
        return {
          nw: { x: box.x, y: box.y },
          ne: { x: box.x + box.w, y: box.y },
          se: { x: box.x + box.w, y: box.y + box.h },
          sw: { x: box.x, y: box.y + box.h }
        };
      }

      function renderCropCanvas() {
        const s = state.cropSession;
        if (!s) return;
        const cw = el.cropCanvas.width;
        const ch = el.cropCanvas.height;
        const box = s.cropBox;

        cropCtx.clearRect(0, 0, cw, ch);
        cropCtx.drawImage(s.rotatedCanvas, 0, 0, cw, ch);

        cropCtx.fillStyle = 'rgba(2, 6, 23, 0.65)';
        cropCtx.beginPath();
        cropCtx.rect(0, 0, cw, ch);
        cropCtx.rect(box.x, box.y, box.w, box.h);
        cropCtx.fill('evenodd');

        cropCtx.strokeStyle = '#38bdf8';
        cropCtx.lineWidth = 2.5;
        cropCtx.strokeRect(box.x, box.y, box.w, box.h);

        cropCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        cropCtx.lineWidth = 1;
        cropCtx.beginPath();
        cropCtx.moveTo(box.x + box.w / 3, box.y); cropCtx.lineTo(box.x + box.w / 3, box.y + box.h);
        cropCtx.moveTo(box.x + (box.w * 2) / 3, box.y); cropCtx.lineTo(box.x + (box.w * 2) / 3, box.y + box.h);
        cropCtx.moveTo(box.x, box.y + box.h / 3); cropCtx.lineTo(box.x + box.w, box.y + box.h / 3);
        cropCtx.moveTo(box.x, box.y + (box.h * 2) / 3); cropCtx.lineTo(box.x + box.w, box.y + (box.h * 2) / 3);
        cropCtx.stroke();

        cropCtx.fillStyle = '#38bdf8';
        cropCtx.strokeStyle = '#ffffff';
        cropCtx.lineWidth = 2;
        Object.values(getCropCornerHandles(box)).forEach(pt => {
          cropCtx.beginPath();
          cropCtx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
          cropCtx.fill();
          cropCtx.stroke();
        });
      }

      let cropDrag = null;
      el.cropCanvas.addEventListener('pointerdown', (e) => {
        const s = state.cropSession;
        if (!s) return;
        e.preventDefault();
        el.cropCanvas.setPointerCapture(e.pointerId);
        const rect = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        const handles = getCropCornerHandles(s.cropBox);
        for (const [key, pt] of Object.entries(handles)) {
          if (Math.hypot(px - pt.x, py - pt.y) <= 26) {
            cropDrag = { mode: key, startX: px, startY: py, orig: { ...s.cropBox } };
            return;
          }
        }
        const b = s.cropBox;
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
          cropDrag = { mode: 'move', startX: px, startY: py, orig: { ...b } };
        }
      });

      el.cropCanvas.addEventListener('pointermove', (e) => {
        if (!cropDrag || !state.cropSession) return;
        e.preventDefault();
        const s = state.cropSession;
        const cw = el.cropCanvas.width;
        const ch = el.cropCanvas.height;
        const rect = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const dx = px - cropDrag.startX;
        const dy = py - cropDrag.startY;
        const o = cropDrag.orig;
        const minSize = 36;

        if (cropDrag.mode === 'move') {
          s.cropBox.x = Math.max(0, Math.min(cw - o.w, o.x + dx));
          s.cropBox.y = Math.max(0, Math.min(ch - o.h, o.y + dy));
        } else {
          let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
          if (cropDrag.mode.includes('w')) x1 = Math.max(0, Math.min(x2 - minSize, o.x + dx));
          if (cropDrag.mode.includes('e')) x2 = Math.min(cw, Math.max(x1 + minSize, o.x + o.w + dx));
          if (cropDrag.mode.includes('n')) y1 = Math.max(0, Math.min(y2 - minSize, o.y + dy));
          if (cropDrag.mode.includes('s')) y2 = Math.min(ch, Math.max(y1 + minSize, o.y + o.h + dy));

          let nw = x2 - x1;
          let nh = y2 - y1;
          if (s.aspect) {
            nh = nw / s.aspect;
            if (cropDrag.mode.includes('n')) y1 = y2 - nh;
            else y2 = y1 + nh;
            if (y1 < 0 || y2 > ch) {
              if (y1 < 0) { y1 = 0; nh = y2; }
              if (y2 > ch) { y2 = ch; nh = ch - y1; }
              nw = nh * s.aspect;
              if (cropDrag.mode.includes('w')) x1 = x2 - nw;
              else x2 = x1 + nw;
            }
          }
          s.cropBox = { x: x1, y: y1, w: Math.max(minSize, x2 - x1), h: Math.max(minSize, y2 - y1) };
          clampCropBox(s.cropBox, cw, ch);
        }
        s.cropNorm = {
          x: s.cropBox.x / cw,
          y: s.cropBox.y / ch,
          w: s.cropBox.w / cw,
          h: s.cropBox.h / ch
        };
        renderCropCanvas();
      });

      const endCropDrag = () => { cropDrag = null; };
      el.cropCanvas.addEventListener('pointerup', endCropDrag);
      el.cropCanvas.addEventListener('pointercancel', endCropDrag);

      function confirmCropAndOverlay() {
        const s = state.cropSession;
        if (!s) return;
        const src = s.rotatedCanvas;
        const sx = Math.round(s.cropNorm.x * src.width);
        const sy = Math.round(s.cropNorm.y * src.height);
        const sw = Math.max(8, Math.round(s.cropNorm.w * src.width));
        const sh = Math.max(8, Math.round(s.cropNorm.h * src.height));

        const maxDim = 1600;
        const outScale = Math.min(1, maxDim / Math.max(sw, sh));
        const outCanvas = document.createElement('canvas');
        outCanvas.width = Math.max(8, Math.round(sw * outScale));
        outCanvas.height = Math.max(8, Math.round(sh * outScale));
        outCanvas.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, outCanvas.width, outCanvas.height);

        if (s.mode === 'recrop' && s.targetLayerId) {
          const layer = state.photoLayers.find(l => l.id === s.targetLayerId);
          if (layer) {
            const aspect = outCanvas.width / outCanvas.height;
            layer.croppedCanvas = outCanvas;
            layer.rotationQuarter = s.rotationQuarter;
            layer.cropNorm = { ...s.cropNorm };
            layer.height = layer.width / aspect;
            showToast('已更新局部裁切範圍');
          }
        } else {
          const rect = el.mainCanvas.getBoundingClientRect();
          const centerWorld = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
          const targetW = Math.min(state.cadWidth * 0.34, Math.max(220, state.cadWidth * 0.28));
          const targetH = targetW / (outCanvas.width / outCanvas.height);
          const offset = (state.photoLayers.length % 5) * 26;

          const newLayer = {
            id: 'layer_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            origImg: s.origImg,
            croppedCanvas: outCanvas,
            cropNorm: { ...s.cropNorm },
            rotationQuarter: s.rotationQuarter,
            x: Math.max(80, Math.min(state.cadWidth - 80, centerWorld.x + offset)),
            y: Math.max(80, Math.min(state.cadHeight - 80, centerWorld.y + offset)),
            width: targetW,
            height: targetH,
            rotation: 0,
            dateStr: s.dateStr,
            hasGps: s.hasGps
          };
          state.photoLayers.push(newLayer);
          state.selectedLayerId = newLayer.id;
          setMode('layer');
          showToast('已將局部照片疊加至 CAD 平面圖');
        }

        el.cropModal.classList.add('hidden');
        state.cropSession = null;
        pushHistory();
        updateContextBars();
        renderMainCanvas();

        if (state.photoQueue.length > 0) {
          setTimeout(openNextQueuedPhoto, 80);
        }
      }

      /* =====================================================================
         10. MAIN CANVAS INTERACTIONS (VIEW, LAYER TRANSFORM, ROTATABLE VECTOR EDIT)
         ===================================================================== */
      const activePointers = new Map();
      let pinchStartDist = 0;
      let pinchStartScale = 1;
      let panLast = null;
      let layerTransform = null;
      let annTransform = null;
      let eraserDirty = false;
      let lastTap = { time: 0, annId: null };

      function worldToLayerLocal(pt, layer) {
        const dx = pt.x - layer.x;
        const dy = pt.y - layer.y;
        const cos = Math.cos(-layer.rotation);
        const sin = Math.sin(-layer.rotation);
        return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
      }

      function hitTestLayer(worldPt) {
        for (let i = state.photoLayers.length - 1; i >= 0; i--) {
          const l = state.photoLayers[i];
          const loc = worldToLayerLocal(worldPt, l);
          if (Math.abs(loc.x) <= l.width / 2 && Math.abs(loc.y) <= l.height / 2) {
            return l;
          }
        }
        return null;
      }

      function distToSegment(p, a, b) {
        const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        const t = Math.max(0, Math.min(1, ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2));
        return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
      }

      function hitTestAnnotation(pt) {
        const tol = 18 / state.viewport.scale;
        for (let i = state.annotations.length - 1; i >= 0; i--) {
          const ann = state.annotations[i];
          if (isPointNearAnnotation(pt, ann, tol)) return ann;
        }
        return null;
      }

      /**
       * Accurate hit-testing supporting rotated rect and rotated circle/ellipse
       * by transforming pointer world coordinates into each shape's local space.
       */
      function isPointNearAnnotation(pt, ann, tol) {
        if (ann.type === 'text') {
          const b = getTextBounds(ctx, ann);
          return pt.x >= b.x - tol && pt.x <= b.x + b.w + tol && pt.y >= b.y - tol && pt.y <= b.y + b.h + tol;
        }
        if (ann.type === 'line' || ann.type === 'arrow') {
          return distToSegment(pt, { x: ann.x1, y: ann.y1 }, { x: ann.x2, y: ann.y2 }) <= tol + (ann.width || 6) / 2;
        }
        if (ann.type === 'freehand' && ann.points) {
          for (let i = 0; i < ann.points.length; i++) {
            if (Math.hypot(pt.x - ann.points[i].x, pt.y - ann.points[i].y) <= tol + (ann.width || 6) / 2) return true;
          }
          return false;
        }
        if (ann.type === 'rect') {
          const loc = worldToShapeLocal(pt, ann);
          const hw = Math.abs(ann.w) / 2 + tol + (ann.width || 6) / 2;
          const hh = Math.abs(ann.h) / 2 + tol + (ann.width || 6) / 2;
          return Math.abs(loc.x) <= hw && Math.abs(loc.y) <= hh;
        }
        if (ann.type === 'circle') {
          const loc = worldToShapeLocal(pt, ann);
          const rx = Math.max(1, Math.abs(ann.w) / 2) + tol + (ann.width || 6) / 2;
          const ry = Math.max(1, Math.abs(ann.h) / 2) + tol + (ann.width || 6) / 2;
          return (loc.x * loc.x) / (rx * rx) + (loc.y * loc.y) / (ry * ry) <= 1;
        }
        return false;
      }

      function eraseAtPoint(pt) {
        const tol = state.toolSizes.eraser / state.viewport.scale;
        const before = state.annotations.length;
        state.annotations = state.annotations.filter(a => !isPointNearAnnotation(pt, a, tol));
        if (state.annotations.length !== before) {
          eraserDirty = true;
          if (!state.annotations.some(a => a.id === state.selectedAnnotationId)) {
            state.selectedAnnotationId = null;
            updateContextBars();
          }
        }
        renderMainCanvas();
      }

      el.mainCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        el.mainCanvas.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Two-finger pinch zoom works in any mode
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          pinchStartDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          pinchStartScale = state.viewport.scale;
          panLast = null;
          layerTransform = null;
          annTransform = null;
          state.activeDrawing = null;
          state.eraserPreviewPt = null;
          return;
        }

        const worldPt = screenToWorld(e.clientX, e.clientY);

        if (state.mode === 'view') {
          panLast = { x: e.clientX, y: e.clientY };
          return;
        }

        if (state.mode === 'layer') {
          const inv = 1 / state.viewport.scale;
          const hitR = 24 * inv;

          if (state.selectedLayerId) {
            const sel = state.photoLayers.find(l => l.id === state.selectedLayerId);
            if (sel) {
              const loc = worldToLayerLocal(worldPt, sel);
              const hw = sel.width / 2;
              const hh = sel.height / 2;
              const rotDist = 36 * inv;

              if (Math.hypot(loc.x, loc.y - (-hh - rotDist)) <= hitR) {
                layerTransform = {
                  mode: 'rotate',
                  layerId: sel.id,
                  startAngle: Math.atan2(worldPt.y - sel.y, worldPt.x - sel.x),
                  origRot: sel.rotation,
                  changed: false
                };
                return;
              }
              for (const [cx, cy] of [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]) {
                if (Math.hypot(loc.x - cx, loc.y - cy) <= hitR) {
                  layerTransform = {
                    mode: 'scale',
                    layerId: sel.id,
                    startDist: Math.max(10, Math.hypot(worldPt.x - sel.x, worldPt.y - sel.y)),
                    origW: sel.width,
                    origH: sel.height,
                    changed: false
                  };
                  return;
                }
              }
            }
          }

          const hit = hitTestLayer(worldPt);
          if (hit) {
            state.selectedLayerId = hit.id;
            updateExifStatus(hit.dateStr, hit.hasGps);
            updateContextBars();
            layerTransform = {
              mode: 'move',
              layerId: hit.id,
              startWorld: worldPt,
              origX: hit.x,
              origY: hit.y,
              changed: false
            };
            renderMainCanvas();
          } else {
            state.selectedLayerId = null;
            updateContextBars();
            renderMainCanvas();
          }
          return;
        }

        if (state.mode === 'draw') {
          if (state.drawTool === 'eraser') {
            eraserDirty = false;
            state.eraserPreviewPt = worldPt;
            eraseAtPoint(worldPt);
            return;
          }

          if (state.drawTool === 'select') {
            const inv = 1 / state.viewport.scale;
            const hitR = 24 * inv;

            if (state.selectedAnnotationId) {
              const sel = state.annotations.find(a => a.id === state.selectedAnnotationId);
              if (sel) {
                // 1) Rotated rect / circle handle hit-testing in local unrotated space
                if (sel.type === 'rect' || sel.type === 'circle') {
                  const loc = worldToShapeLocal(worldPt, sel);
                  const hw = Math.abs(sel.w) / 2;
                  const hh = Math.abs(sel.h) / 2;
                  const pad = 6 * inv;
                  const rotDist = 34 * inv;

                  // Top-center rotation handle
                  if (Math.hypot(loc.x, loc.y - (-hh - pad - rotDist)) <= hitR) {
                    annTransform = {
                      mode: 'rotateShape',
                      annId: sel.id,
                      cx: sel.x + sel.w / 2,
                      cy: sel.y + sel.h / 2,
                      changed: false
                    };
                    return;
                  }

                  // 4 corner resize handles (anchor opposite corner in world space)
                  const corners = [
                    { key: 'nw', x: -hw, y: -hh, anchorLocalX: hw,  anchorLocalY: hh,  signX: -1, signY: -1 },
                    { key: 'ne', x: hw,  y: -hh, anchorLocalX: -hw, anchorLocalY: hh,  signX: 1,  signY: -1 },
                    { key: 'se', x: hw,  y: hh,  anchorLocalX: -hw, anchorLocalY: -hh, signX: 1,  signY: 1  },
                    { key: 'sw', x: -hw, y: hh,  anchorLocalX: hw,  anchorLocalY: -hh, signX: -1, signY: 1  }
                  ];
                  for (const c of corners) {
                    if (Math.hypot(loc.x - c.x, loc.y - c.y) <= hitR) {
                      const rot = sel.rotation || 0;
                      const cos = Math.cos(rot);
                      const sin = Math.sin(rot);
                      const origCx = sel.x + sel.w / 2;
                      const origCy = sel.y + sel.h / 2;
                      annTransform = {
                        mode: 'resizeRotated',
                        annId: sel.id,
                        rot,
                        cos,
                        sin,
                        signX: c.signX,
                        signY: c.signY,
                        anchorWorldX: origCx + c.anchorLocalX * cos - c.anchorLocalY * sin,
                        anchorWorldY: origCy + c.anchorLocalX * sin + c.anchorLocalY * cos,
                        changed: false
                      };
                      return;
                    }
                  }
                } else {
                  // 2) Endpoint handles for arrow & line
                  const handles = getAnnotationHandlePoints(sel);
                  for (const [key, pt] of Object.entries(handles)) {
                    if (Math.hypot(worldPt.x - pt.x, worldPt.y - pt.y) <= hitR) {
                      annTransform = {
                        mode: 'handle',
                        handleKey: key,
                        annId: sel.id,
                        startWorld: worldPt,
                        orig: { ...sel, points: sel.points ? sel.points.map(p => ({ ...p })) : undefined },
                        changed: false
                      };
                      return;
                    }
                  }
                }
              }
            }

            const hit = hitTestAnnotation(worldPt);
            if (hit) {
              const now = Date.now();
              if (hit.type === 'text' && lastTap.annId === hit.id && now - lastTap.time < 420) {
                lastTap = { time: 0, annId: null };
                openTextModal(null, hit);
                return;
              }
              lastTap = { time: now, annId: hit.id };
              state.selectedAnnotationId = hit.id;
              updateContextBars();
              annTransform = {
                mode: 'move',
                annId: hit.id,
                startWorld: worldPt,
                orig: { ...hit, points: hit.points ? hit.points.map(p => ({ ...p })) : undefined },
                changed: false
              };
              renderMainCanvas();
            } else {
              state.selectedAnnotationId = null;
              updateContextBars();
              renderMainCanvas();
            }
            return;
          }

          if (state.drawTool === 'text') {
            const hit = hitTestAnnotation(worldPt);
            if (hit && hit.type === 'text') {
              state.selectedAnnotationId = hit.id;
              updateContextBars();
              openTextModal(null, hit);
              return;
            }
            openTextModal(worldPt, null);
            return;
          }

          // Start drawing new vector shape using its independent tool size
          state.selectedAnnotationId = null;
          updateContextBars();
          const toolWidth = state.toolSizes[state.drawTool] || 6;
          const id = 'ann_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

          if (state.drawTool === 'arrow' || state.drawTool === 'line') {
            state.activeDrawing = {
              id, type: state.drawTool,
              x1: worldPt.x, y1: worldPt.y, x2: worldPt.x, y2: worldPt.y,
              color: state.drawColor, width: toolWidth
            };
          } else if (state.drawTool === 'rect' || state.drawTool === 'circle') {
            state.activeDrawing = {
              id, type: state.drawTool,
              x: worldPt.x, y: worldPt.y, w: 0, h: 0,
              rotation: 0,
              color: state.drawColor, width: toolWidth
            };
          } else if (state.drawTool === 'freehand') {
            state.activeDrawing = {
              id, type: 'freehand',
              points: [{ x: worldPt.x, y: worldPt.y }],
              color: state.drawColor, width: toolWidth
            };
          }
          renderMainCanvas();
        }
      });

      el.mainCanvas.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        e.preventDefault();
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Pinch zoom
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          if (pinchStartDist > 10) {
            const rect = el.mainCanvas.getBoundingClientRect();
            const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
            const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
            const desired = Math.max(0.1, Math.min(8, pinchStartScale * (dist / pinchStartDist)));
            zoomAtScreenPoint(desired / state.viewport.scale, midX, midY);
          }
          return;
        }

        if (state.mode === 'view' && panLast) {
          state.viewport.offsetX += e.clientX - panLast.x;
          state.viewport.offsetY += e.clientY - panLast.y;
          panLast = { x: e.clientX, y: e.clientY };
          renderMainCanvas();
          return;
        }

        const worldPt = screenToWorld(e.clientX, e.clientY);

        if (state.mode === 'layer' && layerTransform) {
          const l = state.photoLayers.find(item => item.id === layerTransform.layerId);
          if (!l) return;
          if (layerTransform.mode === 'move') {
            l.x = layerTransform.origX + (worldPt.x - layerTransform.startWorld.x);
            l.y = layerTransform.origY + (worldPt.y - layerTransform.startWorld.y);
            layerTransform.changed = true;
          } else if (layerTransform.mode === 'scale') {
            const curDist = Math.max(12, Math.hypot(worldPt.x - l.x, worldPt.y - l.y));
            const ratio = Math.max(0.15, Math.min(6, curDist / layerTransform.startDist));
            l.width = layerTransform.origW * ratio;
            l.height = layerTransform.origH * ratio;
            layerTransform.changed = true;
          } else if (layerTransform.mode === 'rotate') {
            const curAngle = Math.atan2(worldPt.y - l.y, worldPt.x - l.x);
            l.rotation = layerTransform.origRot + (curAngle - layerTransform.startAngle);
            layerTransform.changed = true;
          }
          renderMainCanvas();
          return;
        }

        if (state.mode === 'draw') {
          if (state.drawTool === 'eraser') {
            state.eraserPreviewPt = worldPt;
            eraseAtPoint(worldPt);
            return;
          }

          if (state.drawTool === 'select' && annTransform) {
            const ann = state.annotations.find(a => a.id === annTransform.annId);
            if (!ann) return;

            if (annTransform.mode === 'move') {
              const o = annTransform.orig;
              const dx = worldPt.x - annTransform.startWorld.x;
              const dy = worldPt.y - annTransform.startWorld.y;
              if (ann.type === 'arrow' || ann.type === 'line') {
                ann.x1 = o.x1 + dx; ann.y1 = o.y1 + dy;
                ann.x2 = o.x2 + dx; ann.y2 = o.y2 + dy;
              } else if (ann.type === 'rect' || ann.type === 'circle' || ann.type === 'text') {
                ann.x = o.x + dx; ann.y = o.y + dy;
              } else if (ann.type === 'freehand') {
                ann.points = o.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
              }
              annTransform.changed = true;
            } else if (annTransform.mode === 'rotateShape') {
              const angle = Math.atan2(worldPt.y - annTransform.cy, worldPt.x - annTransform.cx) + Math.PI / 2;
              ann.rotation = angle;
              annTransform.changed = true;
              const deg = ((Math.round((angle * 180) / Math.PI) % 360) + 360) % 360;
              showSizeHud(`旋轉角度：${deg}°`);
            } else if (annTransform.mode === 'resizeRotated') {
              const vx = worldPt.x - annTransform.anchorWorldX;
              const vy = worldPt.y - annTransform.anchorWorldY;
              const localDx = vx * annTransform.cos + vy * annTransform.sin;
              const localDy = -vx * annTransform.sin + vy * annTransform.cos;
              const minSize = Math.max(12, 16 / state.viewport.scale);

              const newW = Math.max(minSize, localDx * annTransform.signX);
              const newH = Math.max(minSize, localDy * annTransform.signY);

              const halfLocalX = (annTransform.signX * newW) / 2;
              const halfLocalY = (annTransform.signY * newH) / 2;
              const newCx = annTransform.anchorWorldX + halfLocalX * annTransform.cos - halfLocalY * annTransform.sin;
              const newCy = annTransform.anchorWorldY + halfLocalX * annTransform.sin + halfLocalY * annTransform.cos;

              ann.x = newCx - newW / 2;
              ann.y = newCy - newH / 2;
              ann.w = newW;
              ann.h = newH;
              annTransform.changed = true;
            } else if (annTransform.mode === 'handle') {
              const k = annTransform.handleKey;
              if (k === 'p1') { ann.x1 = worldPt.x; ann.y1 = worldPt.y; }
              else if (k === 'p2') { ann.x2 = worldPt.x; ann.y2 = worldPt.y; }
              annTransform.changed = true;
            }
            renderMainCanvas();
            return;
          }

          if (state.activeDrawing) {
            const d = state.activeDrawing;
            if (d.type === 'arrow' || d.type === 'line') {
              d.x2 = worldPt.x; d.y2 = worldPt.y;
            } else if (d.type === 'rect' || d.type === 'circle') {
              d.w = worldPt.x - d.x; d.h = worldPt.y - d.y;
            } else if (d.type === 'freehand') {
              d.points.push({ x: worldPt.x, y: worldPt.y });
            }
            renderMainCanvas();
          }
        }
      });

      function handlePointerUp(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) pinchStartDist = 0;
        panLast = null;

        if (state.eraserPreviewPt) {
          state.eraserPreviewPt = null;
          renderMainCanvas();
        }

        if (layerTransform) {
          if (layerTransform.changed) pushHistory();
          layerTransform = null;
        }

        if (annTransform) {
          if (annTransform.changed) pushHistory();
          annTransform = null;
        }

        if (eraserDirty) {
          eraserDirty = false;
          pushHistory();
          showToast('已擦除標註');
        }

        if (state.activeDrawing) {
          const d = state.activeDrawing;
          state.activeDrawing = null;

          if (d.type === 'rect' || d.type === 'circle') {
            if (d.w < 0) { d.x += d.w; d.w = Math.abs(d.w); }
            if (d.h < 0) { d.y += d.h; d.h = Math.abs(d.h); }
          }

          const minDrag = 6 / state.viewport.scale;
          const isTiny =
            ((d.type === 'arrow' || d.type === 'line') && Math.hypot(d.x2 - d.x1, d.y2 - d.y1) < minDrag) ||
            ((d.type === 'rect' || d.type === 'circle') && Math.hypot(d.w, d.h) < minDrag) ||
            (d.type === 'freehand' && d.points.length < 2);

          if (isTiny) {
            const tapPt = d.type === 'freehand' ? d.points[0] : (d.x1 !== undefined ? { x: d.x1, y: d.y1 } : { x: d.x, y: d.y });
            const hit = hitTestAnnotation(tapPt);
            if (hit) {
              setDrawTool('select');
              state.selectedAnnotationId = hit.id;
              updateContextBars();
            }
            renderMainCanvas();
            return;
          }

          state.annotations.push(d);
          state.selectedAnnotationId = d.id;
          updateContextBars();
          pushHistory();
          renderMainCanvas();
        }
      }

      el.mainCanvas.addEventListener('pointerup', handlePointerUp);
      el.mainCanvas.addEventListener('pointercancel', handlePointerUp);

      el.mainCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = el.mainCanvas.getBoundingClientRect();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        zoomAtScreenPoint(factor, e.clientX - rect.left, e.clientY - rect.top);
      }, { passive: false });

      /* =====================================================================
         11. TEXT MODAL & CUSTOM QUICK SNIPPETS MANAGER
         ===================================================================== */
      let resetArmTimer = null;

      function syncTextCursor() {
        const len = el.textInput.value.length;
        const s = typeof el.textInput.selectionStart === 'number' ? el.textInput.selectionStart : len;
        const e = typeof el.textInput.selectionEnd === 'number' ? el.textInput.selectionEnd : len;
        state.textCursor = { start: s, end: e };
      }

      function insertSnippetIntoTextInput(snippetText) {
        const val = el.textInput.value;
        const start = Math.max(0, Math.min(val.length, state.textCursor.start));
        const end = Math.max(start, Math.min(val.length, state.textCursor.end));
        const nextVal = val.slice(0, start) + snippetText + val.slice(end);
        const nextPos = start + snippetText.length;

        el.textInput.value = nextVal;
        state.textCursor = { start: nextPos, end: nextPos };

        try {
          el.textInput.setSelectionRange(nextPos, nextPos);
        } catch (err) {
          // Safe fallback if browser restricts selection range while unfocused
        }
      }

      function getAllCategories() {
        const set = new Set(DEFAULT_CATEGORIES);
        for (const item of state.snippets) {
          if (item.category) set.add(item.category);
        }
        return Array.from(set);
      }

      function populateCategorySelect(selectedCat) {
        const cats = getAllCategories();
        el.snippetCatSelect.innerHTML = '';
        cats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          el.snippetCatSelect.appendChild(opt);
        });
        const customOpt = document.createElement('option');
        customOpt.value = '__NEW__';
        customOpt.textContent = '＋自訂新分類...';
        el.snippetCatSelect.appendChild(customOpt);

        if (selectedCat && cats.includes(selectedCat)) {
          el.snippetCatSelect.value = selectedCat;
          el.snippetCustomCatRow.classList.add('hidden');
        } else {
          el.snippetCatSelect.value = cats[0] || '自訂';
          el.snippetCustomCatRow.classList.add('hidden');
        }
      }

      function openSnippetEditor(mode, snippetObj) {
        state.snippetEditorMode = mode;
        state.editingSnippetId = snippetObj ? snippetObj.id : null;
        el.snippetEditorTitle.textContent = mode === 'edit' ? '修改常用詞' : '新增常用詞';
        el.snippetTextInput.value = snippetObj ? snippetObj.text : '';
        el.snippetCustomCatInput.value = '';
        populateCategorySelect(snippetObj ? snippetObj.category : '樓層');
        el.snippetEditor.classList.remove('hidden');
        el.btnSnippetAddToggle.classList.toggle('active-add', mode === 'add');
        renderSnippets();
        setTimeout(() => { el.snippetTextInput.focus(); }, 30);
      }

      function closeSnippetEditor() {
        state.snippetEditorMode = null;
        state.editingSnippetId = null;
        el.snippetEditor.classList.add('hidden');
        el.snippetCustomCatRow.classList.add('hidden');
        el.btnSnippetAddToggle.classList.remove('active-add');
        renderSnippets();
      }

      function saveSnippetFromEditor() {
        const text = el.snippetTextInput.value.trim();
        if (!text) {
          showToast('請輸入常用詞內容');
          el.snippetTextInput.focus();
          return;
        }
        let category = el.snippetCatSelect.value;
        if (category === '__NEW__') {
          const customCat = el.snippetCustomCatInput.value.trim();
          category = customCat || '自訂';
        }

        if (state.snippetEditorMode === 'edit' && state.editingSnippetId) {
          const target = state.snippets.find(s => s.id === state.editingSnippetId);
          if (target) {
            target.text = text;
            target.category = category;
          }
          showToast('已更新常用詞');
        } else {
          state.snippets.push({
            id: 'sn_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            text,
            category
          });
          showToast('已新增常用詞');
        }

        saveSnippetsToStorage(state.snippets);
        closeSnippetEditor();
      }

      function deleteSnippet(id) {
        state.snippets = state.snippets.filter(s => s.id !== id);
        if (state.editingSnippetId === id) {
          closeSnippetEditor();
        }
        saveSnippetsToStorage(state.snippets);
        renderSnippets();
      }

      function disarmResetButton() {
        state.resetArmed = false;
        clearTimeout(resetArmTimer);
        el.btnSnippetReset.textContent = '恢復預設';
        el.btnSnippetReset.classList.remove('armed');
      }

      function createChipElement(item) {
        const wrap = document.createElement('div');
        wrap.className = 'chip-wrap';
        if (state.snippetManageMode) wrap.classList.add('managing');
        if (state.editingSnippetId === item.id) wrap.classList.add('editing-target');

        const mainBtn = document.createElement('button');
        mainBtn.type = 'button';
        mainBtn.className = 'chip-main-btn';
        mainBtn.textContent = item.text;
        mainBtn.title = state.snippetManageMode ? '點擊修改此常用詞' : `點擊插入「${item.text}」`;

        mainBtn.addEventListener('click', () => {
          if (state.snippetManageMode) {
            openSnippetEditor('edit', item);
          } else {
            insertSnippetIntoTextInput(item.text);
          }
        });
        wrap.appendChild(mainBtn);

        if (state.snippetManageMode) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'chip-del-btn';
          delBtn.textContent = '×';
          delBtn.title = `刪除「${item.text}」`;
          delBtn.setAttribute('aria-label', `刪除 ${item.text}`);
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteSnippet(item.id);
          });
          wrap.appendChild(delBtn);
        }

        return wrap;
      }

      function renderSnippets() {
        el.btnSnippetLayout.textContent = state.snippetLayout === 'grouped' ? '全部清單' : '分類檢視';
        el.btnSnippetManageToggle.classList.toggle('active-manage', state.snippetManageMode);
        el.btnSnippetManageToggle.textContent = state.snippetManageMode ? '完成管理' : '編輯／刪除';
        el.snippetManageFooter.classList.toggle('hidden', !state.snippetManageMode);

        const container = el.snippetsScroll;
        container.innerHTML = '';

        if (state.snippets.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'snippets-empty';
          empty.textContent = '尚無常用詞，可點選「＋新增」建立自定義詞彙';
          container.appendChild(empty);
          return;
        }

        if (state.snippetLayout === 'flat') {
          const listEl = document.createElement('div');
          listEl.className = 'chip-list';
          state.snippets.forEach(item => listEl.appendChild(createChipElement(item)));
          container.appendChild(listEl);
        } else {
          const grouped = new Map();
          DEFAULT_CATEGORIES.forEach(cat => grouped.set(cat, []));
          state.snippets.forEach(item => {
            const cat = item.category || '自訂';
            if (!grouped.has(cat)) grouped.set(cat, []);
            grouped.get(cat).push(item);
          });

          grouped.forEach((items, catName) => {
            if (items.length === 0) return;
            const grp = document.createElement('div');
            grp.className = 'snippet-group';

            const title = document.createElement('div');
            title.className = 'snippet-group-title';
            title.textContent = catName;
            grp.appendChild(title);

            const listEl = document.createElement('div');
            listEl.className = 'chip-list';
            items.forEach(item => listEl.appendChild(createChipElement(item)));
            grp.appendChild(listEl);

            container.appendChild(grp);
          });
        }
      }

      function openTextModal(worldPt, existingAnn) {
        state.pendingTextPos = worldPt;
        state.editingTextAnnId = existingAnn ? existingAnn.id : null;
        state.snippetManageMode = false;
        disarmResetButton();
        closeSnippetEditor();

        el.textModalTitle.textContent = existingAnn ? '編輯文字註解' : '新增文字註解';
        el.textInput.value = existingAnn ? existingAnn.text : '';
        const endPos = el.textInput.value.length;
        state.textCursor = { start: endPos, end: endPos };

        renderSnippets();
        el.textModal.classList.remove('hidden');
      }

      function confirmTextModal() {
        const text = el.textInput.value.trim();
        el.textModal.classList.add('hidden');
        closeSnippetEditor();
        disarmResetButton();
        if (!text) {
          state.pendingTextPos = null;
          state.editingTextAnnId = null;
          return;
        }
        if (state.editingTextAnnId) {
          const target = state.annotations.find(a => a.id === state.editingTextAnnId);
          if (target) {
            target.text = text;
            pushHistory();
            renderMainCanvas();
            showToast('已更新文字註解');
          }
          state.editingTextAnnId = null;
          return;
        }
        if (state.pendingTextPos) {
          const ann = {
            id: 'ann_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            type: 'text',
            x: state.pendingTextPos.x,
            y: state.pendingTextPos.y,
            text,
            color: state.drawColor,
            size: state.toolSizes.text
          };
          state.annotations.push(ann);
          state.selectedAnnotationId = ann.id;
          state.pendingTextPos = null;
          updateContextBars();
          pushHistory();
          renderMainCanvas();
        }
      }

      /* =====================================================================
         12. EXPORT SCREENSHOT (FULL RESOLUTION + BOTTOM-RIGHT DATE WATERMARK)
         ===================================================================== */
      let exportBlob = null;
      let exportDataUrl = '';

      function getExportFilename() {
        const safe = (el.watermarkDateInput.value.trim() || formatDateFromMs()).replace(/[\/\\:*?"<>|]/g, '-');
        return `工地CAD標註_${safe}.png`;
      }

      function drawDateWatermark(c, w, h, dateLabel) {
        const base = Math.min(w, h);
        const fontSize = Math.max(15, Math.min(34, Math.round(base * 0.022)));
        const padX = Math.round(fontSize * 0.65);
        const padY = Math.round(fontSize * 0.35);
        const margin = Math.round(base * 0.022);

        c.save();
        c.font = `500 ${fontSize}px ui-monospace, SFMono-Regular, system-ui, sans-serif`;
        c.textBaseline = 'middle';
        c.textAlign = 'left';

        const textW = c.measureText(dateLabel).width;
        const boxW = textW + padX * 2;
        const boxH = fontSize + padY * 2;
        const x = w - boxW - margin;
        const y = h - boxH - margin;

        c.fillStyle = 'rgba(15, 23, 42, 0.65)';
        roundRectPath(c, x, y, boxW, boxH, Math.round(boxH * 0.28));
        c.fill();

        c.fillStyle = 'rgba(248, 250, 252, 0.94)';
        c.fillText(dateLabel, x + padX, y + boxH / 2 + 1);
        c.restore();
      }

      function renderExportPreview() {
        const maxSide = 3000;
        const scale = Math.min(1, maxSide / Math.max(state.cadWidth, state.cadHeight));
        const outW = Math.round(state.cadWidth * scale);
        const outH = Math.round(state.cadHeight * scale);

        const off = document.createElement('canvas');
        off.width = outW;
        off.height = outH;
        const eCtx = off.getContext('2d');

        eCtx.save();
        eCtx.scale(scale, scale);
        drawScene(eCtx, false);
        eCtx.restore();

        const dateLabel = el.watermarkDateInput.value.trim() || formatDateFromMs();
        drawDateWatermark(eCtx, outW, outH, dateLabel);

        exportDataUrl = off.toDataURL('image/png');
        el.exportPreviewImg.src = exportDataUrl;
        off.toBlob((blob) => { exportBlob = blob; }, 'image/png');
      }

      function triggerBlobDownload() {
        if (!exportBlob && !exportDataUrl) return;
        const a = document.createElement('a');
        a.download = getExportFilename();
        if (exportBlob) {
          const url = URL.createObjectURL(exportBlob);
          a.href = url;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } else {
          a.href = exportDataUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }

      /* =====================================================================
         13. EVENT WIRING
         ===================================================================== */
      // Import CAD
      el.btnImportCad.addEventListener('click', () => {
        el.cadFileInput.value = '';
        el.cadFileInput.click();
      });

      el.cadFileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const img = await loadImageFromFile(file);
          state.cadImage = img;
          state.cadName = file.name;
          state.cadWidth = img.naturalWidth || img.width;
          state.cadHeight = img.naturalHeight || img.height;
          el.cadNameDisplay.textContent = file.name;
          el.cadNameDisplay.title = file.name;
          fitCadToScreen();
          showToast(`已匯入 CAD 底圖 (${state.cadWidth}×${state.cadHeight})`);
        } catch (err) {
          showToast('無法讀取該 CAD 影像檔');
        }
      });

      // Add Photos -> EXIF -> Partial Crop Modal Queue
      el.tabAddPhoto.addEventListener('click', () => {
        el.photoFileInput.value = '';
        el.photoFileInput.click();
      });

      el.photoFileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        for (const file of files) {
          try {
            const buf = await file.arrayBuffer();
            const exif = ExifParser.parse(buf);
            const dateStr = exif.dateStr || formatDateFromMs(file.lastModified);
            updateExifStatus(dateStr, exif.hasGps);
            const img = await loadImageFromFile(file);
            state.photoQueue.push({ origImg: img, dateStr, hasGps: exif.hasGps });
          } catch (err) {
            console.warn('Photo load skipped:', err);
          }
        }
        openNextQueuedPhoto();
      });

      // Mode Tabs
      el.tabView.addEventListener('click', () => setMode('view'));
      el.tabLayer.addEventListener('click', () => setMode('layer'));
      el.tabDraw.addEventListener('click', () => setMode('draw'));

      // Undo / Redo
      el.btnUndo.addEventListener('click', undo);
      el.btnRedo.addEventListener('click', redo);

      // Zoom Controls
      el.btnZoomIn.addEventListener('click', () => {
        const r = el.mainCanvas.getBoundingClientRect();
        zoomAtScreenPoint(1.22, r.width / 2, r.height / 2);
      });
      el.btnZoomOut.addEventListener('click', () => {
        const r = el.mainCanvas.getBoundingClientRect();
        zoomAtScreenPoint(0.82, r.width / 2, r.height / 2);
      });
      el.btnZoomFit.addEventListener('click', fitCadToScreen);

      // Layer Contextual Actions
      el.btnLayerRecrop.addEventListener('click', () => {
        const layer = state.photoLayers.find(l => l.id === state.selectedLayerId);
        if (!layer) return;
        openCropModal({
          mode: 'recrop',
          targetLayerId: layer.id,
          origImg: layer.origImg,
          rotationQuarter: layer.rotationQuarter || 0,
          dateStr: layer.dateStr,
          hasGps: layer.hasGps,
          aspect: null,
          cropNorm: { ...layer.cropNorm }
        });
      });

      el.btnLayerUp.addEventListener('click', () => {
        const idx = state.photoLayers.findIndex(l => l.id === state.selectedLayerId);
        if (idx >= 0 && idx < state.photoLayers.length - 1) {
          const [item] = state.photoLayers.splice(idx, 1);
          state.photoLayers.splice(idx + 1, 0, item);
          pushHistory();
          renderMainCanvas();
          showToast('已上移圖層');
        }
      });

      el.btnLayerDown.addEventListener('click', () => {
        const idx = state.photoLayers.findIndex(l => l.id === state.selectedLayerId);
        if (idx > 0) {
          const [item] = state.photoLayers.splice(idx, 1);
          state.photoLayers.splice(idx - 1, 0, item);
          pushHistory();
          renderMainCanvas();
          showToast('已下移圖層');
        }
      });

      el.btnLayerDelete.addEventListener('click', () => {
        const idx = state.photoLayers.findIndex(l => l.id === state.selectedLayerId);
        if (idx >= 0) {
          state.photoLayers.splice(idx, 1);
          state.selectedLayerId = null;
          updateContextBars();
          pushHistory();
          renderMainCanvas();
          showToast('已刪除疊加照片');
        }
      });

      // Annotation Contextual Actions
      el.btnAnnEditText.addEventListener('click', () => {
        const sel = state.annotations.find(a => a.id === state.selectedAnnotationId);
        if (sel && sel.type === 'text') openTextModal(null, sel);
      });

      el.btnAnnDuplicate.addEventListener('click', () => {
        const sel = state.annotations.find(a => a.id === state.selectedAnnotationId);
        if (!sel) return;
        const off = 28 / state.viewport.scale;
        const copy = {
          ...sel,
          id: 'ann_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          x: sel.x !== undefined ? sel.x + off : undefined,
          y: sel.y !== undefined ? sel.y + off : undefined,
          x1: sel.x1 !== undefined ? sel.x1 + off : undefined,
          y1: sel.y1 !== undefined ? sel.y1 + off : undefined,
          x2: sel.x2 !== undefined ? sel.x2 + off : undefined,
          y2: sel.y2 !== undefined ? sel.y2 + off : undefined,
          points: sel.points ? sel.points.map(p => ({ x: p.x + off, y: p.y + off })) : undefined
        };
        state.annotations.push(copy);
        state.selectedAnnotationId = copy.id;
        updateContextBars();
        pushHistory();
        renderMainCanvas();
        showToast('已複製標註');
      });

      el.btnAnnDelete.addEventListener('click', () => {
        const idx = state.annotations.findIndex(a => a.id === state.selectedAnnotationId);
        if (idx >= 0) {
          state.annotations.splice(idx, 1);
          state.selectedAnnotationId = null;
          updateContextBars();
          pushHistory();
          renderMainCanvas();
          showToast('已刪除標註');
        }
      });

      // Draw Tools, Color Swatches & Independent -/+ Size Controls
      el.drawSubbar.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => setDrawTool(btn.dataset.tool));
      });

      el.drawSubbar.querySelectorAll('.swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          state.drawColor = btn.dataset.color;
          syncColorSwatch(state.drawColor);
          if (state.mode === 'draw' && state.selectedAnnotationId) {
            const sel = state.annotations.find(a => a.id === state.selectedAnnotationId);
            if (sel && sel.color !== state.drawColor) {
              sel.color = state.drawColor;
              pushHistory();
              renderMainCanvas();
            }
          }
        });
      });

      el.btnSizeMinus.addEventListener('click', () => adjustCurrentSize(-1));
      el.btnSizePlus.addEventListener('click', () => adjustCurrentSize(1));

      // Crop Modal Buttons
      el.btnCropCancel.addEventListener('click', () => {
        el.cropModal.classList.add('hidden');
        state.cropSession = null;
        if (state.photoQueue.length > 0) setTimeout(openNextQueuedPhoto, 60);
      });

      el.btnCropConfirm.addEventListener('click', confirmCropAndOverlay);

      el.btnCropRotate.addEventListener('click', () => {
        if (!state.cropSession) return;
        state.cropSession.rotationQuarter = (state.cropSession.rotationQuarter + 1) % 4;
        state.cropSession.cropNorm = { x: 0.12, y: 0.12, w: 0.76, h: 0.76 };
        layoutCropCanvas();
      });

      el.cropModal.querySelectorAll('.aspect-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = state.cropSession;
          if (!s) return;
          el.cropModal.querySelectorAll('.aspect-btn').forEach(b => b.classList.toggle('active', b === btn));
          const val = btn.dataset.aspect;
          s.aspect = val === 'free' ? null : parseFloat(val);
          if (s.aspect) {
            const cw = el.cropCanvas.width;
            const ch = el.cropCanvas.height;
            let w = s.cropBox.w;
            let h = w / s.aspect;
            if (h > ch * 0.85) { h = ch * 0.85; w = h * s.aspect; }
            if (w > cw * 0.85) { w = cw * 0.85; h = w / s.aspect; }
            s.cropBox = { x: (cw - w) / 2, y: (ch - h) / 2, w, h };
            s.cropNorm = { x: s.cropBox.x / cw, y: s.cropBox.y / ch, w: s.cropBox.w / cw, h: s.cropBox.h / ch };
            renderCropCanvas();
          }
        });
      });

      // Text Modal & Custom Snippets Events
      ['input', 'click', 'keyup', 'select'].forEach(evt => {
        el.textInput.addEventListener(evt, syncTextCursor);
      });

      el.btnTextClear.addEventListener('click', () => {
        el.textInput.value = '';
        state.textCursor = { start: 0, end: 0 };
        el.textInput.focus();
      });

      el.btnSnippetLayout.addEventListener('click', () => {
        state.snippetLayout = state.snippetLayout === 'grouped' ? 'flat' : 'grouped';
        saveSnippetLayoutToStorage(state.snippetLayout);
        renderSnippets();
      });

      el.btnSnippetAddToggle.addEventListener('click', () => {
        if (state.snippetEditorMode === 'add') {
          closeSnippetEditor();
        } else {
          openSnippetEditor('add', null);
        }
      });

      el.btnSnippetManageToggle.addEventListener('click', () => {
        state.snippetManageMode = !state.snippetManageMode;
        if (!state.snippetManageMode) {
          disarmResetButton();
          if (state.snippetEditorMode === 'edit') closeSnippetEditor();
        }
        renderSnippets();
      });

      el.snippetCatSelect.addEventListener('change', () => {
        const isNew = el.snippetCatSelect.value === '__NEW__';
        el.snippetCustomCatRow.classList.toggle('hidden', !isNew);
        if (isNew) {
          el.snippetCustomCatInput.focus();
        }
      });

      el.btnSnippetEditorCancel.addEventListener('click', closeSnippetEditor);
      el.btnSnippetEditorSave.addEventListener('click', saveSnippetFromEditor);
      el.snippetTextInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveSnippetFromEditor();
        }
      });
      el.snippetCustomCatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveSnippetFromEditor();
        }
      });

      // Two-tap safe reset without confirm()
      el.btnSnippetReset.addEventListener('click', () => {
        if (!state.resetArmed) {
          state.resetArmed = true;
          el.btnSnippetReset.textContent = '再點一次確認恢復';
          el.btnSnippetReset.classList.add('armed');
          clearTimeout(resetArmTimer);
          resetArmTimer = setTimeout(disarmResetButton, 3000);
          return;
        }
        disarmResetButton();
        state.snippets = createDefaultSnippets();
        saveSnippetsToStorage(state.snippets);
        closeSnippetEditor();
        renderSnippets();
        showToast('已恢復預設常用詞清單');
      });

      el.btnTextCancel.addEventListener('click', () => {
        el.textModal.classList.add('hidden');
        closeSnippetEditor();
        disarmResetButton();
        state.pendingTextPos = null;
        state.editingTextAnnId = null;
      });
      el.btnTextConfirm.addEventListener('click', confirmTextModal);
      el.textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmTextModal();
      });

      // Export Modal Buttons
      el.btnExport.addEventListener('click', () => {
        const selLayer = state.photoLayers.find(l => l.id === state.selectedLayerId);
        const lastLayer = state.photoLayers[state.photoLayers.length - 1];
        const dateStr = (selLayer && selLayer.dateStr) || (lastLayer && lastLayer.dateStr) || state.activeDateStr || formatDateFromMs();
        el.watermarkDateInput.value = dateStr;
        renderExportPreview();
        el.exportModal.classList.remove('hidden');
      });

      el.btnExportClose.addEventListener('click', () => {
        el.exportModal.classList.add('hidden');
      });

      el.watermarkDateInput.addEventListener('input', renderExportPreview);

      el.btnSharePhotos.addEventListener('click', async () => {
        if (!exportBlob && !exportDataUrl) return;
        const filename = getExportFilename();
        if (exportBlob && navigator.canShare) {
          const file = new File([exportBlob], filename, { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: '工地 CAD 標註截圖' });
              showToast('已完成分享 / 存入手機相簿');
              return;
            } catch (err) {
              if (err && err.name === 'AbortError') return;
            }
          }
        }
        triggerBlobDownload();
        showToast('目前瀏覽器不支援系統分享，已自動下載 PNG（手機亦可長按預覽圖存相簿）');
      });

      /* =====================================================================
         14. RESIZE OBSERVER & INITIALIZATION
         ===================================================================== */
      const resizeObserver = new ResizeObserver(() => {
        resizeMainCanvas();
        if (!el.cropModal.classList.contains('hidden')) {
          layoutCropCanvas();
        }
      });
      resizeObserver.observe(el.canvasStage);

      /* =====================================================================
         15. iOS SAFARI DOUBLE-TAP & PAGE PINCH-ZOOM GUARD
         ===================================================================== */
      // 阻止 iOS Safari 雙指縮放整個網頁（不影響畫布內的雙指縮放）
      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      // 攔截 300ms 內在非互動區域的連續點擊，避免 Safari 觸發頁面雙擊放大；
      // 略過 canvas、按鈕與輸入框，確保畫布雙擊改字、快速連按 -/+ 與輸入框聚焦皆不受影響
      let lastNonInteractiveTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        if (e.target && e.target.closest('canvas, button, input, select, textarea')) {
          return;
        }
        const now = Date.now();
        if (now - lastNonInteractiveTouchEnd <= 300) {
          e.preventDefault();
        }
        lastNonInteractiveTouchEnd = now;
      }, { passive: false });

      window.onload = function () {
        const demoCad = createDemoCadCanvas();
        state.cadImage = demoCad;
        state.cadWidth = demoCad.width;
        state.cadHeight = demoCad.height;
        resizeMainCanvas();
        fitCadToScreen();
        pushHistory();
        setMode('view');
      };
    })();
  </script>
</body>
</html>
