<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>工地 CAD 疊圖與局部裁切標註畫布</title>
  <style>
    /* ==================== 1. Base & Anti-Zoom Reset ==================== */
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-panel-2: #111c30;
      --bg-stage: #0b1120;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-border: rgba(245, 158, 11, 0.55);
      --warn-text: #fbbf24;
      --radius: 10px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button, input, select, textarea {
      font-family: inherit;
      touch-action: manipulation;
    }

    input[type="text"], textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    canvas {
      touch-action: none;
    }

    .hidden {
      display: none !important;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    /* ==================== 2. Top Bar ==================== */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      padding: 7px 11px;
      min-height: 36px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-export {
      background: var(--success);
      color: #ffffff;
      padding: 7px 11px;
      min-height: 36px;
    }
    .btn-export:hover:not(:disabled) { background: var(--success-hover); }

    .btn-secondary {
      background: var(--bg-panel);
      border-color: var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      min-height: 36px;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #273549;
      border-color: #475569;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
      padding: 7px 10px;
      min-height: 36px;
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .btn-icon-only {
      min-width: 36px;
      padding: 7px 8px;
    }

    .status-strip {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(51, 65, 85, 0.75);
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
    }

    .cad-name {
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e2e8f0;
      font-weight: 600;
    }

    .status-sep { color: #475569; }

    .status-date {
      white-space: nowrap;
    }
    .status-date strong {
      color: #e2e8f0;
      font-weight: 600;
    }

    .gps-warn-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==================== 3. Center Workspace & Canvas Stage ==================== */
    .workspace {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .canvas-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg-stage);
    }

    #mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .lbl-short {
      display: none;
    }

    /* Floating Expand Button when UI is Collapsed */
    .expand-ui-btn {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      z-index: 45;
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.65);
      color: #f8fafc;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .expand-ui-btn:hover {
      background: rgba(14, 165, 233, 0.88);
      border-color: #7dd3fc;
    }
    body:not(.ui-collapsed) .expand-ui-btn {
      display: none !important;
    }

    /* Floating Mode Badge */
    .mode-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 15;
      max-width: calc(100% - 92px);
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(71, 85, 105, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      font-size: 12px;
      color: #e2e8f0;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Contextual Floating Action Bars (Annotation & Layer) */
    .context-bar {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      max-width: calc(100% - 20px);
    }

    .ctx-btn {
      background: var(--bg-panel);
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .ctx-btn:hover { background: #334155; }
    .ctx-btn.primary {
      background: rgba(14, 165, 233, 0.22);
      border-color: rgba(56, 189, 248, 0.65);
      color: #7dd3fc;
    }
    .ctx-btn.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(248, 113, 113, 0.6);
      color: #fca5a5;
    }

    /* Zoom Controls */
    .zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .zoom-btn {
      width: 38px;
      height: 34px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid var(--border);
      color: #f8fafc;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.32);
    }
    .zoom-btn:hover { background: #1e293b; border-color: #64748b; }

    .zoom-fit-btn {
      width: auto;
      min-width: 38px;
      height: 30px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .zoom-percent {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.72);
      padding: 2px 6px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Ephemeral 1-Second Size / Angle HUD Pill */
    .size-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translate(-50%, 8px);
      z-index: 35;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }
    .size-hud.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translate(-50%, 8px);
      z-index: 40;
      padding: 8px 15px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ==================== 4. Bottom Mode Bar & Draw Subbar ==================== */
    .bottom-bar {
      flex-shrink: 0;
      background: var(--bg-dark);
      border-top: 1px solid var(--border);
      z-index: 30;
    }

    .draw-subbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-panel-2);
      border-bottom: 1px solid var(--border);
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .tool-row::-webkit-scrollbar { display: none; }

    .tool-btn {
      flex-shrink: 0;
      padding: 7px 11px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: #cbd5e1;
      touch-action: manipulation;
    }
    .tool-btn.active {
      background: var(--accent);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .style-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .swatch-group {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .swatch-group::-webkit-scrollbar { display: none; }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 0;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.1);
    }

    .size-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .step-btn {
      width: 38px;
      height: 34px;
      border-radius: 9px;
      background: var(--bg-panel);
      border: 1px solid #475569;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      touch-action: manipulation;
    }
    .step-btn:hover { background: #334155; border-color: #64748b; }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
      background: var(--bg-dark);
    }

    .mode-tab {
      flex-direction: column;
      gap: 4px;
      padding: 8px 4px;
      font-size: 12px;
      border-radius: 10px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      touch-action: manipulation;
    }
    .mode-tab:hover {
      background: rgba(30, 41, 59, 0.65);
      color: #e2e8f0;
    }
    .mode-tab.active {
      background: rgba(14, 165, 233, 0.18);
      border-color: rgba(56, 189, 248, 0.55);
      color: #38bdf8;
    }

    /* ==================== 5. Modals (Crop, Text, Export) ==================== */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }

    .dialog-card {
      width: 100%;
      max-width: 540px;
      max-height: 92dvh;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow-y: auto;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dialog-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .dialog-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }

    /* Crop Modal Specific */
    .crop-stage {
      width: 100%;
      height: min(52dvh, 380px);
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #cropCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .crop-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ratio-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .ratio-btn {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }
    .ratio-btn.active {
      background: var(--accent);
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Text & Quick-Phrase Modal Specific */
    .text-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      background: var(--bg-panel);
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.25);
    }

    .phrase-panel {
      background: var(--bg-panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .phrase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .phrase-header-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .phrase-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mini-btn {
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 7px;
      background: var(--bg-panel);
      border: 1px solid #475569;
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .mini-btn.active {
      background: rgba(14, 165, 233, 0.22);
      border-color: #38bdf8;
      color: #7dd3fc;
    }
    .mini-btn.warn {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fcd34d;
    }

    .phrase-add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 10px;
    }

    .phrase-add-form input,
    .phrase-add-form select {
      background: var(--bg-dark);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 9px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
    }
    .phrase-add-form input[type="text"] {
      flex: 1;
      min-width: 110px;
    }

    .phrase-list-wrap {
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .phrase-cat-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .phrase-cat-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      padding-left: 2px;
    }

    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .phrase-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--bg-panel);
      border: 1px solid #475569;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      touch-action: manipulation;
    }
    .phrase-chip:hover {
      background: #273549;
      border-color: var(--accent);
    }

    .chip-manage-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
      font-size: 12px;
      color: #e2e8f0;
    }

    .chip-icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      padding: 0;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.7);
      color: #cbd5e1;
    }
    .chip-icon-btn.del {
      color: #fca5a5;
    }
    .chip-icon-btn.del:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
    }

    /* Export Modal Specific */
    .export-preview-box {
      width: 100%;
      max-height: 55dvh;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    #exportPreviewImg {
      max-width: 100%;
      max-height: calc(55dvh - 16px);
      object-fit: contain;
      border-radius: 6px;
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
    }

    .export-tip {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .export-primary-wrap {
      display: flex;
      justify-content: center;
    }

    .btn-export-big {
      width: 100%;
      max-width: 320px;
      padding: 12px 18px;
      font-size: 15px;
      border-radius: 12px;
      background: var(--success);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }
    .btn-export-big:hover { background: var(--success-hover); }

    /* ==================== 6. Small Portrait Mobile ==================== */
    @media (max-width: 640px) {
      .top-bar { padding: calc(6px + env(safe-area-inset-top)) 8px 6px 8px; gap: 5px; }
      .btn-primary, .btn-export { padding: 7px 9px; font-size: 12px; }
      .hide-xs { display: none; }
      .cad-name, .status-sep { display: none; }
      .mode-tab { font-size: 11px; padding: 7px 2px; }
      .dialog-backdrop { align-items: flex-start; padding: 8px; }
      .dialog-card { padding: 13px; max-height: 94dvh; }
    }

    /* ==================== 7. Landscape Compact 3-Column Layout ==================== */
    @media (orientation: landscape) and (max-height: 620px) {
      .hide-land {
        display: none !important;
      }
      .lbl-full {
        display: none;
      }
      .lbl-short {
        display: inline;
      }

      /* Compact Top Bar (~38px) */
      .top-bar {
        height: 38px;
        padding: 3px calc(8px + env(safe-area-inset-right)) 3px calc(8px + env(safe-area-inset-left));
        gap: 6px;
      }
      .top-group {
        gap: 5px;
      }
      .top-bar .btn-primary,
      .top-bar .btn-export,
      .top-bar .btn-secondary {
        padding: 4px 8px;
        font-size: 12px;
        min-height: 30px;
        border-radius: 8px;
      }
      .top-bar .btn-icon-only {
        min-width: 32px;
        min-height: 30px;
        padding: 4px;
      }
      .top-bar .icon {
        width: 16px;
        height: 16px;
      }
      .status-strip {
        background: transparent;
        border: none;
        padding: 0;
        justify-content: flex-start;
      }
      .cad-name,
      .status-sep,
      .status-date {
        display: none;
      }
      .gps-warn-pill {
        padding: 2px 7px;
        font-size: 11px;
      }

      /* Horizontal 3-Column Workspace (Left Sidebar + Center Canvas + Dynamic Right Sidebar) */
      .workspace {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: minmax(0, 1fr);
      }
      .canvas-stage {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
      }
      .bottom-bar {
        display: contents;
      }

      /* Left Sidebar: 4 Main Mode Tabs */
      .mode-tabs {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 5px;
        width: calc(58px + env(safe-area-inset-left));
        padding: 6px 5px 6px calc(5px + env(safe-area-inset-left));
        background: var(--bg-dark);
        border-right: 1px solid var(--border);
        border-top: none;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .mode-tabs::-webkit-scrollbar { display: none; }
      .mode-tab {
        flex: 1;
        min-height: 50px;
        padding: 5px 2px;
        font-size: 10px;
        gap: 3px;
        border-radius: 8px;
      }
      .mode-tab .icon {
        width: 17px;
        height: 17px;
      }

      /* Right Sidebar (Draw Mode): Tools + 2-Col Swatches + Independent -/+ */
      .draw-subbar {
        grid-column: 3;
        grid-row: 1;
        width: calc(64px + env(safe-area-inset-right));
        padding: 6px calc(5px + env(safe-area-inset-right)) 6px 5px;
        border-left: 1px solid var(--border);
        border-bottom: none;
        overflow-y: auto;
        overflow-x: hidden;
        gap: 6px;
        justify-content: flex-start;
      }
      .draw-subbar::-webkit-scrollbar { display: none; }
      .tool-row {
        flex-direction: column;
        overflow: visible;
        padding-bottom: 0;
        gap: 4px;
      }
      .tool-btn {
        flex: none;
        width: 100%;
        min-width: 0;
        padding: 6px 2px;
        font-size: 11px;
        border-radius: 7px;
      }
      .style-row {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding-top: 6px;
        border-top: 1px solid #1e293b;
      }
      .swatch-group {
        display: grid;
        grid-template-columns: repeat(2, 22px);
        justify-content: center;
        gap: 5px;
      }
      .swatch {
        width: 22px;
        height: 22px;
      }
      .size-stepper {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        width: 100%;
      }
      .step-btn {
        width: 100%;
        height: 30px;
        font-size: 16px;
        border-radius: 7px;
      }

      /* Right Sidebar (Layer Mode when selected): Vertical Layer Actions */
      #layerContextBar {
        grid-column: 3;
        grid-row: 1;
        position: static;
        transform: none;
        max-width: none;
        width: calc(60px + env(safe-area-inset-right));
        padding: 8px calc(5px + env(safe-area-inset-right)) 8px 5px;
        border-radius: 0;
        border: none;
        border-left: 1px solid var(--border);
        background: var(--bg-panel-2);
        box-shadow: none;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        gap: 6px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #layerContextBar .ctx-btn {
        width: 100%;
        padding: 9px 4px;
        font-size: 11px;
        border-radius: 8px;
      }

      /* Sleeker Floating HUDs inside Canvas */
      .mode-badge {
        top: 6px;
        left: 6px;
        padding: 4px 10px;
        font-size: 11px;
      }
      #annContextBar {
        top: 34px;
        padding: 4px 6px;
      }
      .zoom-controls {
        top: 6px;
        right: 6px;
        gap: 4px;
      }
      .zoom-btn {
        width: 34px;
        height: 30px;
        font-size: 16px;
        border-radius: 8px;
      }
      .zoom-fit-btn {
        height: 28px;
        font-size: 10px;
      }
      .zoom-percent {
        font-size: 10px;
        padding: 2px 4px;
      }
    }

    /* ==================== 8. Full-Screen Collapsed UI Mode ==================== */
    body.ui-collapsed .top-bar,
    body.ui-collapsed .bottom-bar,
    body.ui-collapsed .mode-tabs,
    body.ui-collapsed .draw-subbar,
    body.ui-collapsed .context-bar,
    body.ui-collapsed .zoom-controls,
    body.ui-collapsed .mode-badge {
      display: none !important;
    }
    body.ui-collapsed .workspace {
      display: flex !important;
      width: 100vw;
      height: 100dvh;
    }
    body.ui-collapsed .canvas-stage {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. TOP BAR ==================== -->
  <header class="top-bar">
    <div class="top-group">
      <button id="btnImportCad" type="button" class="btn-primary" title="匯入 CAD 平面圖影像 (PNG/JPG/WEBP)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        <span>匯入 CAD</span>
      </button>
      <input id="cadFileInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
    </div>

    <div class="status-strip" aria-live="polite">
      <span id="cadNameDisplay" class="cad-name" title="目前 CAD 平面圖">示範平面圖.cad</span>
      <span class="status-sep">|</span>
      <span class="status-date">拍攝日: <strong id="exifDateDisplay">示範圖</strong></span>
      <span id="gpsWarnPill" class="gps-warn-pill hidden">⚠ 無<span class="hide-land"> </span>GPS<span class="hide-land"> 訊號</span></span>
    </div>

    <div class="top-group">
      <button id="btnUndo" type="button" class="btn-secondary btn-icon-only" disabled title="復原 (Undo)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span class="hide-xs hide-land">復原</span>
      </button>
      <button id="btnRedo" type="button" class="btn-secondary btn-icon-only" disabled title="重做 (Redo)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        <span class="hide-xs hide-land">重做</span>
      </button>
      <button id="btnCollapseUi" type="button" class="btn-secondary btn-icon-only" title="收合工具列（全畫面檢視）">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span class="hide-xs hide-land">收合介面</span>
      </button>
      <button id="btnExport" type="button" class="btn-export" title="產生並匯出截圖">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>匯出<span class="hide-land">截圖</span></span>
      </button>
    </div>
  </header>

  <!-- Hidden multi-photo file picker -->
  <input id="photoFileInput" type="file" accept="image/*" multiple class="hidden" />

  <!-- ==================== 2. WORKSPACE (CANVAS + SIDEBARS/BOTTOM BAR) ==================== -->
  <div id="workspace" class="workspace">
    <main id="canvasStage" class="canvas-stage">
      <canvas id="mainCanvas"></canvas>

      <!-- Floating Expand UI Button (visible only in full-screen collapsed mode) -->
      <button id="btnExpandUi" type="button" class="expand-ui-btn" title="展開工具列">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span>展開工具</span>
      </button>

      <!-- Mode hint badge -->
      <div id="modeBadge" class="mode-badge">底圖檢視：拖曳平移、滾輪或雙指縮放</div>

      <!-- Contextual Floating Bar: Vector Annotation -->
      <div id="annContextBar" class="context-bar hidden">
        <button id="btnAnnEditText" type="button" class="ctx-btn primary hidden">編輯文字</button>
        <button id="btnAnnDuplicate" type="button" class="ctx-btn">複製</button>
        <button id="btnAnnDelete" type="button" class="ctx-btn danger">刪除</button>
      </div>

      <!-- Zoom Controls -->
      <div class="zoom-controls">
        <button id="btnZoomIn" type="button" class="zoom-btn" title="放大">+</button>
        <div id="zoomPercent" class="zoom-percent">100%</div>
        <button id="btnZoomOut" type="button" class="zoom-btn" title="縮小">−</button>
        <button id="btnZoomFit" type="button" class="zoom-btn zoom-fit-btn" title="適合畫面">適合畫面</button>
      </div>

      <!-- Ephemeral 1-second Size / Angle HUD Pill -->
      <div id="sizeHud" class="size-hud" aria-live="polite"></div>

      <!-- Toast Notification -->
      <div id="toast" class="toast" aria-live="polite"></div>
    </main>

    <!-- Contextual Bar: Photo Layer (Floating in Portrait, Right Sidebar in Landscape) -->
    <div id="layerContextBar" class="context-bar hidden">
      <button id="btnLayerRecrop" type="button" class="ctx-btn primary"><span class="lbl-full">重新裁切</span><span class="lbl-short">重裁</span></button>
      <button id="btnLayerUp" type="button" class="ctx-btn">上移</button>
      <button id="btnLayerDown" type="button" class="ctx-btn">下移</button>
      <button id="btnLayerDelete" type="button" class="ctx-btn danger">刪除</button>
    </div>

    <!-- ==================== 3. BOTTOM MODE BAR (SIDEBARS IN LANDSCAPE) ==================== -->
    <footer class="bottom-bar">
      <!-- Draw Subbar -->
      <div id="drawSubbar" class="draw-subbar hidden">
        <div id="toolRow" class="tool-row">
          <button type="button" class="tool-btn" data-tool="select">選取編輯</button>
          <button type="button" class="tool-btn active" data-tool="arrow">箭頭</button>
          <button type="button" class="tool-btn" data-tool="line">直線</button>
          <button type="button" class="tool-btn" data-tool="rect">矩形</button>
          <button type="button" class="tool-btn" data-tool="circle">圓圈</button>
          <button type="button" class="tool-btn" data-tool="freehand">手繪筆</button>
          <button type="button" class="tool-btn" data-tool="text">文字</button>
          <button type="button" class="tool-btn" data-tool="eraser">橡皮擦</button>
        </div>

        <div class="style-row">
          <div id="swatchGroup" class="swatch-group" aria-label="標註顏色">
            <button type="button" class="swatch active" data-color="#ef4444" style="background:#ef4444" title="紅"></button>
            <button type="button" class="swatch" data-color="#facc15" style="background:#facc15" title="黃"></button>
            <button type="button" class="swatch" data-color="#38bdf8" style="background:#38bdf8" title="青藍"></button>
            <button type="button" class="swatch" data-color="#22c55e" style="background:#22c55e" title="綠"></button>
            <button type="button" class="swatch" data-color="#f97316" style="background:#f97316" title="橘"></button>
            <button type="button" class="swatch" data-color="#a855f7" style="background:#a855f7" title="紫"></button>
            <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" title="白"></button>
            <button type="button" class="swatch" data-color="#0f172a" style="background:#0f172a" title="黑"></button>
          </div>

          <div class="size-stepper" aria-label="調整大小">
            <button id="btnSizeMinus" type="button" class="step-btn" title="縮小">−</button>
            <button id="btnSizePlus" type="button" class="step-btn" title="放大">+</button>
          </div>
        </div>
      </div>

      <!-- 4 Main Mode Tabs -->
      <nav class="mode-tabs" aria-label="主要模式">
        <button id="tabView" type="button" class="mode-tab active" data-mode="view">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
          <span>底圖檢視</span>
        </button>
        <button id="tabAddPhoto" type="button" class="mode-tab" data-mode="addPhoto">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>加入照片</span>
        </button>
        <button id="tabLayer" type="button" class="mode-tab" data-mode="layer">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>圖層編輯</span>
        </button>
        <button id="tabDraw" type="button" class="mode-tab" data-mode="draw">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
          <span>標註繪圖</span>
        </button>
      </nav>
    </footer>
  </div>

  <!-- ==================== 4. LOCAL CROP MODAL ==================== -->
  <div id="cropModal" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="cropModalTitle">
    <div class="dialog-card">
      <div class="dialog-header">
        <div>
          <h2 id="cropModalTitle" class="dialog-title">局部裁切照片</h2>
          <div id="cropQueueInfo" class="dialog-subtitle">拖曳框內移動、拉動四角調整局部範圍</div>
        </div>
        <button id="btnCropCancelTop" type="button" class="btn-secondary">關閉</button>
      </div>

      <div id="cropStage" class="crop-stage">
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="crop-toolbar">
        <div id="ratioGroup" class="ratio-group">
          <button type="button" class="ratio-btn active" data-ratio="free">自由</button>
          <button type="button" class="ratio-btn" data-ratio="1">1:1</button>
          <button type="button" class="ratio-btn" data-ratio="1.3333">4:3</button>
          <button type="button" class="ratio-btn" data-ratio="1.7778">16:9</button>
        </div>
        <button id="btnCropRotate" type="button" class="btn-secondary">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span>旋轉 90°</span>
        </button>
      </div>

      <div class="dialog-footer">
        <button id="btnCropSkip" type="button" class="btn-secondary">取消</button>
        <button id="btnCropConfirm" type="button" class="btn-primary">確認疊加到平面圖</button>
      </div>
    </div>
  </div>

  <!-- ==================== 5. TEXT ANNOTATION + QUICK-PHRASE MODAL ==================== -->
  <div id="textModal" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
    <div class="dialog-card">
      <div class="dialog-header">
        <h2 id="textModalTitle" class="dialog-title">新增文字註解</h2>
        <button id="btnTextCancelTop" type="button" class="btn-secondary">關閉</button>
      </div>

      <div class="text-input-row">
        <input id="textNoteInput" type="text" class="text-input" placeholder="輸入或點選下方常用詞組合..." autocomplete="off" />
        <button id="btnTextClear" type="button" class="btn-secondary">清除</button>
      </div>

      <!-- Quick-Phrase Customizable Panel -->
      <div class="phrase-panel">
        <div class="phrase-header">
          <span class="phrase-header-title">常用詞快速組合（點擊直接串接）</span>
          <div class="phrase-controls">
            <button id="btnPhraseViewToggle" type="button" class="mini-btn">分類檢視</button>
            <button id="btnPhraseAddToggle" type="button" class="mini-btn">＋新增</button>
            <button id="btnPhraseManageToggle" type="button" class="mini-btn">編輯／刪除</button>
          </div>
        </div>

        <!-- Inline Add/Edit Phrase Form -->
        <div id="phraseForm" class="phrase-add-form hidden">
          <input id="phraseTextInput" type="text" placeholder="詞彙內容 (例: 5F、軟條燈)" maxlength="24" />
          <select id="phraseCatSelect" aria-label="分類">
            <option value="樓層">樓層</option>
            <option value="設備">設備</option>
            <option value="編號/狀態">編號/狀態</option>
            <option value="自訂">自訂</option>
            <option value="__new__">＋新分類...</option>
          </select>
          <input id="phraseNewCatInput" type="text" class="hidden" placeholder="輸入新分類名稱" maxlength="16" />
          <button id="btnPhraseSave" type="button" class="btn-primary" style="min-height:32px;padding:4px 10px;">儲存</button>
          <button id="btnPhraseFormCancel" type="button" class="btn-secondary" style="min-height:32px;padding:4px 9px;">取消</button>
        </div>

        <!-- Reset Defaults Row (shown in Manage mode) -->
        <div id="phraseManageBar" class="phrase-header hidden" style="padding-top:2px;border-top:1px solid #1e293b;">
          <span class="dialog-subtitle">點擊鉛筆修改、點 × 刪除</span>
          <button id="btnPhraseReset" type="button" class="mini-btn warn">恢復預設</button>
        </div>

        <div id="phraseListWrap" class="phrase-list-wrap"></div>
      </div>

      <div class="dialog-footer">
        <button id="btnTextCancel" type="button" class="btn-secondary">取消</button>
        <button id="btnTextConfirm" type="button" class="btn-primary">確認放置</button>
      </div>
    </div>
  </div>

  <!-- ==================== 6. EXPORT SCREENSHOT MODAL ==================== -->
  <div id="exportModal" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="dialog-card">
      <div class="dialog-header">
        <div>
          <h2 id="exportModalTitle" class="dialog-title">匯出疊圖截圖</h2>
          <div id="exportMetaInfo" class="dialog-subtitle">右下角已自動壓印拍攝日期</div>
        </div>
        <button id="btnExportClose" type="button" class="btn-secondary">關閉</button>
      </div>

      <div class="export-preview-box">
        <img id="exportPreviewImg" alt="疊圖截圖預覽" />
      </div>

      <p class="export-tip">手機若未彈出系統分享，也可直接長按上方預覽圖存入相簿</p>

      <div class="export-primary-wrap">
        <button id="btnExportShare" type="button" class="btn-export-big">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          <span>儲存至手機相簿 / 分享</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 7. APPLICATION SCRIPT ==================== -->
  <script>
    (() => {
      'use strict';

      /* -------------------- A. Anti-Zoom Guard for iOS Safari -------------------- */
      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      let lastNonInteractiveTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const target = e.target;
        // Allow canvas double-tap (for editing text) and rapid button/input interactions
        if (target && target.closest('canvas, button, input, select, textarea, img')) {
          return;
        }
        const now = Date.now();
        if (now - lastNonInteractiveTouchEnd <= 300) {
          e.preventDefault();
        }
        lastNonInteractiveTouchEnd = now;
      }, { passive: false });

      /* -------------------- B. DOM Elements -------------------- */
      const el = {
        btnImportCad: document.getElementById('btnImportCad'),
        cadFileInput: document.getElementById('cadFileInput'),
        photoFileInput: document.getElementById('photoFileInput'),
        cadNameDisplay: document.getElementById('cadNameDisplay'),
        exifDateDisplay: document.getElementById('exifDateDisplay'),
        gpsWarnPill: document.getElementById('gpsWarnPill'),
        btnUndo: document.getElementById('btnUndo'),
        btnRedo: document.getElementById('btnRedo'),
        btnCollapseUi: document.getElementById('btnCollapseUi'),
        btnExpandUi: document.getElementById('btnExpandUi'),
        btnExport: document.getElementById('btnExport'),

        workspace: document.getElementById('workspace'),
        canvasStage: document.getElementById('canvasStage'),
        mainCanvas: document.getElementById('mainCanvas'),
        modeBadge: document.getElementById('modeBadge'),

        annContextBar: document.getElementById('annContextBar'),
        btnAnnEditText: document.getElementById('btnAnnEditText'),
        btnAnnDuplicate: document.getElementById('btnAnnDuplicate'),
        btnAnnDelete: document.getElementById('btnAnnDelete'),

        layerContextBar: document.getElementById('layerContextBar'),
        btnLayerRecrop: document.getElementById('btnLayerRecrop'),

      /* -------------------- F. Pure-JS EXIF Parser (Date + GPS) -------------------- */
      function parseExifFromArrayBuffer(buffer) {
        const result = { date: null, hasGps: false };
        try {
          const view = new DataView(buffer);
          if (view.byteLength < 12 || view.getUint16(0, false) !== 0xFFD8) {
            return result; // Not JPEG
          }
          let offset = 2;
          const length = view.byteLength;
          while (offset + 4 < length) {
            const marker = view.getUint16(offset, false);
            offset += 2;
            if (marker === 0xFFE1) { // APP1 Exif
              const app1Len = view.getUint16(offset, false);
              if (offset + 8 > length) break;
              // Check "Exif\0\0"
              if (view.getUint32(offset + 2, false) === 0x45786966) {
                const tiffStart = offset + 8;
                const littleEndian = view.getUint16(tiffStart, false) === 0x4949;
                const firstIfdOffset = view.getUint32(tiffStart + 4, littleEndian);
                const ifd0Start = tiffStart + firstIfdOffset;

                let exifIfdOffset = null;
                let gpsIfdOffset = null;
                let fallbackDate = null;

                const readAscii = (valOffset, count) => {
                  const start = tiffStart + valOffset;
                  if (start + count > length) return '';
                  let s = '';
                  for (let i = 0; i < count; i++) {
                    const ch = view.getUint8(start + i);
                    if (ch === 0) break;
                    s += String.fromCharCode(ch);
                  }
                  return s.trim();
                };

                const parseIfd = (ifdStart, onEntry) => {
                  if (ifdStart + 2 > length) return;
                  const entries = view.getUint16(ifdStart, littleEndian);
                  for (let i = 0; i < entries; i++) {
                    const entryOffset = ifdStart + 2 + i * 12;
                    if (entryOffset + 12 > length) break;
                    const tag = view.getUint16(entryOffset, littleEndian);
                    const type = view.getUint16(entryOffset + 2, littleEndian);
                    const count = view.getUint32(entryOffset + 4, littleEndian);
                    const valueOffset = view.getUint32(entryOffset + 8, littleEndian);
                    onEntry(tag, type, count, valueOffset, entryOffset + 8);
                  }
                };

                parseIfd(ifd0Start, (tag, type, count, valueOffset) => {
                  if (tag === 0x0132 && type === 2) {
                    fallbackDate = readAscii(valueOffset, count);
                  } else if (tag === 0x8769) {
                    exifIfdOffset = valueOffset;
                  } else if (tag === 0x8825) {
                    gpsIfdOffset = valueOffset;
                  }
                });

                if (exifIfdOffset !== null) {
                  parseIfd(tiffStart + exifIfdOffset, (tag, type, count, valueOffset) => {
                    if ((tag === 0x9003 || tag === 0x9004) && type === 2) {
                      const dStr = readAscii(valueOffset, count);
                      if (dStr && !result.date) result.date = formatExifDate(dStr);
                    }
                  });
                }

                if (!result.date && fallbackDate) {
                  result.date = formatExifDate(fallbackDate);
                }

                if (gpsIfdOffset !== null) {
                  let hasLat = false;
                  let hasLon = false;
                  parseIfd(tiffStart + gpsIfdOffset, (tag) => {
                    if (tag === 0x0002) hasLat = true;
                    if (tag === 0x0004) hasLon = true;
                  });
                  if (hasLat && hasLon) result.hasGps = true;
                }
                break;
              }
              offset += app1Len;
            } else if ((marker & 0xFF00) !== 0xFF00) {
              break;
            } else {
              const segLen = view.getUint16(offset, false);
              if (segLen < 2) break;
              offset += segLen;
            }
          }
        } catch (err) {
          // Ignore malformed EXIF safely
        }
        return result;
      }

      function formatExifDate(raw) {
        // Expects "YYYY:MM:DD HH:MM:SS"
        const m = String(raw).match(/(\d{4})[:/\-](\d{2})[:/\-](\d{2})/);
        if (m) return `${m[1]}/${m[2]}/${m[3]}`;
        return null;
      }
