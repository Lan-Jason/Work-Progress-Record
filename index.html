        btnCollapseUi: document.getElementById('btnCollapseUi'),
        btnExpandUi: document.getElementById('btnExpandUi'),
        btnExport: document.getElementById('btnExport'),
        modeBadge: document.getElementById('modeBadge'),
        btnZoomIn: document.getElementById('btnZoomIn'),
        btnZoomOut: document.getElementById('btnZoomOut'),
        btnZoomFit: document.getElementById('btnZoomFit'),
        zoomPercent: document.getElementById('zoomPercent'),
        floatingToast: document.getElementById('floatingToast'),
        drawSubbar: document.getElementById('drawSubbar'),
        toolRow: document.getElementById('toolRow'),
        swatchGroup: document.getElementById('swatchGroup'),
        btnSizeMinus: document.getElementById('btnSizeMinus'),
        btnSizePlus: document.getElementById('btnSizePlus'),
        modeTabs: document.getElementById('modeTabs'),
        annContextBar: document.getElementById('annContextBar'),
        btnAnnEditText: document.getElementById('btnAnnEditText'),
        btnAnnDuplicate: document.getElementById('btnAnnDuplicate'),
        btnAnnDelete: document.getElementById('btnAnnDelete'),
        layerContextBar: document.getElementById('layerContextBar'),
        btnLayerRecrop: document.getElementById('btnLayerRecrop'),
        btnLayerUp: document.getElementById('btnLayerUp'),
        btnLayerDown: document.getElementById('btnLayerDown'),
        btnLayerDelete: document.getElementById('btnLayerDelete'),
        // Crop modal
        cropModal: document.getElementById('cropModal'),
        cropModalTitle: document.getElementById('cropModalTitle'),
        cropQueueInfo: document.getElementById('cropQueueInfo'),
        cropExifInfo: document.getElementById('cropExifInfo'),
        cropStage: document.getElementById('cropStage'),
        cropCanvas: document.getElementById('cropCanvas'),
        btnCropFull: document.getElementById('btnCropFull'),
        btnCropSkip: document.getElementById('btnCropSkip'),
        btnCropConfirm: document.getElementById('btnCropConfirm'),
        // Text modal
        textModal: document.getElementById('textModal'),
        textModalTitle: document.getElementById('textModalTitle'),
        textAnnInput: document.getElementById('textAnnInput'),
        btnTextClear: document.getElementById('btnTextClear'),
        btnViewCategory: document.getElementById('btnViewCategory'),
        btnViewAll: document.getElementById('btnViewAll'),
        btnToggleAddPhrase: document.getElementById('btnToggleAddPhrase'),
        btnToggleManagePhrase: document.getElementById('btnToggleManagePhrase'),
        phraseFormBox: document.getElementById('phraseFormBox'),
        phraseTextInput: document.getElementById('phraseTextInput'),
        phraseCatSelect: document.getElementById('phraseCatSelect'),
        phraseCustomCatInput: document.getElementById('phraseCustomCatInput'),
        btnPhraseFormCancel: document.getElementById('btnPhraseFormCancel'),
        btnPhraseFormSave: document.getElementById('btnPhraseFormSave'),
        phraseManageBar: document.getElementById('phraseManageBar'),
        btnPhraseReset: document.getElementById('btnPhraseReset'),
        phrasePanel: document.getElementById('phrasePanel'),
        btnTextCancelTop: document.getElementById('btnTextCancelTop'),
        btnTextCancel: document.getElementById('btnTextCancel'),
        btnTextConfirm: document.getElementById('btnTextConfirm'),
        // Export modal
        exportModal: document.getElementById('exportModal'),
        exportPreviewImg: document.getElementById('exportPreviewImg'),
        btnExportCloseTop: document.getElementById('btnExportCloseTop'),
        btnExportClose: document.getElementById('btnExportClose'),
        btnExportShare: document.getElementById('btnExportShare')
      };

      const ctx = el.mainCanvas.getContext('2d');
      const cropCtx = el.cropCanvas.getContext('2d');

      /* ==================== C. Application State ==================== */
      const state = {
        mode: 'view', // 'view' | 'layer' | 'draw'
        cad: {
          source: null,
          width: 1600,
          height: 1100,
          name: '尚未匯入底圖'
        },
        exif: {
          shootDate: '',
          missingGps: false
        },
        viewport: {
          scale: 1,
          offsetX: 0,
          offsetY: 0
        },
        layers: [], // { id, origImg, croppedCanvas, cropRect, x, y, w, h, rotation, dateStr, hasGps }
        selectedLayerId: null,
        annotations: [], // vector items
        selectedAnnId: null,
        lastCreatedAnnId: null,
        draw: {
          tool: 'select', // 'select'|'arrow'|'line'|'rect'|'ellipse'|'cloud'|'freehand'|'text'
          color: '#ef4444',
          sizes: {
            arrow: 12,
            line: 12,
            rect: 12,
            ellipse: 12,
            cloud: 12,
            freehand: 12,
            text: 40
          }
        },
        history: [],
        historyIndex: -1,
        phrases: [],
        phraseView: 'category', // 'category' | 'all'
        phraseManageMode: false,
        editingPhraseId: null,
        resetConfirmPending: false,
        exportBlob: null,
        exportFilename: 'cad-export.png'
      };

      /* ==================== D. Utility Helpers ==================== */
      let uidCounter = 1;
      function genId(prefix) {
        return `${prefix}_${Date.now()}_${uidCounter++}`;
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function formatToday() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }

      let toastTimer = null;
      function showToast(msg, duration = 1000) {
        el.floatingToast.textContent = msg;
        el.floatingToast.classList.add('show');
        clearTimeout(toastTimer);
        if (duration > 0) {
          toastTimer = setTimeout(() => {
            el.floatingToast.classList.remove('show');
          }, duration);
        }
      }

      function hideToast() {
        clearTimeout(toastTimer);
        el.floatingToast.classList.remove('show');
      }

      function screenToWorld(sx, sy) {
        return {
          x: (sx - state.viewport.offsetX) / state.viewport.scale,
          y: (sy - state.viewport.offsetY) / state.viewport.scale
        };
      }

      function worldToScreen(wx, wy) {
        return {
          x: wx * state.viewport.scale + state.viewport.offsetX,
          y: wy * state.viewport.scale + state.viewport.offsetY
        };
      }

      function rotatePoint(px, py, cx, cy, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const dx = px - cx;
        const dy = py - cy;
        return {
          x: cx + dx * cos - dy * sin,
          y: cy + dx * sin + dy * cos
        };
      }

      function distToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
        t = clamp(t, 0, 1);
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      /* ==================== F. Pure-JS JPEG EXIF Parser ==================== */
      function parseExifFromBuffer(buffer) {
        const result = { dateStr: '', hasGps: false };
        try {
          const view = new DataView(buffer);
          if (view.byteLength < 12 || view.getUint16(0, false) !== 0xFFD8) {
            return result;
          }
          let offset = 2;
          const length = view.byteLength;
          while (offset + 4 < length) {
            const marker = view.getUint16(offset, false);
            offset += 2;
            if (marker === 0xFFE1) {
              // APP1 EXIF
              const app1Len = view.getUint16(offset, false);
              if (offset + 8 > length) break;
              // Check "Exif\0\0"
              if (view.getUint32(offset + 2, false) === 0x45786966 && view.getUint16(offset + 6, false) === 0x0000) {
                const tiffStart = offset + 8;
                const littleEndian = view.getUint16(tiffStart, false) === 0x4949;
                const firstIfdOffset = view.getUint32(tiffStart + 4, littleEndian);
                const ifd0Start = tiffStart + firstIfdOffset;

                const readAscii = (valOffset, count) => {
                  const abs = tiffStart + valOffset;
                  if (abs + count > length) return '';
                  let str = '';
                  for (let i = 0; i < count; i++) {
                    const ch = view.getUint8(abs + i);
                    if (ch === 0) break;
                    str += String.fromCharCode(ch);
                  }
                  return str.trim();
                };

                let exifIfdPtr = 0;
                let dateTimeFallback = '';

                if (ifd0Start + 2 <= length) {
                  const entries = view.getUint16(ifd0Start, littleEndian);
                  for (let i = 0; i < entries; i++) {
                    const entryPos = ifd0Start + 2 + i * 12;
                    if (entryPos + 12 > length) break;
                    const tag = view.getUint16(entryPos, littleEndian);
                    const count = view.getUint32(entryPos + 4, littleEndian);
                    const valOrOffset = view.getUint32(entryPos + 8, littleEndian);
                    if (tag === 0x8769) {
                      exifIfdPtr = valOrOffset;
                    } else if (tag === 0x8825 && valOrOffset > 0) {
                      result.hasGps = true;
                    } else if (tag === 0x0132 && count >= 10) {
                      dateTimeFallback = readAscii(valOrOffset, count);
                    }
                  }
                }

                let dateOriginal = '';
                if (exifIfdPtr > 0) {
                  const exifStart = tiffStart + exifIfdPtr;
                  if (exifStart + 2 <= length) {
                    const entries = view.getUint16(exifStart, littleEndian);
                    for (let i = 0; i < entries; i++) {
                      const entryPos = exifStart + 2 + i * 12;
                      if (entryPos + 12 > length) break;
                      const tag = view.getUint16(entryPos, littleEndian);
                      const count = view.getUint32(entryPos + 4, littleEndian);
                      const valOrOffset = view.getUint32(entryPos + 8, littleEndian);
                      if ((tag === 0x9003 || tag === 0x9004) && count >= 10) {
                        dateOriginal = readAscii(valOrOffset, count);
                        if (tag === 0x9003) break;
                      }
                    }
                  }
                }

                const rawDate = dateOriginal || dateTimeFallback;
                const match = rawDate.match(/^(\d{4})[:/-](\d{2})[:/-](\d{2})/);
                if (match) {
                  result.dateStr = `${match[1]}/${match[2]}/${match[3]}`;
                }
              }
              offset += app1Len;
            } else if ((marker & 0xFF00) !== 0xFF00) {
              break;
            } else {
              const segLen = view.getUint16(offset, false);
              offset += segLen;
            }
          }
        } catch (err) {
          // Safely ignore malformed EXIF
        }
        return result;
      }

      function updateExifStatusUI() {
        el.cadFileName.textContent = state.cad.name;
        el.shootDateText.textContent = state.exif.shootDate
          ? `拍攝日: ${state.exif.shootDate}`
          : '拍攝日: —';
        el.gpsWarnPill.classList.toggle('hidden', !state.exif.missingGps);
      }

      /* ==================== G. Undo / Redo History ==================== */
      function snapshotState() {
        return {
          layers: state.layers.map(l => ({
            id: l.id,
            origImg: l.origImg,
            croppedCanvas: l.croppedCanvas,
            cropRect: { ...l.cropRect },
            x: l.x,
            y: l.y,
            w: l.w,
            h: l.h,
            rotation: l.rotation,
            dateStr: l.dateStr,
            hasGps: l.hasGps
          })),
          annotations: state.annotations.map(a => ({
            ...a,
            points: a.points ? a.points.map(p => ({ ...p })) : undefined
          })),
          selectedLayerId: state.selectedLayerId,
          selectedAnnId: state.selectedAnnId
        };
      }

      function pushHistory() {
        if (state.historyIndex < state.history.length - 1) {
          state.history = state.history.slice(0, state.historyIndex + 1);
        }
        state.history.push(snapshotState());
        if (state.history.length > 50) {
          state.history.shift();
        }
        state.historyIndex = state.history.length - 1;
        updateHistoryButtons();
      }

      function restoreSnapshot(snap) {
        state.layers = snap.layers.map(l => ({ ...l, cropRect: { ...l.cropRect } }));
        state.annotations = snap.annotations.map(a => ({
          ...a,
          points: a.points ? a.points.map(p => ({ ...p })) : undefined
        }));
        state.selectedLayerId = snap.selectedLayerId;
        state.selectedAnnId = snap.selectedAnnId;
        updateContextBars();
        renderMainCanvas();
      }

      function undo() {
        if (state.historyIndex <= 0) return;
        state.historyIndex--;
        restoreSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
      }

      function redo() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex++;
        restoreSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
      }

      function updateHistoryButtons() {
        el.btnUndo.disabled = state.historyIndex <= 0;
        el.btnRedo.disabled = state.historyIndex >= state.history.length - 1;
      }

      /* ==================== H. Viewport & Main Canvas Rendering ==================== */
      let lastStageSize = { w: 0, h: 0 };

      function resizeMainCanvas() {
        const rect = el.canvasStage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const newW = rect.width;
        const newH = rect.height;

        if (lastStageSize.w > 0 && lastStageSize.h > 0 && newW > 0 && newH > 0) {
          state.viewport.offsetX += (newW - lastStageSize.w) / 2;
          state.viewport.offsetY += (newH - lastStageSize.h) / 2;
        }
        if (newW > 0 && newH > 0) {
          lastStageSize = { w: newW, h: newH };
        }

        el.mainCanvas.width = Math.max(1, Math.round(newW * dpr));
        el.mainCanvas.height = Math.max(1, Math.round(newH * dpr));
        renderMainCanvas();
      }

      function fitCadToScreen() {
        const rect = el.canvasStage.getBoundingClientRect();
        const pad = 24;
        const availW = Math.max(80, rect.width - pad * 2);
        const availH = Math.max(80, rect.height - pad * 2);
        const scale = Math.min(availW / state.cad.width, availH / state.cad.height);
        state.viewport.scale = clamp(scale, 0.1, 6);
        state.viewport.offsetX = (rect.width - state.cad.width * state.viewport.scale) / 2;
        state.viewport.offsetY = (rect.height - state.cad.height * state.viewport.scale) / 2;
        updateZoomLabel();
        renderMainCanvas();
      }

      function zoomAtCenter(factor) {
        const rect = el.canvasStage.getBoundingClientRect();
        zoomAtPoint(rect.width / 2, rect.height / 2, factor);
      }

      function zoomAtPoint(sx, sy, factor) {
        const oldScale = state.viewport.scale;
        const newScale = clamp(oldScale * factor, 0.12, 8);
        const worldX = (sx - state.viewport.offsetX) / oldScale;
        const worldY = (sy - state.viewport.offsetY) / oldScale;
        state.viewport.scale = newScale;
        state.viewport.offsetX = sx - worldX * newScale;
        state.viewport.offsetY = sy - worldY * newScale;
        updateZoomLabel();
        renderMainCanvas();
      }

      function updateZoomLabel() {
        el.zoomPercent.textContent = `${Math.round(state.viewport.scale * 100)}%`;
      }

      function drawArrowHead(g, x1, y1, x2, y2, size) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headLen = Math.max(12, size * 3.4);
        g.beginPath();
        g.moveTo(x2, y2);
        g.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
        g.moveTo(x2, y2);
        g.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
        g.stroke();
      }

      function measureTextBox(g, ann) {
        g.save();
        g.font = `700 ${ann.size}px -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
        const rawText = String(ann.text ?? '');
        const lines = rawText.split(/\r?\n/);
        if (lines.length === 0) lines.push(' ');
        let maxLineW = 0;
        for (const line of lines) {
          const lw = g.measureText(line || ' ').width;
          if (lw > maxLineW) maxLineW = lw;
        }
        const padX = Math.max(8, ann.size * 0.32);
        const padY = Math.max(5, ann.size * 0.22);
        const lineHeight = ann.size * 1.25;
        const w = Math.max(24, maxLineW + padX * 2);
        const h = lineHeight * lines.length + padY * 2;
        g.restore();
        return { w, h, padX, padY, lineHeight, lines };
      }

      function drawCloudRectPath(g, w, h, lineWidth) {
        const hw = Math.max(2, w / 2);
        const hh = Math.max(2, h / 2);
        // Revision cloud bump chord length scales comfortably with stroke size & box dimensions
        const targetChord = clamp(Math.max(22, lineWidth * 2.4), 16, Math.max(18, Math.min(w, h) * 0.55));
        const nx = Math.max(2, Math.round(w / targetChord));
        const ny = Math.max(2, Math.round(h / targetChord));

        const pts = [];
        // Top edge: left -> right
        for (let i = 0; i < nx; i++) {
          pts.push({ x: -hw + (i / nx) * w, y: -hh });
        }
        // Right edge: top -> bottom
        for (let i = 0; i < ny; i++) {
          pts.push({ x: hw, y: -hh + (i / ny) * h });
        }
        // Bottom edge: right -> left
        for (let i = 0; i < nx; i++) {
          pts.push({ x: hw - (i / nx) * w, y: hh });
        }
        // Left edge: bottom -> top
        for (let i = 0; i < ny; i++) {
          pts.push({ x: -hw, y: hh - (i / ny) * h });
        }

        g.beginPath();
        g.moveTo(pts[0].x, pts[0].y);
        for (let i = 0; i < pts.length; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % pts.length];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy) || 1;
          // Outward normal for clockwise perimeter in screen coords (y down) is (dy / len, -dx / len)
          const nxOut = dy / len;
          const nyOut = -dx / len;
          const bulge = len * 0.58;
          const c1x = p1.x + dx * 0.22 + nxOut * bulge;
          const c1y = p1.y + dy * 0.22 + nyOut * bulge;
          const c2x = p1.x + dx * 0.78 + nxOut * bulge;
          const c2y = p1.y + dy * 0.78 + nyOut * bulge;
          g.bezierCurveTo(c1x, c1y, c2x, c2y, p2.x, p2.y);
        }
        g.closePath();
        g.stroke();
      }

      function drawAnnotation(g, ann) {
        g.save();
        g.strokeStyle = ann.color;
        g.fillStyle = ann.color;
        g.lineWidth = ann.size;
        g.lineCap = 'round';
        g.lineJoin = 'round';

        if (ann.type === 'line') {
          g.beginPath();
          g.moveTo(ann.x1, ann.y1);
          g.lineTo(ann.x2, ann.y2);
          g.stroke();
        } else if (ann.type === 'arrow') {
          g.beginPath();
          g.moveTo(ann.x1, ann.y1);
          g.lineTo(ann.x2, ann.y2);
          g.stroke();
          drawArrowHead(g, ann.x1, ann.y1, ann.x2, ann.y2, ann.size);
        } else if (ann.type === 'rect') {
          g.translate(ann.cx, ann.cy);
          g.rotate(ann.rotation || 0);
          g.strokeRect(-ann.w / 2, -ann.h / 2, ann.w, ann.h);
        } else if (ann.type === 'cloud') {
          g.translate(ann.cx, ann.cy);
          g.rotate(ann.rotation || 0);
          drawCloudRectPath(g, ann.w, ann.h, ann.size);
        } else if (ann.type === 'ellipse') {
          g.translate(ann.cx, ann.cy);
          g.rotate(ann.rotation || 0);
          g.beginPath();
          g.ellipse(0, 0, Math.max(1, ann.w / 2), Math.max(1, ann.h / 2), 0, 0, Math.PI * 2);
          g.stroke();
        } else if (ann.type === 'freehand') {
          if (ann.points && ann.points.length > 0) {
            g.beginPath();
            g.moveTo(ann.points[0].x, ann.points[0].y);
            for (let i = 1; i < ann.points.length; i++) {
              g.lineTo(ann.points[i].x, ann.points[i].y);
            }
            g.stroke();
          }
        } else if (ann.type === 'text') {
          const box = measureTextBox(g, ann);
          g.fillStyle = 'rgba(15, 23, 42, 0.72)';
          g.beginPath();
          const r = 6;
          const x = ann.x;
          const y = ann.y;
          g.moveTo(x + r, y);
          g.arcTo(x + box.w, y, x + box.w, y + box.h, r);
          g.arcTo(x + box.w, y + box.h, x, y + box.h, r);
          g.arcTo(x, y + box.h, x, y, r);
          g.arcTo(x, y, x + box.w, y, r);
          g.closePath();
          g.fill();

          g.fillStyle = ann.color;
          g.font = `700 ${ann.size}px -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
          g.textBaseline = 'middle';
          g.textAlign = 'left';
          for (let i = 0; i < box.lines.length; i++) {
            const lineY = ann.y + box.padY + (i + 0.5) * box.lineHeight;
            g.fillText(box.lines[i], ann.x + box.padX, lineY);
          }
        }
        g.restore();
      }

      function drawTransformGizmo(g, cx, cy, w, h, rotation, scale) {
        const invS = 1 / scale;
        const rotStem = 30 * invS;
        const handleR = 8 * invS;

        g.save();
        g.translate(cx, cy);
        g.rotate(rotation || 0);

        // Dashed bounding box
        g.strokeStyle = '#38bdf8';
        g.lineWidth = 2 * invS;
        g.setLineDash([6 * invS, 4 * invS]);
        g.strokeRect(-w / 2, -h / 2, w, h);
        g.setLineDash([]);

        // Rotation stem & top handle
        g.beginPath();
        g.moveTo(0, -h / 2);
        g.lineTo(0, -h / 2 - rotStem);
        g.stroke();

        g.beginPath();
        g.arc(0, -h / 2 - rotStem, handleR * 1.05, 0, Math.PI * 2);
        g.fillStyle = '#0ea5e9';
        g.fill();
        g.strokeStyle = '#ffffff';
        g.lineWidth = 2 * invS;
        g.stroke();

        // 4 corner handles
        const corners = [
          [-w / 2, -h / 2],
          [w / 2, -h / 2],
          [w / 2, h / 2],
          [-w / 2, h / 2]
        ];
        corners.forEach(([hx, hy]) => {
          g.fillStyle = '#ffffff';
          g.strokeStyle = '#0284c7';
          g.lineWidth = 2 * invS;
          g.fillRect(hx - handleR, hy - handleR, handleR * 2, handleR * 2);
          g.strokeRect(hx - handleR, hy - handleR, handleR * 2, handleR * 2);
        });

        g.restore();
      }

      function drawAnnotationSelection(g, ann) {
        const invS = 1 / state.viewport.scale;
        const handleR = 8 * invS;

        if (ann.type === 'rect' || ann.type === 'ellipse' || ann.type === 'cloud') {
          drawTransformGizmo(g, ann.cx, ann.cy, ann.w, ann.h, ann.rotation || 0, state.viewport.scale);
          return;
        }

        g.save();
        g.strokeStyle = '#38bdf8';
        g.lineWidth = 2 * invS;
        g.setLineDash([5 * invS, 4 * invS]);

        if (ann.type === 'line' || ann.type === 'arrow') {
          g.setLineDash([]);
          [
            [ann.x1, ann.y1],
            [ann.x2, ann.y2]
          ].forEach(([hx, hy]) => {
            g.beginPath();
            g.arc(hx, hy, handleR, 0, Math.PI * 2);
            g.fillStyle = '#ffffff';
            g.fill();
            g.strokeStyle = '#0284c7';
            g.stroke();
          });
        } else if (ann.type === 'text') {
          const box = measureTextBox(g, ann);
          g.strokeRect(ann.x - 3 * invS, ann.y - 3 * invS, box.w + 6 * invS, box.h + 6 * invS);
        } else if (ann.type === 'freehand' && ann.points && ann.points.length) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          ann.points.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
          });
          const pad = ann.size + 6 * invS;
          g.strokeRect(minX - pad, minY - pad, (maxX - minX) + pad * 2, (maxY - minY) + pad * 2);
        }
        g.restore();
      }

      let activeDraftAnn = null;

      function renderMainCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const cw = el.mainCanvas.width / dpr;
        const ch = el.mainCanvas.height / dpr;

        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cw, ch);

        // Apply viewport transform
        ctx.translate(state.viewport.offsetX, state.viewport.offsetY);
        ctx.scale(state.viewport.scale, state.viewport.scale);

        // 1. CAD Base
        if (state.cad.source) {
          ctx.drawImage(state.cad.source, 0, 0, state.cad.width, state.cad.height);
        }

        // 2. Photo Layers
        for (const layer of state.layers) {
          ctx.save();
          ctx.translate(layer.x, layer.y);
          ctx.rotate(layer.rotation || 0);
          ctx.drawImage(layer.croppedCanvas, -layer.w / 2, -layer.h / 2, layer.w, layer.h);
          ctx.restore();
        }

        // 3. Vector Annotations
        for (const ann of state.annotations) {
          drawAnnotation(ctx, ann);
        }

        // Active drawing preview
        if (activeDraftAnn) {
          drawAnnotation(ctx, activeDraftAnn);
        }

        // 4. Selection Gizmos
        if (state.mode === 'layer' && state.selectedLayerId) {
          const selLayer = state.layers.find(l => l.id === state.selectedLayerId);
          if (selLayer) {
            drawTransformGizmo(ctx, selLayer.x, selLayer.y, selLayer.w, selLayer.h, selLayer.rotation, state.viewport.scale);
          }
        }

        if (state.mode === 'draw' && state.draw.tool === 'select' && state.selectedAnnId) {
          const selAnn = state.annotations.find(a => a.id === state.selectedAnnId);
          if (selAnn) {
            drawAnnotationSelection(ctx, selAnn);
          }
        }

        ctx.restore();
      }

      /* ==================== I. Hit-Testing (Rotated Local Coordinates) ==================== */
      function getGizmoHandleHit(wx, wy, cx, cy, w, h, rotation) {
        const invS = 1 / state.viewport.scale;
        const hitR = 20 * invS;
        const rotStem = 30 * invS;

        // Convert pointer into local rotated frame
        const local = rotatePoint(wx, wy, cx, cy, -(rotation || 0));
        const lx = local.x - cx;
        const ly = local.y - cy;

        // Check rotation handle first
        if (Math.hypot(lx - 0, ly - (-h / 2 - rotStem)) <= hitR) {
          return 'rot';
        }
        // Check 4 corners
        const corners = [
          { name: 'nw', x: -w / 2, y: -h / 2 },
          { name: 'ne', x: w / 2, y: -h / 2 },
          { name: 'se', x: w / 2, y: h / 2 },
          { name: 'sw', x: -w / 2, y: h / 2 }
        ];
        for (const c of corners) {
          if (Math.hypot(lx - c.x, ly - c.y) <= hitR) {
            return c.name;
          }
        }
        // Check inside box
        if (Math.abs(lx) <= w / 2 + 6 * invS && Math.abs(ly) <= h / 2 + 6 * invS) {
          return 'move';
        }
        return null;
      }

      function hitTestLayer(wx, wy) {
        for (let i = state.layers.length - 1; i >= 0; i--) {
          const l = state.layers[i];
          const local = rotatePoint(wx, wy, l.x, l.y, -(l.rotation || 0));
          const lx = local.x - l.x;
          const ly = local.y - l.y;
          if (Math.abs(lx) <= l.w / 2 && Math.abs(ly) <= l.h / 2) {
            return l;
          }
        }
        return null;
      }

      function hitTestAnnotation(wx, wy) {
        const tol = Math.max(12, 16 / state.viewport.scale);
        for (let i = state.annotations.length - 1; i >= 0; i--) {
          const ann = state.annotations[i];
          if (ann.type === 'line' || ann.type === 'arrow') {
            if (distToSegment(wx, wy, ann.x1, ann.y1, ann.x2, ann.y2) <= tol + ann.size / 2) {
              return ann;
            }
          } else if (ann.type === 'rect' || ann.type === 'cloud') {
            const local = rotatePoint(wx, wy, ann.cx, ann.cy, -(ann.rotation || 0));
            const lx = local.x - ann.cx;
            const ly = local.y - ann.cy;
            const hw = ann.w / 2;
            const hh = ann.h / 2;
            const bumpAllowance = ann.type === 'cloud' ? Math.max(14, ann.size * 1.4) : 0;
            const edgeTol = tol + ann.size / 2 + bumpAllowance;
            const nearOuter = Math.abs(lx) <= hw + edgeTol && Math.abs(ly) <= hh + edgeTol;
            const insideHole = Math.abs(lx) < Math.max(0, hw - (tol + ann.size / 2)) && Math.abs(ly) < Math.max(0, hh - (tol + ann.size / 2));
            if (nearOuter && !insideHole) return ann;
          } else if (ann.type === 'ellipse') {
            const local = rotatePoint(wx, wy, ann.cx, ann.cy, -(ann.rotation || 0));
            const lx = local.x - ann.cx;
            const ly = local.y - ann.cy;
            const rx = Math.max(1, ann.w / 2);
            const ry = Math.max(1, ann.h / 2);
            const edgeTol = tol + ann.size / 2;
            const outerNorm = (lx * lx) / ((rx + edgeTol) ** 2) + (ly * ly) / ((ry + edgeTol) ** 2);
            const innerRx = Math.max(0.5, rx - edgeTol);
            const innerRy = Math.max(0.5, ry - edgeTol);
            const innerNorm = (rx > edgeTol && ry > edgeTol)
              ? (lx * lx) / (innerRx ** 2) + (ly * ly) / (innerRy ** 2)
              : 2;
            if (outerNorm <= 1 && innerNorm >= 1) return ann;
          } else if (ann.type === 'freehand' && ann.points && ann.points.length) {
            for (let j = 1; j < ann.points.length; j++) {
              if (distToSegment(wx, wy, ann.points[j - 1].x, ann.points[j - 1].y, ann.points[j].x, ann.points[j].y) <= tol + ann.size / 2) {
                return ann;
              }
            }
          } else if (ann.type === 'text') {
            const box = measureTextBox(ctx, ann);
            if (wx >= ann.x - 8 && wx <= ann.x + box.w + 8 && wy >= ann.y - 8 && wy <= ann.y + box.h + 8) {
              return ann;
            }
          }
        }
        return null;
      }

      /* ==================== J. Main Canvas Pointer & Multi-Touch Handling ==================== */
      const activePointers = new Map();
      let pinchState = null;
      let dragOp = null;
      let lastTapInfo = { time: 0, annId: null };

      function getCanvasPoint(e) {
        const rect = el.mainCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function computeOppositeCornerWorld(cx, cy, w, h, rotation, corner) {
        const oppLocal = {
          nw: { x: w / 2, y: h / 2 },
          ne: { x: -w / 2, y: h / 2 },
          se: { x: -w / 2, y: -h / 2 },
          sw: { x: w / 2, y: -h / 2 }
        }[corner];
        return rotatePoint(cx + oppLocal.x, cy + oppLocal.y, cx, cy, rotation || 0);
      }

      el.mainCanvas.addEventListener('pointerdown', (e) => {
        el.mainCanvas.setPointerCapture(e.pointerId);
        const pt = getCanvasPoint(e);
        activePointers.set(e.pointerId, pt);

        // Two-finger pinch zoom/pan works in ANY mode
        if (activePointers.size === 2) {
          dragOp = null;
          activeDraftAnn = null;
          const pts = Array.from(activePointers.values());
          const midX = (pts[0].x + pts[1].x) / 2;
          const midY = (pts[0].y + pts[1].y) / 2;
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          pinchState = {
            startDist: Math.max(1, dist),
            startScale: state.viewport.scale,
            worldMid: screenToWorld(midX, midY)
          };
          return;
        }

        if (activePointers.size > 2) return;

        const world = screenToWorld(pt.x, pt.y);

        // 1. VIEW MODE: Pan canvas
        if (state.mode === 'view') {
          dragOp = {
            type: 'pan',
            startX: pt.x,
            startY: pt.y,
            origOffX: state.viewport.offsetX,
            origOffY: state.viewport.offsetY
          };
          return;
        }

        // 2. LAYER MODE: Select / Move / Scale / Rotate photo layer
        if (state.mode === 'layer') {
          const selLayer = state.layers.find(l => l.id === state.selectedLayerId);
          if (selLayer) {
            const handle = getGizmoHandleHit(world.x, world.y, selLayer.x, selLayer.y, selLayer.w, selLayer.h, selLayer.rotation);
            if (handle === 'rot') {
              dragOp = {
                type: 'layer-rot',
                layer: selLayer,
                startAngle: Math.atan2(world.y - selLayer.y, world.x - selLayer.x),
                origRot: selLayer.rotation || 0,
                changed: false
              };
              return;
            }
            if (handle === 'nw' || handle === 'ne' || handle === 'se' || handle === 'sw') {
              dragOp = {
                type: 'layer-scale',
                layer: selLayer,
                corner: handle,
                fixedWorld: computeOppositeCornerWorld(selLayer.x, selLayer.y, selLayer.w, selLayer.h, selLayer.rotation, handle),
                aspect: selLayer.w / Math.max(1, selLayer.h),
                changed: false
              };
              return;
            }
            if (handle === 'move') {
              dragOp = {
                type: 'layer-move',
                layer: selLayer,
                startWorld: world,
                origX: selLayer.x,
                origY: selLayer.y,
                changed: false
              };
              return;
            }
          }

          const hit = hitTestLayer(world.x, world.y);
          state.selectedLayerId = hit ? hit.id : null;
          updateContextBars();
          renderMainCanvas();
          if (hit) {
            dragOp = {
              type: 'layer-move',
              layer: hit,
              startWorld: world,
              origX: hit.x,
              origY: hit.y,
              changed: false
            };
          } else {
            // Pan when dragging empty space
            dragOp = {
              type: 'pan',
              startX: pt.x,
              startY: pt.y,
              origOffX: state.viewport.offsetX,
              origOffY: state.viewport.offsetY
            };
          }
          return;
        }

        // 3. DRAW MODE
        if (state.mode === 'draw') {
          const tool = state.draw.tool;

          if (tool === 'text') {
            openTextModal({ mode: 'create', worldX: world.x, worldY: world.y });
            return;
          }

          if (tool === 'select') {
            const selAnn = state.annotations.find(a => a.id === state.selectedAnnId);
            if (selAnn) {
              // Check endpoints for line/arrow
              if (selAnn.type === 'line' || selAnn.type === 'arrow') {
                const hitR = 20 / state.viewport.scale;
                if (Math.hypot(world.x - selAnn.x1, world.y - selAnn.y1) <= hitR) {
                  dragOp = { type: 'ann-endpoint', ann: selAnn, end: 1, changed: false };
                  return;
                }
                if (Math.hypot(world.x - selAnn.x2, world.y - selAnn.y2) <= hitR) {
                  dragOp = { type: 'ann-endpoint', ann: selAnn, end: 2, changed: false };
                  return;
                }
              }

              // Check rotated gizmo for rect/ellipse/cloud
              if (selAnn.type === 'rect' || selAnn.type === 'ellipse' || selAnn.type === 'cloud') {
                const handle = getGizmoHandleHit(world.x, world.y, selAnn.cx, selAnn.cy, selAnn.w, selAnn.h, selAnn.rotation);
                if (handle === 'rot') {
                  dragOp = {
                    type: 'ann-rot',
                    ann: selAnn,
                    startAngle: Math.atan2(world.y - selAnn.cy, world.x - selAnn.cx),
                    origRot: selAnn.rotation || 0,
                    changed: false
                  };
                  return;
                }
                if (handle === 'nw' || handle === 'ne' || handle === 'se' || handle === 'sw') {
                  dragOp = {
                    type: 'ann-resize',
                    ann: selAnn,
                    corner: handle,
                    fixedWorld: computeOppositeCornerWorld(selAnn.cx, selAnn.cy, selAnn.w, selAnn.h, selAnn.rotation, handle),
                    changed: false
                  };
                  return;
                }
              }
            }

            const hit = hitTestAnnotation(world.x, world.y);
            state.selectedAnnId = hit ? hit.id : null;
            updateContextBars();
            renderMainCanvas();

            if (hit) {
              // Double tap to edit text
              const now = Date.now();
              if (hit.type === 'text' && lastTapInfo.annId === hit.id && now - lastTapInfo.time < 360) {
                lastTapInfo = { time: 0, annId: null };
                openTextModal({ mode: 'edit', ann: hit });
                return;
              }
              lastTapInfo = { time: now, annId: hit.id };

              dragOp = {
                type: 'ann-move',
                ann: hit,
                startWorld: world,
                origSnapshot: JSON.parse(JSON.stringify(hit)),
                changed: false
              };
            } else {
              dragOp = {
                type: 'pan',
                startX: pt.x,
                startY: pt.y,
                origOffX: state.viewport.offsetX,
                origOffY: state.viewport.offsetY
              };
            }
            return;
          }

          // Drawing new vector shape (arrow, line, rect, ellipse, cloud, freehand)
          const size = state.draw.sizes[tool] || 12;
          if (tool === 'line' || tool === 'arrow') {
            activeDraftAnn = {
              id: genId('ann'),
              type: tool,
              x1: world.x,
              y1: world.y,
              x2: world.x,
              y2: world.y,
              color: state.draw.color,
              size
            };
          } else if (tool === 'rect' || tool === 'ellipse' || tool === 'cloud') {
            activeDraftAnn = {
              id: genId('ann'),
              type: tool,
              cx: world.x,
              cy: world.y,
              w: 2,
              h: 2,
              rotation: 0,
              color: state.draw.color,
              size
            };
          } else if (tool === 'freehand') {
            activeDraftAnn = {
              id: genId('ann'),
              type: 'freehand',
              points: [{ x: world.x, y: world.y }],
              color: state.draw.color,
              size
            };
          }
          dragOp = { type: 'draw-new', startWorld: world };
          renderMainCanvas();
        }
      });

      el.mainCanvas.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        const pt = getCanvasPoint(e);
        activePointers.set(e.pointerId, pt);

        // Pinch Zoom
        if (activePointers.size === 2 && pinchState) {
          const pts = Array.from(activePointers.values());
          const midX = (pts[0].x + pts[1].x) / 2;
          const midY = (pts[0].y + pts[1].y) / 2;
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const newScale = clamp(pinchState.startScale * (dist / pinchState.startDist), 0.12, 8);
          state.viewport.scale = newScale;
          state.viewport.offsetX = midX - pinchState.worldMid.x * newScale;
          state.viewport.offsetY = midY - pinchState.worldMid.y * newScale;
          updateZoomLabel();
          renderMainCanvas();
          return;
        }

        if (!dragOp) return;
        const world = screenToWorld(pt.x, pt.y);

        if (dragOp.type === 'pan') {
          state.viewport.offsetX = dragOp.origOffX + (pt.x - dragOp.startX);
          state.viewport.offsetY = dragOp.origOffY + (pt.y - dragOp.startY);
          renderMainCanvas();
        } else if (dragOp.type === 'layer-move') {
          dragOp.layer.x = dragOp.origX + (world.x - dragOp.startWorld.x);
          dragOp.layer.y = dragOp.origY + (world.y - dragOp.startWorld.y);
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'layer-rot') {
          const curAngle = Math.atan2(world.y - dragOp.layer.y, world.x - dragOp.layer.x);
          dragOp.layer.rotation = dragOp.origRot + (curAngle - dragOp.startAngle);
          const deg = Math.round(((dragOp.layer.rotation * 180) / Math.PI) % 360);
          showToast(`旋轉角度：${deg}°`, 0);
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'layer-scale') {
          const l = dragOp.layer;
          const rot = l.rotation || 0;
          const cos = Math.cos(-rot);
          const sin = Math.sin(-rot);
          const dxW = world.x - dragOp.fixedWorld.x;
          const dyW = world.y - dragOp.fixedWorld.y;
          const dxL = dxW * cos - dyW * sin;
          const dyL = dxW * sin + dyW * cos;

          const signX = (dragOp.corner === 'ne' || dragOp.corner === 'se') ? 1 : -1;
          const signY = (dragOp.corner === 'se' || dragOp.corner === 'sw') ? 1 : -1;

          const rawW = Math.max(24, dxL * signX);
          const rawH = Math.max(24, dyL * signY);
          // Maintain photo aspect ratio
          let newW = rawW;
          let newH = newW / dragOp.aspect;
          if (newH < 24) {
            newH = 24;
            newW = newH * dragOp.aspect;
          }
          const cxL = (signX * newW) / 2;
          const cyL = (signY * newH) / 2;
          const cosF = Math.cos(rot);
          const sinF = Math.sin(rot);
          l.w = newW;
          l.h = newH;
          l.x = dragOp.fixedWorld.x + cxL * cosF - cyL * sinF;
          l.y = dragOp.fixedWorld.y + cxL * sinF + cyL * cosF;
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'ann-move') {
          const dx = world.x - dragOp.startWorld.x;
          const dy = world.y - dragOp.startWorld.y;
          const ann = dragOp.ann;
          const orig = dragOp.origSnapshot;
          if (ann.type === 'line' || ann.type === 'arrow') {
            ann.x1 = orig.x1 + dx; ann.y1 = orig.y1 + dy;
            ann.x2 = orig.x2 + dx; ann.y2 = orig.y2 + dy;
          } else if (ann.type === 'rect' || ann.type === 'ellipse' || ann.type === 'cloud') {
            ann.cx = orig.cx + dx; ann.cy = orig.cy + dy;
          } else if (ann.type === 'text') {
            ann.x = orig.x + dx; ann.y = orig.y + dy;
          } else if (ann.type === 'freehand') {
            ann.points = orig.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
          }
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'ann-endpoint') {
          if (dragOp.end === 1) {
            dragOp.ann.x1 = world.x; dragOp.ann.y1 = world.y;
          } else {
            dragOp.ann.x2 = world.x; dragOp.ann.y2 = world.y;
          }
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'ann-rot') {
          const curAngle = Math.atan2(world.y - dragOp.ann.cy, world.x - dragOp.ann.cx);
          dragOp.ann.rotation = dragOp.origRot + (curAngle - dragOp.startAngle);
          const deg = Math.round(((dragOp.ann.rotation * 180) / Math.PI) % 360);
          showToast(`旋轉角度：${deg}°`, 0);
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'ann-resize') {
          // Free aspect ratio resize for rect/ellipse/cloud with locked opposite corner in rotated frame
          const ann = dragOp.ann;
          const rot = ann.rotation || 0;
          const cos = Math.cos(-rot);
          const sin = Math.sin(-rot);
          const dxW = world.x - dragOp.fixedWorld.x;
          const dyW = world.y - dragOp.fixedWorld.y;
          const dxL = dxW * cos - dyW * sin;
          const dyL = dxW * sin + dyW * cos;

          const signX = (dragOp.corner === 'ne' || dragOp.corner === 'se') ? 1 : -1;
          const signY = (dragOp.corner === 'se' || dragOp.corner === 'sw') ? 1 : -1;

          const newW = Math.max(14, dxL * signX);
          const newH = Math.max(14, dyL * signY);
          const cxL = (signX * newW) / 2;
          const cyL = (signY * newH) / 2;
          const cosF = Math.cos(rot);
          const sinF = Math.sin(rot);

          ann.w = newW;
          ann.h = newH;
          ann.cx = dragOp.fixedWorld.x + cxL * cosF - cyL * sinF;
          ann.cy = dragOp.fixedWorld.y + cxL * sinF + cyL * cosF;
          dragOp.changed = true;
          renderMainCanvas();
        } else if (dragOp.type === 'draw-new' && activeDraftAnn) {
          if (activeDraftAnn.type === 'line' || activeDraftAnn.type === 'arrow') {
            activeDraftAnn.x2 = world.x;
            activeDraftAnn.y2 = world.y;
          } else if (activeDraftAnn.type === 'rect' || activeDraftAnn.type === 'ellipse' || activeDraftAnn.type === 'cloud') {
            const x1 = dragOp.startWorld.x;
            const y1 = dragOp.startWorld.y;
            activeDraftAnn.cx = (x1 + world.x) / 2;
            activeDraftAnn.cy = (y1 + world.y) / 2;
            activeDraftAnn.w = Math.max(4, Math.abs(world.x - x1));
            activeDraftAnn.h = Math.max(4, Math.abs(world.y - y1));
          } else if (activeDraftAnn.type === 'freehand') {
            const pts = activeDraftAnn.points;
            const last = pts[pts.length - 1];
            if (Math.hypot(world.x - last.x, world.y - last.y) > 2) {
              pts.push({ x: world.x, y: world.y });
            }
          }
          renderMainCanvas();
        }
      });

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          pinchState = null;
        }
        if (activePointers.size > 0) return;

        if (dragOp) {
          if (dragOp.type === 'layer-rot' || dragOp.type === 'ann-rot') {
            hideToast();
          }
          if (dragOp.type === 'draw-new' && activeDraftAnn) {
            let valid = true;
            if (activeDraftAnn.type === 'line' || activeDraftAnn.type === 'arrow') {
              valid = Math.hypot(activeDraftAnn.x2 - activeDraftAnn.x1, activeDraftAnn.y2 - activeDraftAnn.y1) > 4;
            } else if (activeDraftAnn.type === 'rect' || activeDraftAnn.type === 'ellipse' || activeDraftAnn.type === 'cloud') {
              valid = activeDraftAnn.w > 6 && activeDraftAnn.h > 6;
            } else if (activeDraftAnn.type === 'freehand') {
              valid = activeDraftAnn.points.length > 1;
            }
            if (valid) {
              state.annotations.push(activeDraftAnn);
              state.lastCreatedAnnId = activeDraftAnn.id;
              pushHistory();
            }
            activeDraftAnn = null;
            renderMainCanvas();
          } else if (dragOp.changed) {
            pushHistory();
          }
          dragOp = null;
        }
      }

      el.mainCanvas.addEventListener('pointerup', endPointer);
      el.mainCanvas.addEventListener('pointercancel', endPointer);

      // Mouse wheel zoom
      el.mainCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const pt = getCanvasPoint(e);
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        zoomAtPoint(pt.x, pt.y, factor);
      }, { passive: false });

      /* ==================== K. Mode & Tool Switching ==================== */
      function setMode(mode) {
        if (mode === 'importPhoto') {
          el.photoFileInput.value = '';
          el.photoFileInput.click();
          return;
        }
        state.mode = mode;
        el.modeTabs.querySelectorAll('.mode-tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        el.drawSubbar.classList.toggle('hidden', mode !== 'draw');

        if (mode !== 'layer') state.selectedLayerId = null;
        if (mode !== 'draw') state.selectedAnnId = null;

        updateModeBadge();
        updateContextBars();
        requestAnimationFrame(() => resizeMainCanvas());
      }

      function updateModeBadge() {
        const toolNames = {
          select: '選取編輯（可拖曳／縮放／旋轉）',
          arrow: '繪製箭頭',
          line: '繪製直線',
          rect: '繪製矩形',
          ellipse: '繪製圓形',
          cloud: '繪製雲朵框',
          freehand: '手繪標記',
          text: '點擊畫布新增文字'
        };
        if (state.mode === 'view') {
          el.modeBadge.textContent = '底圖檢視：拖曳平移、滾輪或雙指縮放';
        } else if (state.mode === 'layer') {
          el.modeBadge.textContent = state.selectedLayerId
            ? '圖層編輯：拖曳移動、拉角縮放、頂端旋轉'
            : '圖層編輯：點選照片圖層進行調整';
        } else if (state.mode === 'draw') {
          el.modeBadge.textContent = `標註繪圖：${toolNames[state.draw.tool] || ''}`;
        }
      }

      function updateContextBars() {
        // Layer context bar
        const showLayerBar = state.mode === 'layer' && Boolean(state.selectedLayerId);
        el.layerContextBar.classList.toggle('hidden', !showLayerBar);

        // Annotation context bar
        const selAnn = (state.mode === 'draw' && state.draw.tool === 'select')
          ? state.annotations.find(a => a.id === state.selectedAnnId)
          : null;
        el.annContextBar.classList.toggle('hidden', !selAnn);
        el.btnAnnEditText.classList.toggle('hidden', !(selAnn && selAnn.type === 'text'));

        updateModeBadge();
        requestAnimationFrame(() => resizeMainCanvas());
      }

      el.modeTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.mode-tab');
        if (!btn) return;
        setMode(btn.dataset.mode);
      });

      el.toolRow.addEventListener('click', (e) => {
        const btn = e.target.closest('.tool-btn');
        if (!btn) return;
        state.draw.tool = btn.dataset.tool;
        el.toolRow.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b === btn));
        if (state.draw.tool !== 'select') {
          state.selectedAnnId = null;
        }
        updateContextBars();
        renderMainCanvas();
      });

      el.swatchGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.swatch');
        if (!btn) return;
        const color = btn.dataset.color;
        state.draw.color = color;
        el.swatchGroup.querySelectorAll('.swatch').forEach(b => b.classList.toggle('active', b === btn));

        const targetAnn = getTargetAnnForStyle();
        if (targetAnn) {
          targetAnn.color = color;
          pushHistory();
          renderMainCanvas();
        }
      });

      function getTargetAnnForStyle() {
        if (state.selectedAnnId) {
          return state.annotations.find(a => a.id === state.selectedAnnId) || null;
        }
        if (state.lastCreatedAnnId) {
          return state.annotations.find(a => a.id === state.lastCreatedAnnId) || null;
        }
        return null;
      }

      function adjustSize(delta) {
        const targetAnn = getTargetAnnForStyle();
        let activeType = state.draw.tool;
        if (activeType === 'select') {
          activeType = targetAnn ? targetAnn.type : 'arrow';
        }

        const isText = activeType === 'text';
        const step = isText ? 4 : 1;
        const minVal = isText ? 14 : 2;
        const maxVal = isText ? 96 : 24;
        const current = state.draw.sizes[activeType] ?? (isText ? 40 : 12);
        const nextVal = clamp(current + delta * step, minVal, maxVal);
        state.draw.sizes[activeType] = nextVal;

        if (targetAnn && (state.selectedAnnId || targetAnn.type === activeType)) {
          targetAnn.size = nextVal;
          pushHistory();
          renderMainCanvas();
        }

        showToast(isText ? `字體：${nextVal}px` : `線寬：${nextVal}px`, 1000);
      }

      el.btnSizeMinus.addEventListener('click', () => adjustSize(-1));
      el.btnSizePlus.addEventListener('click', () => adjustSize(1));

      /* ==================== L. Layer & Annotation Context Actions ==================== */
      el.btnLayerUp.addEventListener('click', () => {
        const idx = state.layers.findIndex(l => l.id === state.selectedLayerId);
        if (idx >= 0 && idx < state.layers.length - 1) {
          [state.layers[idx], state.layers[idx + 1]] = [state.layers[idx + 1], state.layers[idx]];
          pushHistory();
          renderMainCanvas();
        }
      });

      el.btnLayerDown.addEventListener('click', () => {
        const idx = state.layers.findIndex(l => l.id === state.selectedLayerId);
        if (idx > 0) {
          [state.layers[idx], state.layers[idx - 1]] = [state.layers[idx - 1], state.layers[idx]];
          pushHistory();
          renderMainCanvas();
        }
      });

      el.btnLayerDelete.addEventListener('click', () => {
        if (!state.selectedLayerId) return;
        state.layers = state.layers.filter(l => l.id !== state.selectedLayerId);
        state.selectedLayerId = null;
        pushHistory();
        updateContextBars();
        renderMainCanvas();
      });

      el.btnLayerRecrop.addEventListener('click', () => {
        const layer = state.layers.find(l => l.id === state.selectedLayerId);

      el.btnAnnEditText.addEventListener('click', () => {
        const ann = state.annotations.find(a => a.id === state.selectedAnnId);

          openTextModal({ mode: 'edit', ann });
        }
      });

      el.btnAnnDuplicate.addEventListener('click', () => {
        const ann = state.annotations.find(a => a.id === state.selectedAnnId);
        if (!ann) return;
        const clone = JSON.parse(JSON.stringify(ann));
        clone.id = genId('ann');
        const shift = 24 / state.viewport.scale;
        if (clone.type === 'line' || clone.type === 'arrow') {
          clone.x1 += shift; clone.y1 += shift;
          clone.x2 += shift; clone.y2 += shift;
        } else if (clone.type === 'rect' || clone.type === 'ellipse' || clone.type === 'cloud') {
          clone.cx += shift; clone.cy += shift;
        } else if (clone.type === 'text') {
          clone.x += shift; clone.y += shift;
        } else if (clone.type === 'freehand') {
          clone.points.forEach(p => { p.x += shift; p.y += shift; });
        }
        state.annotations.push(clone);
        state.selectedAnnId = clone.id;
        state.lastCreatedAnnId = clone.id;

        updateContextBars();
        renderMainCanvas();
      });

      el.btnAnnDelete.addEventListener('click', () => {
        if (!state.selectedAnnId) return;
        state.annotations = state.annotations.filter(a => a.id !== state.selectedAnnId);
        state.selectedAnnId = null;
        pushHistory();
        updateContextBars();
        renderMainCanvas();
      });

      /* ==================== M. CAD & Photo File Imports + Crop Modal ==================== */
      el.btnImportCad.addEventListener('click', () => {
        el.cadFileInput.value = '';
        el.cadFileInput.click();
      });

      el.cadFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          state.cad.source = img;
          state.cad.width = img.naturalWidth;
          state.cad.height = img.naturalHeight;
          state.cad.name = file.name;
          updateExifStatusUI();
          fitCadToScreen();
          showToast('已匯入 CAD 底圖', 1200);
        };
        img.src = url;
      });

      // Crop Modal State
      const cropState = {
        queue: [], // { img, fileName, dateStr, hasGps }
        recropLayer: null,
        current: null,
        displayRect: { x: 0, y: 0, w: 1, h: 1 },
        box: { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }, // normalized 0..1
        drag: null
      };

      el.photoFileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const items = [];
        for (const file of files) {
          try {
            const buf = await file.arrayBuffer();
            const exif = parseExifFromBuffer(buf);
            const img = await new Promise((resolve, reject) => {
              const url = URL.createObjectURL(file);
              const im = new Image();
              im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
              im.onerror = reject;
              im.src = url;
            });
            items.push({
              img,
              fileName: file.name,
              dateStr: exif.dateStr || formatToday(),
              hasGps: exif.hasGps
            });
          } catch (err) {
            // Skip unreadable file
          }
        }
        if (!items.length) return;
        cropState.recropLayer = null;
        cropState.queue = items;
        openNextInCropQueue();
      });

      function openCropForExistingLayer(layer) {
        cropState.recropLayer = layer;
        cropState.queue = [];
        cropState.current = {
          img: layer.origImg,
          fileName: '重新裁切圖層',
          dateStr: layer.dateStr,
          hasGps: layer.hasGps
        };
        cropState.box = { ...layer.cropRect };
        el.cropModalTitle.textContent = '重新裁切照片圖層';
        el.cropQueueInfo.textContent = '';
        el.cropExifInfo.textContent = `拍攝日：${layer.dateStr} ｜ ${layer.hasGps ? '含 GPS 資訊' : '⚠ 無 GPS 訊號'}`;
        el.btnCropSkip.textContent = '取消';
        el.cropModal.classList.remove('hidden');
        requestAnimationFrame(() => layoutCropCanvas());
      }

      function openNextInCropQueue() {
        if (!cropState.queue.length) {
          el.cropModal.classList.add('hidden');
          return;
        }
        const item = cropState.queue.shift();
        cropState.current = item;
        cropState.box = { x: 0.08, y: 0.08, w: 0.84, h: 0.84 };
        el.cropModalTitle.textContent = '局部裁切照片';
        el.cropQueueInfo.textContent = cropState.queue.length > 0 ? `尚餘 ${cropState.queue.length} 張` : '';
        el.cropExifInfo.textContent = `拍攝日：${item.dateStr} ｜ ${item.hasGps ? '含 GPS 資訊' : '⚠ 無 GPS 訊號'}`;
        el.btnCropSkip.textContent = '跳過';
        el.cropModal.classList.remove('hidden');
        requestAnimationFrame(() => layoutCropCanvas());
      }

      function layoutCropCanvas() {
        if (!cropState.current) return;
        const rect = el.cropStage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.cropCanvas.width = Math.max(1, Math.round(rect.width * dpr));
        el.cropCanvas.height = Math.max(1, Math.round(rect.height * dpr));

        const img = cropState.current.img;
        const pad = 16;
        const availW = Math.max(40, rect.width - pad * 2);
        const availH = Math.max(40, rect.height - pad * 2);
        const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        cropState.displayRect = {
          x: (rect.width - dw) / 2,
          y: (rect.height - dh) / 2,
          w: dw,
          h: dh
        };
        renderCropCanvas();
      }

      function renderCropCanvas() {
        if (!cropState.current) return;
        const dpr = window.devicePixelRatio || 1;
        const cw = el.cropCanvas.width / dpr;
        const ch = el.cropCanvas.height / dpr;
        const dr = cropState.displayRect;
        const bx = dr.x + cropState.box.x * dr.w;
        const by = dr.y + cropState.box.y * dr.h;
        const bw = cropState.box.w * dr.w;
        const bh = cropState.box.h * dr.h;

        cropCtx.save();
        cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cropCtx.clearRect(0, 0, cw, ch);

        cropCtx.drawImage(cropState.current.img, dr.x, dr.y, dr.w, dr.h);

        // Dark mask outside crop box
        cropCtx.fillStyle = 'rgba(2, 6, 23, 0.62)';
        cropCtx.beginPath();
        cropCtx.rect(0, 0, cw, ch);
        cropCtx.rect(bx, by, bw, bh);
        cropCtx.fill('evenodd');

        // Crop border & rule-of-thirds grid
        cropCtx.strokeStyle = '#38bdf8';
        cropCtx.lineWidth = 2;
        cropCtx.strokeRect(bx, by, bw, bh);

        cropCtx.strokeStyle = 'rgba(255,255,255,0.28)';
        cropCtx.lineWidth = 1;
        cropCtx.beginPath();
        cropCtx.moveTo(bx + bw / 3, by); cropCtx.lineTo(bx + bw / 3, by + bh);
        cropCtx.moveTo(bx + (bw * 2) / 3, by); cropCtx.lineTo(bx + (bw * 2) / 3, by + bh);
        cropCtx.moveTo(bx, by + bh / 3); cropCtx.lineTo(bx + bw, by + bh / 3);
        cropCtx.moveTo(bx, by + (bh * 2) / 3); cropCtx.lineTo(bx + bw, by + (bh * 2) / 3);
        cropCtx.stroke();

        // Corner handles
        const corners = [[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh]];
        corners.forEach(([hx, hy]) => {
          cropCtx.fillStyle = '#ffffff';
          cropCtx.strokeStyle = '#0284c7';
          cropCtx.lineWidth = 2;
          cropCtx.fillRect(hx - 7, hy - 7, 14, 14);
          cropCtx.strokeRect(hx - 7, hy - 7, 14, 14);
        });
        cropCtx.restore();
      }

      el.cropCanvas.addEventListener('pointerdown', (e) => {
        if (!cropState.current) return;
        el.cropCanvas.setPointerCapture(e.pointerId);
        const rect = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const dr = cropState.displayRect;
        const bx = dr.x + cropState.box.x * dr.w;
        const by = dr.y + cropState.box.y * dr.h;
        const bw = cropState.box.w * dr.w;
        const bh = cropState.box.h * dr.h;

        const hitR = 24;
        let mode = null;
        if (Math.hypot(px - bx, py - by) <= hitR) mode = 'nw';
        else if (Math.hypot(px - (bx + bw), py - by) <= hitR) mode = 'ne';
        else if (Math.hypot(px - (bx + bw), py - (by + bh)) <= hitR) mode = 'se';
        else if (Math.hypot(px - bx, py - (by + bh)) <= hitR) mode = 'sw';
        else if (px >= bx && px <= bx + bw && py >= by && py <= by + bh) mode = 'move';

        if (mode) {
          cropState.drag = { mode, startX: px, startY: py, origBox: { ...cropState.box } };
        }
      });

      el.cropCanvas.addEventListener('pointermove', (e) => {
        if (!cropState.drag) return;
        const rect = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const dr = cropState.displayRect;
        const dx = (px - cropState.drag.startX) / dr.w;
        const dy = (py - cropState.drag.startY) / dr.h;
        const ob = cropState.drag.origBox;
        const minSize = 0.08;

        let { x, y, w, h } = ob;
        const m = cropState.drag.mode;
        if (m === 'move') {
          x = clamp(ob.x + dx, 0, 1 - ob.w);
          y = clamp(ob.y + dy, 0, 1 - ob.h);
        } else {
          if (m.includes('w')) {
            const nx = clamp(ob.x + dx, 0, ob.x + ob.w - minSize);
            w = ob.w - (nx - ob.x);
            x = nx;
          }
          if (m.includes('e')) {
            w = clamp(ob.w + dx, minSize, 1 - ob.x);
          }
          if (m.includes('n')) {
            const ny = clamp(ob.y + dy, 0, ob.y + ob.h - minSize);
            h = ob.h - (ny - ob.y);
            y = ny;
          }
          if (m.includes('s')) {
            h = clamp(ob.h + dy, minSize, 1 - ob.y);
          }
        }
        cropState.box = { x, y, w, h };
        renderCropCanvas();
      });

      el.cropCanvas.addEventListener('pointerup', () => { cropState.drag = null; });
      el.cropCanvas.addEventListener('pointercancel', () => { cropState.drag = null; });

      function buildCroppedCanvas(img, box) {
        const sx = Math.round(box.x * img.naturalWidth);
        const sy = Math.round(box.y * img.naturalHeight);
        const sw = Math.max(1, Math.round(box.w * img.naturalWidth));
        const sh = Math.max(1, Math.round(box.h * img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = sw;
        c.height = sh;
        const g = c.getContext('2d');
        g.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
        return c;
      }

      el.btnCropFull.addEventListener('click', () => {
        cropState.box = { x: 0, y: 0, w: 1, h: 1 };
        renderCropCanvas();
      });

      el.btnCropSkip.addEventListener('click', () => {
        if (cropState.recropLayer) {
          cropState.recropLayer = null;
          el.cropModal.classList.add('hidden');
        } else {
          openNextInCropQueue();
        }
      });

      el.btnCropConfirm.addEventListener('click', () => {
        if (!cropState.current) return;
        const croppedCanvas = buildCroppedCanvas(cropState.current.img, cropState.box);

        if (cropState.recropLayer) {
          const layer = cropState.recropLayer;
          layer.croppedCanvas = croppedCanvas;
          layer.cropRect = { ...cropState.box };
          const aspect = croppedCanvas.width / Math.max(1, croppedCanvas.height);
          layer.h = layer.w / aspect;
          cropState.recropLayer = null;
          pushHistory();
          el.cropModal.classList.add('hidden');
          renderMainCanvas();
          return;
        }

        // Add new photo layer centered in current viewport
        const stageRect = el.canvasStage.getBoundingClientRect();
        const centerWorld = screenToWorld(stageRect.width / 2, stageRect.height / 2);
        const targetW = Math.min(state.cad.width * 0.36, 460);
        const aspect = croppedCanvas.width / Math.max(1, croppedCanvas.height);
        const layer = {
          id: genId('layer'),
          origImg: cropState.current.img,
          croppedCanvas,
          cropRect: { ...cropState.box },
          x: centerWorld.x,
          y: centerWorld.y,
          w: targetW,
          h: targetW / aspect,
          rotation: 0,
          dateStr: cropState.current.dateStr,
          hasGps: cropState.current.hasGps
        };
        state.layers.push(layer);
        state.selectedLayerId = layer.id;

        // Update EXIF status
        state.exif.shootDate = layer.dateStr;
        if (!layer.hasGps) {
          state.exif.missingGps = true;
        }
        updateExifStatusUI();
        pushHistory();

        if (cropState.queue.length > 0) {
          openNextInCropQueue();
        } else {
          el.cropModal.classList.add('hidden');
          setMode('layer');
        }
      });

      /* ==================== N. Text Annotation & Custom Quick-Phrase Combiner ==================== */
      let textDialogContext = null;

      function loadPhrases() {
        try {
          const raw = localStorage.getItem(STORAGE_PHRASES_KEY);
          state.phrases = raw ? JSON.parse(raw) : DEFAULT_PHRASES.map(p => ({ ...p }));
          const savedView = localStorage.getItem(STORAGE_PHRASE_VIEW_KEY);
          if (savedView === 'category' || savedView === 'all') {
            state.phraseView = savedView;
          }
        } catch (err) {
          state.phrases = DEFAULT_PHRASES.map(p => ({ ...p }));
        }
      }

      function savePhrases() {
        try {
          localStorage.setItem(STORAGE_PHRASES_KEY, JSON.stringify(state.phrases));
          localStorage.setItem(STORAGE_PHRASE_VIEW_KEY, state.phraseView);
        } catch (err) {
          // Ignore storage quota errors
        }
      }

      function getPhraseCategories() {
        const base = ['樓層', '設備', '編號狀態', '自訂'];
        const set = new Set(base);
        state.phrases.forEach(p => { if (p.category) set.add(p.category); });
        return Array.from(set);
      }

      function populateCategorySelect(selectedCat) {
        const cats = getPhraseCategories();
        el.phraseCatSelect.innerHTML = '';
        cats.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          el.phraseCatSelect.appendChild(opt);
        });
        const newOpt = document.createElement('option');
        newOpt.value = '__NEW__';
        newOpt.textContent = '＋新增自訂分類...';
        el.phraseCatSelect.appendChild(newOpt);
        el.phraseCatSelect.value = cats.includes(selectedCat) ? selectedCat : '自訂';
        el.phraseCustomCatInput.classList.add('hidden');
        el.phraseCustomCatInput.value = '';
      }

      function insertAtCursorNoSpace(textToInsert) {
        const input = el.textAnnInput;
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        const before = input.value.slice(0, start);
        const after = input.value.slice(end);
        input.value = before + textToInsert + after;
        const nextPos = start + textToInsert.length;
        input.focus();
        input.setSelectionRange(nextPos, nextPos);
      }

      function renderPhrasePanel() {
        el.btnViewCategory.classList.toggle('active', state.phraseView === 'category');
        el.btnViewAll.classList.toggle('active', state.phraseView === 'all');
        el.btnToggleManagePhrase.classList.toggle('active', state.phraseManageMode);
        el.phraseManageBar.classList.toggle('hidden', !state.phraseManageMode);

        el.phrasePanel.innerHTML = '';

        const makeChip = (phrase) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'phrase-chip' + (state.editingPhraseId === phrase.id ? ' editing' : '');

          const label = document.createElement('span');
          label.textContent = phrase.text;
          chip.appendChild(label);

          if (state.phraseManageMode) {
            const del = document.createElement('span');
            del.className = 'chip-del';
            del.textContent = '×';
            del.title = '刪除詞彙';
            del.addEventListener('click', (ev) => {
              ev.stopPropagation();
              state.phrases = state.phrases.filter(p => p.id !== phrase.id);
              if (state.editingPhraseId === phrase.id) {
                state.editingPhraseId = null;
                el.phraseFormBox.classList.add('hidden');
              }
              savePhrases();
              renderPhrasePanel();
            });
            chip.appendChild(del);

            chip.addEventListener('click', () => {
              state.editingPhraseId = phrase.id;
              el.phraseTextInput.value = phrase.text;
              populateCategorySelect(phrase.category);
              el.phraseFormBox.classList.remove('hidden');
              el.phraseTextInput.focus();
              renderPhrasePanel();
            });
          } else {
            chip.addEventListener('click', () => {
              insertAtCursorNoSpace(phrase.text);
            });
          }
          return chip;
        };

        if (state.phraseView === 'all') {
          const wrap = document.createElement('div');
          wrap.className = 'phrase-chips';
          state.phrases.forEach(p => wrap.appendChild(makeChip(p)));
          el.phrasePanel.appendChild(wrap);
        } else {
          const cats = getPhraseCategories();
          cats.forEach(cat => {
            const list = state.phrases.filter(p => (p.category || '自訂') === cat);
            if (!list.length) return;
            const block = document.createElement('div');
            block.className = 'phrase-cat-block';
            const title = document.createElement('div');
            title.className = 'phrase-cat-title';
            title.textContent = cat;
            const wrap = document.createElement('div');
            wrap.className = 'phrase-chips';
            list.forEach(p => wrap.appendChild(makeChip(p)));
            block.appendChild(title);
            block.appendChild(wrap);
            el.phrasePanel.appendChild(block);
          });
        }
      }

      function openTextModal(context) {
        textDialogContext = context;
        state.phraseManageMode = false;
        state.editingPhraseId = null;
        state.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        el.phraseFormBox.classList.add('hidden');

        el.textModalTitle.textContent = context.mode === 'edit' ? '編輯文字註解' : '新增文字註解';
        el.textAnnInput.value = context.mode === 'edit' ? context.ann.text : '';
        renderPhrasePanel();
        el.textModal.classList.remove('hidden');
        setTimeout(() => {
          el.textAnnInput.focus();
          const len = el.textAnnInput.value.length;
          el.textAnnInput.setSelectionRange(len, len);
