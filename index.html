      /* -------------------- G. History (Undo / Redo) -------------------- */
      function cloneAnnotation(a) {
        const copy = { ...a };
        if (a.points) copy.points = a.points.map(p => ({ x: p.x, y: p.y }));
        return copy;
      }

      function pushHistory() {
        const snapshot = {
          layers: state.layers.map(l => ({ ...l })),
          annotations: state.annotations.map(cloneAnnotation),
          selectedLayerId: state.selectedLayerId,
          selectedAnnId: state.selectedAnnId
        };
        if (state.historyIndex < state.history.length - 1) {
          state.history = state.history.slice(0, state.historyIndex + 1);
        }
        state.history.push(snapshot);
        if (state.history.length > 60) {
          state.history.shift();
        }
        state.historyIndex = state.history.length - 1;
        updateHistoryButtons();
      }

      function applySnapshot(snap) {
        state.layers = snap.layers.map(l => ({ ...l }));
        state.annotations = snap.annotations.map(cloneAnnotation);
        state.selectedLayerId = state.layers.some(l => l.id === snap.selectedLayerId) ? snap.selectedLayerId : null;
        state.selectedAnnId = state.annotations.some(a => a.id === snap.selectedAnnId) ? snap.selectedAnnId : null;
        state.justCreatedAnnId = null;
        updateHistoryButtons();
        updateContextBars();
        updateExifStatusUI();
        renderMainCanvas();
      }

      function undo() {
        if (state.historyIndex <= 0) return;
        state.historyIndex--;
        applySnapshot(state.history[state.historyIndex]);
      }

      function redo() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex++;
        applySnapshot(state.history[state.historyIndex]);
      }

      function updateHistoryButtons() {
        el.btnUndo.disabled = state.historyIndex <= 0;
        el.btnRedo.disabled = state.historyIndex >= state.history.length - 1;
      }

      /* -------------------- H. Viewport & Coordinate Math -------------------- */
      let lastStageSize = { w: 0, h: 0 };

      function screenToWorld(sx, sy) {
        return {
          x: (sx - state.viewport.offsetX) / state.viewport.scale,
          y: (sy - state.viewport.offsetY) / state.viewport.scale
        };
      }

      function worldToScreen(wx, wy) {
        return {
          x: wx * state.viewport.scale + state.viewport.offsetX,
          y: wy * state.viewport.scale + state.viewport.offsetY
        };
      }

      function getCanvasPoint(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        return {
          sx: clientX - rect.left,
          sy: clientY - rect.top
        };
      }

      function fitCadToScreen() {
        const rect = el.canvasStage.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const pad = 24;
        const availW = Math.max(40, rect.width - pad * 2);
        const availH = Math.max(40, rect.height - pad * 2);
        const scale = Math.min(availW / state.cad.width, availH / state.cad.height);
        state.viewport.scale = Math.max(state.viewport.minScale, Math.min(state.viewport.maxScale, scale));
        state.viewport.offsetX = (rect.width - state.cad.width * state.viewport.scale) / 2;
        state.viewport.offsetY = (rect.height - state.cad.height * state.viewport.scale) / 2;
        updateZoomLabel();
        renderMainCanvas();
      }

      function zoomAt(factor, pivotSx, pivotSy) {
        const rect = el.canvasStage.getBoundingClientRect();
        const sx = pivotSx !== undefined ? pivotSx : rect.width / 2;
        const sy = pivotSy !== undefined ? pivotSy : rect.height / 2;
        const before = screenToWorld(sx, sy);
        const nextScale = Math.max(state.viewport.minScale, Math.min(state.viewport.maxScale, state.viewport.scale * factor));
        state.viewport.scale = nextScale;
        state.viewport.offsetX = sx - before.x * nextScale;
        state.viewport.offsetY = sy - before.y * nextScale;
        updateZoomLabel();
        renderMainCanvas();
      }

      function updateZoomLabel() {
        el.zoomPercent.textContent = `${Math.round(state.viewport.scale * 100)}%`;
      }

      function resizeMainCanvas() {
        const rect = el.canvasStage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const newW = rect.width;
        const newH = rect.height;

        // Keep current viewport center anchored when rotating or collapsing/expanding UI
        if (lastStageSize.w > 0 && lastStageSize.h > 0 && newW > 0 && newH > 0) {
          state.viewport.offsetX += (newW - lastStageSize.w) / 2;
          state.viewport.offsetY += (newH - lastStageSize.h) / 2;
        }
        if (newW > 0 && newH > 0) {
          lastStageSize = { w: newW, h: newH };
        }

        el.mainCanvas.width = Math.max(1, Math.round(newW * dpr));
        el.mainCanvas.height = Math.max(1, Math.round(newH * dpr));
        renderMainCanvas();
      }

      /* -------------------- I. Geometry & Hit-Testing Helpers -------------------- */
      function worldToLocal(px, py, cx, cy, rot) {
        const dx = px - cx;
        const dy = py - cy;
        const c = Math.cos(-rot);
        const s = Math.sin(-rot);
        return { x: dx * c - dy * s, y: dx * s + dy * c };
      }

      function localToWorld(lx, ly, cx, cy, rot) {
        const c = Math.cos(rot);
        const s = Math.sin(rot);
        return { x: cx + lx * c - ly * s, y: cy + lx * s + ly * c };
      }

      function distToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function measureTextBox(ctx, ann) {
        ctx.save();
        ctx.font = `700 ${ann.fontSize}px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif`;
        const metrics = ctx.measureText(ann.text || ' ');
        ctx.restore();
        const padX = Math.max(8, ann.fontSize * 0.28);
        const padY = Math.max(5, ann.fontSize * 0.18);
        const w = Math.max(24, metrics.width) + padX * 2;
        const h = ann.fontSize * 1.25 + padY * 2;
        return { x: ann.x - padX, y: ann.y - h / 2, w, h, padX, padY };
      }

      function hitTestLayerHandle(wx, wy, layer) {
        const handleRadius = 15 / state.viewport.scale;
        const rotOffset = 34 / state.viewport.scale;
        const local = worldToLocal(wx, wy, layer.x, layer.y, layer.rotation);
        const hw = layer.w / 2;
        const hh = layer.h / 2;

        if (Math.hypot(local.x, local.y - (-hh - rotOffset)) <= handleRadius * 1.2) {
          return 'rotate';
        }
        const corners = [
          { name: 'tl', x: -hw, y: -hh },
          { name: 'tr', x: hw, y: -hh },
          { name: 'br', x: hw, y: hh },
          { name: 'bl', x: -hw, y: hh }
        ];
        for (const c of corners) {
          if (Math.hypot(local.x - c.x, local.y - c.y) <= handleRadius) {
            return c.name;
          }
        }
        if (Math.abs(local.x) <= hw && Math.abs(local.y) <= hh) {
          return 'move';
        }
        return null;
      }

      function hitTestAnnotationHandle(wx, wy, ann) {
        const handleR = 15 / state.viewport.scale;
        const rotOffset = 34 / state.viewport.scale;

        if (ann.type === 'arrow' || ann.type === 'line') {
          if (Math.hypot(wx - ann.x1, wy - ann.y1) <= handleR) return 'p1';
          if (Math.hypot(wx - ann.x2, wy - ann.y2) <= handleR) return 'p2';
        } else if (ann.type === 'rect' || ann.type === 'circle') {
          const rot = ann.rotation || 0;
          const local = worldToLocal(wx, wy, ann.cx, ann.cy, rot);
          const hw = ann.w / 2;
          const hh = ann.h / 2;
          if (Math.hypot(local.x, local.y - (-hh - rotOffset)) <= handleR * 1.2) {
            return 'rotate';
          }
          const corners = [
            { name: 'tl', x: -hw, y: -hh },
            { name: 'tr', x: hw, y: -hh },
            { name: 'br', x: hw, y: hh },
            { name: 'bl', x: -hw, y: hh }
          ];
          for (const c of corners) {
            if (Math.hypot(local.x - c.x, local.y - c.y) <= handleR) return c.name;
          }
        }
        if (hitTestAnnotationBody(wx, wy, ann, 10 / state.viewport.scale)) {
          return 'move';
        }
        return null;
      }

      function hitTestAnnotationBody(wx, wy, ann, extraTol = 8) {
        const tol = Math.max(extraTol, (ann.size || 6) * 0.75);
        if (ann.type === 'arrow' || ann.type === 'line') {
          return distToSegment(wx, wy, ann.x1, ann.y1, ann.x2, ann.y2) <= tol;
        }
        if (ann.type === 'rect') {
          const local = worldToLocal(wx, wy, ann.cx, ann.cy, ann.rotation || 0);
          const hw = ann.w / 2;
          const hh = ann.h / 2;
          const inOuter = Math.abs(local.x) <= hw + tol && Math.abs(local.y) <= hh + tol;
          const inInner = Math.abs(local.x) < Math.max(0, hw - tol) && Math.abs(local.y) < Math.max(0, hh - tol);
          return inOuter && (!inInner || (hw < 24 && hh < 24));
        }
        if (ann.type === 'circle') {
          const local = worldToLocal(wx, wy, ann.cx, ann.cy, ann.rotation || 0);
          const rx = Math.max(4, ann.w / 2);
          const ry = Math.max(4, ann.h / 2);
          // Normalized ellipse distance
          const normOuter = (local.x * local.x) / ((rx + tol) * (rx + tol)) + (local.y * local.y) / ((ry + tol) * (ry + tol));
          const rxIn = Math.max(1, rx - tol);
          const ryIn = Math.max(1, ry - tol);
          const normInner = (local.x * local.x) / (rxIn * rxIn) + (local.y * local.y) / (ryIn * ryIn);
          return normOuter <= 1 && (normInner >= 1 || (rx < 24 && ry < 24));
        }
        if (ann.type === 'freehand') {
          const pts = ann.points || [];
          if (pts.length === 1) return Math.hypot(wx - pts[0].x, wy - pts[0].y) <= tol;
          for (let i = 0; i < pts.length - 1; i++) {
            if (distToSegment(wx, wy, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= tol) {
              return true;
            }
          }
          return false;
        }
        if (ann.type === 'text') {
          const box = measureTextBox(mainCtx, ann);
          return wx >= box.x - 4 && wx <= box.x + box.w + 4 && wy >= box.y - 4 && wy <= box.y + box.h + 4;
        }
        return false;
      }

      /* -------------------- J. Canvas Rendering -------------------- */
      function drawAnnotation(ctx, ann) {
        ctx.save();
        ctx.strokeStyle = ann.color;
        ctx.fillStyle = ann.color;
        ctx.lineWidth = ann.size || 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (ann.type === 'line') {
          ctx.beginPath();
          ctx.moveTo(ann.x1, ann.y1);
          ctx.lineTo(ann.x2, ann.y2);
          ctx.stroke();
        } else if (ann.type === 'arrow') {
          const dx = ann.x2 - ann.x1;
          const dy = ann.y2 - ann.y1;
          const angle = Math.atan2(dy, dx);
          const headLen = Math.max(16, (ann.size || 6) * 3.2);
          ctx.beginPath();
          ctx.moveTo(ann.x1, ann.y1);
          ctx.lineTo(ann.x2, ann.y2);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(ann.x2, ann.y2);
          ctx.lineTo(ann.x2 - headLen * Math.cos(angle - Math.PI / 6), ann.y2 - headLen * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(ann.x2 - headLen * Math.cos(angle + Math.PI / 6), ann.y2 - headLen * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fill();
        } else if (ann.type === 'rect') {
          ctx.translate(ann.cx, ann.cy);
          ctx.rotate(ann.rotation || 0);
          ctx.strokeRect(-ann.w / 2, -ann.h / 2, ann.w, ann.h);
        } else if (ann.type === 'circle') {
          ctx.translate(ann.cx, ann.cy);
          ctx.rotate(ann.rotation || 0);
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.max(2, ann.w / 2), Math.max(2, ann.h / 2), 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (ann.type === 'freehand') {
          const pts = ann.points || [];
          if (pts.length > 0) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
              ctx.lineTo(pts[i].x, pts[i].y);
            }
            if (pts.length === 1) ctx.lineTo(pts[0].x + 0.1, pts[0].y + 0.1);
            ctx.stroke();
          }
        } else if (ann.type === 'text') {
          const box = measureTextBox(ctx, ann);
          const r = Math.min(10, box.h * 0.28);
          // Subtle readable backing pill
          ctx.fillStyle = ann.color === '#0f172a' ? 'rgba(255, 255, 255, 0.88)' : 'rgba(15, 23, 42, 0.78)';
          drawRoundedRect(ctx, box.x, box.y, box.w, box.h, r);
          ctx.fill();
          ctx.strokeStyle = ann.color;
          ctx.lineWidth = Math.max(1.5, ann.fontSize * 0.055);
          ctx.stroke();

          ctx.fillStyle = ann.color;
          ctx.font = `700 ${ann.fontSize}px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(ann.text, ann.x, ann.y + 1);
        }

        ctx.restore();
      }

      function drawRoundedRect(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawControlHandle(ctx, x, y, radius, fill = '#ffffff', stroke = '#0ea5e9') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, radius * 0.28);
        ctx.strokeStyle = stroke;
        ctx.stroke();
        ctx.restore();
      }

      function drawRotatedSelectionBox(ctx, cx, cy, w, h, rot, accentColor) {
        const inv = 1 / state.viewport.scale;
        const rotOffset = 34 * inv;
        const handleR = 7.5 * inv;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot || 0);

        // Dashed frame
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 2 * inv;
        ctx.setLineDash([6 * inv, 4 * inv]);
        ctx.strokeRect(-w / 2, -h / 2, w, h);

        // Rotation stem line
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(0, -h / 2 - rotOffset);
        ctx.stroke();

        // 4 corner resize handles
        drawControlHandle(ctx, -w / 2, -h / 2, handleR, '#ffffff', accentColor);
        drawControlHandle(ctx,  w / 2, -h / 2, handleR, '#ffffff', accentColor);
        drawControlHandle(ctx,  w / 2,  h / 2, handleR, '#ffffff', accentColor);
        drawControlHandle(ctx, -w / 2,  h / 2, handleR, '#ffffff', accentColor);

        // Top rotation handle
        drawControlHandle(ctx, 0, -h / 2 - rotOffset, handleR * 1.18, '#fef08a', '#ca8a04');

        ctx.restore();
      }

      function renderMainCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const w = el.mainCanvas.width / dpr;
        const h = el.mainCanvas.height / dpr;

        mainCtx.save();
        mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        mainCtx.clearRect(0, 0, w, h);

        // Stage background
        mainCtx.fillStyle = '#0b1120';
        mainCtx.fillRect(0, 0, w, h);

        // World transform
        mainCtx.translate(state.viewport.offsetX, state.viewport.offsetY);
        mainCtx.scale(state.viewport.scale, state.viewport.scale);

        // Drop shadow behind CAD sheet
        mainCtx.save();
        mainCtx.shadowColor = 'rgba(0,0,0,0.45)';
        mainCtx.shadowBlur = 24;
        mainCtx.fillStyle = '#ffffff';
        mainCtx.fillRect(0, 0, state.cad.width, state.cad.height);
        mainCtx.restore();

        // 1. CAD Base Map
        if (state.cad.source) {
          mainCtx.drawImage(state.cad.source, 0, 0, state.cad.width, state.cad.height);
        }

        // 2. Photo Layers
        for (const layer of state.layers) {
          mainCtx.save();
          mainCtx.translate(layer.x, layer.y);
          mainCtx.rotate(layer.rotation);
          mainCtx.drawImage(layer.croppedCanvas, -layer.w / 2, -layer.h / 2, layer.w, layer.h);
          // Subtle crisp border around overlaid photo
          mainCtx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
          mainCtx.lineWidth = Math.max(1.5, 2 / state.viewport.scale);
          mainCtx.strokeRect(-layer.w / 2, -layer.h / 2, layer.w, layer.h);
          mainCtx.restore();
        }

        // 3. Vector Annotations
        for (const ann of state.annotations) {
          drawAnnotation(mainCtx, ann);
        }

        // 4. Draft annotation while drawing
        if (state.draw.draft) {
          drawAnnotation(mainCtx, state.draw.draft);
        }

        // 5. Selection Gizmos (Photo Layer)
        if (state.mode === 'layer' && state.selectedLayerId) {
          const layer = state.layers.find(l => l.id === state.selectedLayerId);
          if (layer) {
            drawRotatedSelectionBox(mainCtx, layer.x, layer.y, layer.w, layer.h, layer.rotation, '#38bdf8');
          }
        }

        // 6. Selection Gizmos (Vector Annotation in Draw/Select)
        if (state.mode === 'draw' && state.selectedAnnId) {
          const ann = state.annotations.find(a => a.id === state.selectedAnnId);
          if (ann) {
            const inv = 1 / state.viewport.scale;
            const handleR = 7.5 * inv;
            if (ann.type === 'arrow' || ann.type === 'line') {
              mainCtx.save();
              mainCtx.strokeStyle = '#38bdf8';
              mainCtx.lineWidth = 1.5 * inv;
              mainCtx.setLineDash([5 * inv, 4 * inv]);
              mainCtx.beginPath();
              mainCtx.moveTo(ann.x1, ann.y1);
              mainCtx.lineTo(ann.x2, ann.y2);
              mainCtx.stroke();
              mainCtx.restore();
              drawControlHandle(mainCtx, ann.x1, ann.y1, handleR, '#ffffff', '#38bdf8');
              drawControlHandle(mainCtx, ann.x2, ann.y2, handleR, '#ffffff', '#38bdf8');
            } else if (ann.type === 'rect' || ann.type === 'circle') {
              drawRotatedSelectionBox(mainCtx, ann.cx, ann.cy, ann.w, ann.h, ann.rotation || 0, '#38bdf8');
            } else if (ann.type === 'text') {
              const box = measureTextBox(mainCtx, ann);
              mainCtx.save();
              mainCtx.strokeStyle = '#38bdf8';
              mainCtx.lineWidth = 2 * inv;
              mainCtx.setLineDash([6 * inv, 4 * inv]);
              mainCtx.strokeRect(box.x - 4 * inv, box.y - 4 * inv, box.w + 8 * inv, box.h + 8 * inv);
              mainCtx.restore();
            } else if (ann.type === 'freehand' && ann.points && ann.points.length) {
              let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
              ann.points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
              });
              const pad = 8 * inv;
              mainCtx.save();
              mainCtx.strokeStyle = '#38bdf8';
              mainCtx.lineWidth = 2 * inv;
              mainCtx.setLineDash([6 * inv, 4 * inv]);
              mainCtx.strokeRect(minX - pad, minY - pad, maxX - minX + pad * 2, maxY - minY + pad * 2);
              mainCtx.restore();
            }
          }
        }

        // 7. Eraser dashed circle preview
        if (state.mode === 'draw' && state.draw.tool === 'eraser' && state.draw.eraserCursor) {
          const { wx, wy } = state.draw.eraserCursor;
          const r = state.draw.sizes.eraser / 2;
          mainCtx.save();
          mainCtx.beginPath();
          mainCtx.arc(wx, wy, r, 0, Math.PI * 2);
          mainCtx.fillStyle = 'rgba(250, 204, 21, 0.16)';
          mainCtx.fill();
          mainCtx.strokeStyle = '#fde047';
          mainCtx.lineWidth = 2 / state.viewport.scale;
          mainCtx.setLineDash([5 / state.viewport.scale, 4 / state.viewport.scale]);
          mainCtx.stroke();
          mainCtx.restore();
        }

        mainCtx.restore();
      }

      /* -------------------- K. Mode & UI Switching -------------------- */
      function setMode(mode) {
        if (mode === 'addPhoto') {
          el.photoFileInput.value = '';
          el.photoFileInput.click();
          return;
        }
        state.mode = mode;
        if (mode !== 'layer') state.selectedLayerId = null;
        if (mode !== 'draw') {
          state.selectedAnnId = null;
          state.justCreatedAnnId = null;
          state.draw.eraserCursor = null;
        }

        [el.tabView, el.tabLayer, el.tabDraw].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        el.drawSubbar.classList.toggle('hidden', mode !== 'draw');
        updateModeBadge();
        updateContextBars();
        renderMainCanvas();
        requestAnimationFrame(resizeMainCanvas);
      }

      function setDrawTool(tool) {
        state.draw.tool = tool;
        state.justCreatedAnnId = null; // Switching tools clears the just-created target
        if (tool !== 'select') {
          state.selectedAnnId = null;
        }
        state.draw.eraserCursor = null;
        el.toolRow.querySelectorAll('.tool-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tool === tool);
        });
        updateModeBadge();
        updateContextBars();
        renderMainCanvas();
      }

      function updateModeBadge() {
        if (state.mode === 'view') {
          el.modeBadge.textContent = '底圖檢視：拖曳平移、滾輪或雙指縮放';
        } else if (state.mode === 'layer') {
          el.modeBadge.textContent = state.selectedLayerId
            ? '圖層編輯：拖曳移動、四角縮放、頂端圓點旋轉'
            : '圖層編輯：點擊疊加照片以選取並調整';
        } else if (state.mode === 'draw') {
          const hints = {
            select: '選取編輯：點選標註可移動、縮放、旋轉（雙擊文字修改）',
            arrow: '標註：拖曳繪製箭頭（完成後可直接按 −/+ 調整粗細）',
            line: '標註：拖曳繪製直線',
            rect: '標註：拖曳繪製矩形（切至選取編輯可旋轉）',
            circle: '標註：拖曳繪製圓圈（切至選取編輯可旋轉）',
            freehand: '標註：手繪線條',
            text: '標註：點擊畫布位置以新增文字註解',
            eraser: '橡皮擦：拖曳擦除標註（按 −/+ 調整範圍）'
          };
          el.modeBadge.textContent = hints[state.draw.tool] || '標註繪圖';
        }
      }

      function updateContextBars() {
        // Layer bar
        const showLayerBar = state.mode === 'layer' && !!state.selectedLayerId;
        el.layerContextBar.classList.toggle('hidden', !showLayerBar);

        // Annotation bar
        const ann = (state.mode === 'draw' && state.draw.tool === 'select' && state.selectedAnnId)
          ? state.annotations.find(a => a.id === state.selectedAnnId)
          : null;
        el.annContextBar.classList.toggle('hidden', !ann);
        if (ann) {
          el.btnAnnEditText.classList.toggle('hidden', ann.type !== 'text');
        }
        updateModeBadge();
      }

      /* -------------------- L. Independent − / + Size Control & Immediate Apply -------------------- */
      function adjustSize(dir) {
        // Determine active target annotation:
        // 1) Selected annotation in select mode, OR
        // 2) Just-created annotation right after creation in draw mode
        let targetAnn = null;
        if (state.mode === 'draw') {
          if (state.draw.tool === 'select' && state.selectedAnnId) {
            targetAnn = state.annotations.find(a => a.id === state.selectedAnnId) || null;
          } else if (state.justCreatedAnnId) {
            targetAnn = state.annotations.find(a => a.id === state.justCreatedAnnId) || null;
          }
        }

        const toolKey = targetAnn ? targetAnn.type : state.draw.tool;
        const meta = TOOL_META[toolKey];
        if (!meta) {
          showSizeHud('請先選取標註或繪圖工具');
          return;
        }

        const currentVal = targetAnn
          ? (targetAnn.type === 'text' ? targetAnn.fontSize : targetAnn.size)
          : state.draw.sizes[toolKey];

        const nextVal = Math.max(meta.min, Math.min(meta.max, currentVal + dir * meta.step));
        state.draw.sizes[toolKey] = nextVal;

        if (targetAnn) {
          if (targetAnn.type === 'text') {
            targetAnn.fontSize = nextVal;
          } else {
            targetAnn.size = nextVal;
          }
          pushHistory();
          renderMainCanvas();
        }

        showSizeHud(`${meta.label}：${nextVal} px`);
      }

      function setDrawColor(color) {
        state.draw.color = color;
        el.swatchGroup.querySelectorAll('.swatch').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });

        // Live apply to selected or just-created annotation
        let targetAnn = null;
        if (state.mode === 'draw') {
          if (state.draw.tool === 'select' && state.selectedAnnId) {
            targetAnn = state.annotations.find(a => a.id === state.selectedAnnId) || null;
          } else if (state.justCreatedAnnId) {
            targetAnn = state.annotations.find(a => a.id === state.justCreatedAnnId) || null;
          }
        }
        if (targetAnn) {
          targetAnn.color = color;
          pushHistory();
          renderMainCanvas();
        }
      }

      /* -------------------- M. Main Canvas Pointer & Pinch Interactions -------------------- */
      const activePointers = new Map();
      let pinchState = null;
      let dragOp = null;
      let lastTapInfo = { time: 0, annId: null };

      el.mainCanvas.addEventListener('pointerdown', (e) => {
        el.mainCanvas.setPointerCapture(e.pointerId);
        const { sx, sy } = getCanvasPoint(e.clientX, e.clientY);
        activePointers.set(e.pointerId, { sx, sy });

        // Two-finger pinch zoom in view mode (or anytime 2 fingers touch)
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[1].sx - pts[0].sx, pts[1].sy - pts[0].sy);
          const midX = (pts[0].sx + pts[1].sx) / 2;
          const midY = (pts[0].sy + pts[1].sy) / 2;
          pinchState = {
            startDist: Math.max(10, dist),
            startScale: state.viewport.scale,
            worldMid: screenToWorld(midX, midY)
          };
          dragOp = null;
          state.draw.draft = null;
          return;
        }

        const w = screenToWorld(sx, sy);

        // 1) VIEW MODE: pan
        if (state.mode === 'view') {
          dragOp = {
            kind: 'pan',
            startSx: sx,
            startSy: sy,
            origOffX: state.viewport.offsetX,
            origOffY: state.viewport.offsetY
          };
          return;
        }

        // 2) LAYER MODE: select / move / resize / rotate photo layers
        if (state.mode === 'layer') {
          // Check currently selected layer handles first
          if (state.selectedLayerId) {
            const sel = state.layers.find(l => l.id === state.selectedLayerId);
            if (sel) {
              const handle = hitTestLayerHandle(w.x, w.y, sel);
              if (handle) {
                startLayerTransform(sel, handle, w.x, w.y);
                return;
              }
            }
          }
          // Hit-test layers from top to bottom
          let hitLayer = null;
          for (let i = state.layers.length - 1; i >= 0; i--) {
            const l = state.layers[i];
            if (hitTestLayerHandle(w.x, w.y, l) === 'move') {
              hitLayer = l;
              break;
            }
          }
          state.selectedLayerId = hitLayer ? hitLayer.id : null;
          updateContextBars();
          renderMainCanvas();
          if (hitLayer) {
            startLayerTransform(hitLayer, 'move', w.x, w.y);
          }
          return;
        }

        // 3) DRAW MODE
        if (state.mode === 'draw') {
          const tool = state.draw.tool;

          if (tool === 'select') {
            // Check handles of selected annotation first
            if (state.selectedAnnId) {
              const sel = state.annotations.find(a => a.id === state.selectedAnnId);
              if (sel) {
                const h = hitTestAnnotationHandle(w.x, w.y, sel);
                if (h) {
                  // Double-tap text check
                  if (sel.type === 'text' && h === 'move') {
                    const now = Date.now();
                    if (lastTapInfo.annId === sel.id && now - lastTapInfo.time < 340) {
                      lastTapInfo = { time: 0, annId: null };
                      openTextModal({ editAnn: sel });
                      return;
                    }
                    lastTapInfo = { time: now, annId: sel.id };
                  }
                  startAnnTransform(sel, h, w.x, w.y);
                  return;
                }
              }
            }
            // Hit-test annotations from top to bottom
            let hitAnn = null;
            for (let i = state.annotations.length - 1; i >= 0; i--) {
              if (hitTestAnnotationBody(w.x, w.y, state.annotations[i], 10 / state.viewport.scale)) {
                hitAnn = state.annotations[i];
                break;
              }
            }
            state.selectedAnnId = hitAnn ? hitAnn.id : null;
            if (hitAnn) {
              // Sync color swatch visually
              el.swatchGroup.querySelectorAll('.swatch').forEach(b => {
                b.classList.toggle('active', b.dataset.color === hitAnn.color);
              });
              if (hitAnn.type === 'text') {
                lastTapInfo = { time: Date.now(), annId: hitAnn.id };
              }
              startAnnTransform(hitAnn, 'move', w.x, w.y);
            }
            updateContextBars();
            renderMainCanvas();
            return;
          }

          if (tool === 'text') {
            openTextModal({ wx: w.x, wy: w.y });
            return;
          }

          if (tool === 'eraser') {
            state.draw.eraserCursor = { wx: w.x, wy: w.y };
            dragOp = { kind: 'erase', erasedAny: false };
            if (eraseAt(w.x, w.y)) dragOp.erasedAny = true;
            renderMainCanvas();
            return;
          }

          // Drawing new shape (arrow, line, rect, circle, freehand)
          const size = state.draw.sizes[tool] || 6;
          const color = state.draw.color;
          if (tool === 'arrow' || tool === 'line') {
            state.draw.draft = { id: genId('ann'), type: tool, x1: w.x, y1: w.y, x2: w.x, y2: w.y, color, size };
          } else if (tool === 'rect' || tool === 'circle') {
            state.draw.draft = { id: genId('ann'), type: tool, cx: w.x, cy: w.y, w: 2, h: 2, rotation: 0, color, size, _startX: w.x, _startY: w.y };
          } else if (tool === 'freehand') {
            state.draw.draft = { id: genId('ann'), type: 'freehand', points: [{ x: w.x, y: w.y }], color, size };
          }
          dragOp = { kind: 'drawShape' };
          renderMainCanvas();
        }
      });

      function startLayerTransform(layer, handle, wx, wy) {
        dragOp = {
          kind: 'layer',
          handle,
          layer,
          startWx: wx,
          startWy: wy,
          origX: layer.x,
          origY: layer.y,
          origW: layer.w,
          origH: layer.h,
          origRot: layer.rotation,
          startAngle: Math.atan2(wy - layer.y, wx - layer.x),
          startDist: Math.max(10, Math.hypot(wx - layer.x, wy - layer.y)),
          moved: false
        };
      }

      function startAnnTransform(ann, handle, wx, wy) {
        const op = {
          kind: 'ann',
          handle,
          ann,
          startWx: wx,
          startWy: wy,
          orig: cloneAnnotation(ann),
          moved: false
        };
        if ((ann.type === 'rect' || ann.type === 'circle') && handle === 'rotate') {
          op.startAngle = Math.atan2(wy - ann.cy, wx - ann.cx);
          op.origRot = ann.rotation || 0;
        }
        if ((ann.type === 'rect' || ann.type === 'circle') && ['tl', 'tr', 'br', 'bl'].includes(handle)) {
          // Lock opposite corner in world coordinates
          const hw = ann.w / 2;
          const hh = ann.h / 2;
          const oppLocal = {
            tl: { x:  hw, y:  hh, sx: -1, sy: -1 },
            tr: { x: -hw, y:  hh, sx:  1, sy: -1 },
            br: { x: -hw, y: -hh, sx:  1, sy:  1 },
            bl: { x:  hw, y: -hh, sx: -1, sy:  1 }
          }[handle];
          op.anchorWorld = localToWorld(oppLocal.x, oppLocal.y, ann.cx, ann.cy, ann.rotation || 0);
          op.sx = oppLocal.sx;
          op.sy = oppLocal.sy;
        }
        dragOp = op;
      }

      function eraseAt(wx, wy) {
        const radius = state.draw.sizes.eraser / 2;
        const before = state.annotations.length;
        state.annotations = state.annotations.filter(ann => !hitTestAnnotationBody(wx, wy, ann, radius));
        if (state.annotations.length !== before) {
          if (state.selectedAnnId && !state.annotations.some(a => a.id === state.selectedAnnId)) {
            state.selectedAnnId = null;
          }
          if (state.justCreatedAnnId && !state.annotations.some(a => a.id === state.justCreatedAnnId)) {
            state.justCreatedAnnId = null;
          }
          return true;
        }
        return false;
      }

      el.mainCanvas.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        const { sx, sy } = getCanvasPoint(e.clientX, e.clientY);
        activePointers.set(e.pointerId, { sx, sy });

        // Pinch zoom
        if (pinchState && activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[1].sx - pts[0].sx, pts[1].sy - pts[0].sy);
          const midX = (pts[0].sx + pts[1].sx) / 2;
          const midY = (pts[0].sy + pts[1].sy) / 2;
          const nextScale = Math.max(
            state.viewport.minScale,
            Math.min(state.viewport.maxScale, pinchState.startScale * (dist / pinchState.startDist))
          );
          state.viewport.scale = nextScale;
          state.viewport.offsetX = midX - pinchState.worldMid.x * nextScale;
          state.viewport.offsetY = midY - pinchState.worldMid.y * nextScale;
          updateZoomLabel();
          renderMainCanvas();
          return;
        }

        if (!dragOp) return;
        const w = screenToWorld(sx, sy);

        if (dragOp.kind === 'pan') {
          state.viewport.offsetX = dragOp.origOffX + (sx - dragOp.startSx);
          state.viewport.offsetY = dragOp.origOffY + (sy - dragOp.startSy);
          renderMainCanvas();
          return;
        }

        if (dragOp.kind === 'layer') {
          const l = dragOp.layer;
          dragOp.moved = true;
          if (dragOp.handle === 'move') {
            l.x = dragOp.origX + (w.x - dragOp.startWx);
            l.y = dragOp.origY + (w.y - dragOp.startWy);
          } else if (dragOp.handle === 'rotate') {
            const ang = Math.atan2(w.y - l.y, w.x - l.x);
            l.rotation = dragOp.origRot + (ang - dragOp.startAngle);
            const deg = ((Math.round(l.rotation * 180 / Math.PI) % 360) + 360) % 360;
            showSizeHud(`圖層角度：${deg}°`);
          } else {
            // Proportional corner resize
            const curDist = Math.max(12, Math.hypot(w.x - l.x, w.y - l.y));
            const ratio = curDist / dragOp.startDist;
            l.w = Math.max(30, dragOp.origW * ratio);
            l.h = Math.max(30, dragOp.origH * ratio);
          }
          renderMainCanvas();
          return;
        }

        if (dragOp.kind === 'ann') {
          const a = dragOp.ann;
          const orig = dragOp.orig;
          const dx = w.x - dragOp.startWx;
          const dy = w.y - dragOp.startWy;
          if (Math.hypot(dx, dy) > 1.5 / state.viewport.scale) dragOp.moved = true;

          if (dragOp.handle === 'move') {
            if (a.type === 'arrow' || a.type === 'line') {
              a.x1 = orig.x1 + dx; a.y1 = orig.y1 + dy;
              a.x2 = orig.x2 + dx; a.y2 = orig.y2 + dy;
            } else if (a.type === 'rect' || a.type === 'circle') {
              a.cx = orig.cx + dx; a.cy = orig.cy + dy;
            } else if (a.type === 'text') {
              a.x = orig.x + dx; a.y = orig.y + dy;
            } else if (a.type === 'freehand') {
              a.points = orig.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
            }
          } else if (dragOp.handle === 'p1') {
            a.x1 = w.x; a.y1 = w.y;
          } else if (dragOp.handle === 'p2') {
            a.x2 = w.x; a.y2 = w.y;
          } else if (dragOp.handle === 'rotate') {
            const ang = Math.atan2(w.y - a.cy, w.x - a.cx);
            a.rotation = dragOp.origRot + (ang - dragOp.startAngle);
            const deg = ((Math.round(a.rotation * 180 / Math.PI) % 360) + 360) % 360;
            showSizeHud(`旋轉角度：${deg}°`);
          } else if (['tl', 'tr', 'br', 'bl'].includes(dragOp.handle)) {
            // Opposite-corner-locked rotated resize
            const rot = a.rotation || 0;
            const localVec = worldToLocal(w.x, w.y, dragOp.anchorWorld.x, dragOp.anchorWorld.y, rot);
            const newW = Math.max(12, localVec.x * dragOp.sx);
            const newH = Math.max(12, localVec.y * dragOp.sy);
            const halfLocalX = (newW / 2) * dragOp.sx;
            const halfLocalY = (newH / 2) * dragOp.sy;
            const newCenter = localToWorld(halfLocalX, halfLocalY, dragOp.anchorWorld.x, dragOp.anchorWorld.y, rot);
            a.w = newW;
            a.h = newH;
            a.cx = newCenter.x;
            a.cy = newCenter.y;
          }
          renderMainCanvas();
          return;
        }

        if (dragOp.kind === 'erase') {
          state.draw.eraserCursor = { wx: w.x, wy: w.y };
          if (eraseAt(w.x, w.y)) dragOp.erasedAny = true;
          renderMainCanvas();
          return;
        }

        if (dragOp.kind === 'drawShape' && state.draw.draft) {
          const d = state.draw.draft;
          if (d.type === 'arrow' || d.type === 'line') {
            d.x2 = w.x; d.y2 = w.y;
          } else if (d.type === 'rect' || d.type === 'circle') {
            d.cx = (d._startX + w.x) / 2;
            d.cy = (d._startY + w.y) / 2;
            d.w = Math.max(4, Math.abs(w.x - d._startX));
            d.h = Math.max(4, Math.abs(w.y - d._startY));
          } else if (d.type === 'freehand') {
            const last = d.points[d.points.length - 1];
            if (Math.hypot(w.x - last.x, w.y - last.y) >= 2.5 / state.viewport.scale) {
              d.points.push({ x: w.x, y: w.y });
            }
          }
          renderMainCanvas();
        }
      });

      function finishPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          pinchState = null;
        }
        if (activePointers.size > 0 || !dragOp) return;

        if (dragOp.kind === 'layer' && dragOp.moved) {
          pushHistory();
        } else if (dragOp.kind === 'ann' && dragOp.moved) {
          pushHistory();
        } else if (dragOp.kind === 'erase') {
          state.draw.eraserCursor = null;
          if (dragOp.erasedAny) pushHistory();
          updateContextBars();
          renderMainCanvas();
        } else if (dragOp.kind === 'drawShape' && state.draw.draft) {
          const d = state.draw.draft;
          delete d._startX;
          delete d._startY;
          let valid = true;
          if (d.type === 'arrow' || d.type === 'line') {
            valid = Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 4;
          } else if (d.type === 'rect' || d.type === 'circle') {
            valid = d.w > 6 || d.h > 6;
          }
          if (valid) {
            state.annotations.push(d);
            state.justCreatedAnnId = d.id; // Allow immediate − / + size adjustment
            pushHistory();
          }
          state.draw.draft = null;
          renderMainCanvas();
        }
        dragOp = null;
      }

      el.mainCanvas.addEventListener('pointerup', finishPointer);
      el.mainCanvas.addEventListener('pointercancel', finishPointer);

      // Mouse wheel zoom
      el.mainCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const { sx, sy } = getCanvasPoint(e.clientX, e.clientY);
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        zoomAt(factor, sx, sy);
      }, { passive: false });

      /* -------------------- N. CAD & Photo File Loading + Local Crop Modal -------------------- */
      el.btnImportCad.addEventListener('click', () => {
        el.cadFileInput.value = '';
        el.cadFileInput.click();
      });

      el.cadFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          state.cad.name = file.name;
          state.cad.width = img.naturalWidth;
          state.cad.height = img.naturalHeight;
          state.cad.source = img;
          el.cadNameDisplay.textContent = file.name;
          el.cadNameDisplay.title = file.name;
          fitCadToScreen();
          showToast(`已載入 CAD 底圖：${file.name}`);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          showToast('無法讀取此影像檔案，請確認格式為 PNG/JPG');
        };
        img.src = url;
      });

      // Sequential Crop Queue
      const cropState = {
        queue: [], // { img, exifDate, hasGps, fileName }
        recropLayer: null,
        current: null,
        rotDeg: 0, // 0, 90, 180, 270
        aspect: 'free', // 'free' | number
        // Normalized crop rect in rotated image space [0..1]
        rect: { x: 0.1, y: 0.1, w: 0.8, h: 0.8 },
        // Display box of rotated image on cropCanvas
        disp: { x: 0, y: 0, w: 0, h: 0 },
        drag: null
      };

      el.photoFileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        let anyMissingGps = false;
        const loadedItems = [];

        for (const file of files) {
          try {
            const buf = await file.arrayBuffer();
            const exif = parseExifFromArrayBuffer(buf);
            if (!exif.hasGps) anyMissingGps = true;
            const img = await loadImageFromBlob(file);
            loadedItems.push({
              img,
              exifDate: exif.date || todayFormatted(),
              hasGps: exif.hasGps,
              fileName: file.name
            });
          } catch (err) {
            showToast(`略過無法讀取的相片：${file.name}`);
          }
        }

        if (!loadedItems.length) return;

        if (anyMissingGps) {
          state.exif.hasNoGpsWarning = true;
          showToast('提醒：部分相片無 GPS 訊號（僅顯示於頂部提示）', 2600);
        }
        updateExifStatusUI();

        cropState.recropLayer = null;
        cropState.queue = loadedItems;
        openNextInCropQueue();
      });

      function loadImageFromBlob(blob) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
          img.src = url;
        });
      }

      function openNextInCropQueue() {
        if (!cropState.queue.length) {
          closeCropModal();
          return;
        }
        cropState.current = cropState.queue.shift();
        cropState.rotDeg = 0;
        cropState.aspect = 'free';
        cropState.rect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
        el.cropModalTitle.textContent = cropState.recropLayer ? '重新裁切照片局部' : '局部裁切照片';
        el.cropQueueInfo.textContent = cropState.recropLayer
          ? '保留原始高解析相片，可重新選取裁切範圍'
          : `拖曳框內移動、拉動四角調整範圍${cropState.queue.length ? `（剩餘 ${cropState.queue.length} 張）` : ''}`;
        el.ratioGroup.querySelectorAll('.ratio-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.ratio === 'free');
        });
        el.cropModal.classList.remove('hidden');
        requestAnimationFrame(() => {
          layoutCropCanvas();
        });
      }

      function closeCropModal() {
        el.cropModal.classList.add('hidden');
        cropState.current = null;
        cropState.recropLayer = null;
        cropState.queue = [];
      }

      function getRotatedDims(img, rotDeg) {
        const swap = rotDeg === 90 || rotDeg === 270;
        return {
          w: swap ? img.naturalHeight : img.naturalWidth,
          h: swap ? img.naturalWidth : img.naturalHeight
        };
      }

      function layoutCropCanvas() {
        if (!cropState.current) return;
        const rect = el.cropStage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.cropCanvas.width = Math.max(1, Math.round(rect.width * dpr));
        el.cropCanvas.height = Math.max(1, Math.round(rect.height * dpr));

        const dims = getRotatedDims(cropState.current.img, cropState.rotDeg);
        const pad = 16;
        const availW = Math.max(40, rect.width - pad * 2);
        const availH = Math.max(40, rect.height - pad * 2);
        const scale = Math.min(availW / dims.w, availH / dims.h);
        const dw = dims.w * scale;
        const dh = dims.h * scale;
        cropState.disp = {
          x: (rect.width - dw) / 2,
          y: (rect.height - dh) / 2,
          w: dw,
          h: dh
        };
        renderCropCanvas();
      }

      function renderCropCanvas() {
        if (!cropState.current) return;
        const dpr = window.devicePixelRatio || 1;
        const cw = el.cropCanvas.width / dpr;
        const ch = el.cropCanvas.height / dpr;
        const { x, y, w, h } = cropState.disp;

        cropCtx.save();
        cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cropCtx.clearRect(0, 0, cw, ch);
        cropCtx.fillStyle = '#020617';
        cropCtx.fillRect(0, 0, cw, ch);

        // Draw rotated source photo
        cropCtx.save();
        cropCtx.translate(x + w / 2, y + h / 2);
        cropCtx.rotate((cropState.rotDeg * Math.PI) / 180);
        const swap = cropState.rotDeg === 90 || cropState.rotDeg === 270;
        const drawW = swap ? h : w;
        const drawH = swap ? w : h;
        cropCtx.drawImage(cropState.current.img, -drawW / 2, -drawH / 2, drawW, drawH);
        cropCtx.restore();

        // Crop box in display px
        const rx = x + cropState.rect.x * w;
        const ry = y + cropState.rect.y * h;
        const rw = cropState.rect.w * w;
        const rh = cropState.rect.h * h;

        // Dim outside area
        cropCtx.fillStyle = 'rgba(2, 6, 23, 0.62)';
        cropCtx.fillRect(0, 0, cw, ry);
        cropCtx.fillRect(0, ry + rh, cw, ch - (ry + rh));
        cropCtx.fillRect(0, ry, rx, rh);
        cropCtx.fillRect(rx + rw, ry, cw - (rx + rw), rh);

        // Crop border & rule-of-thirds grid
        cropCtx.strokeStyle = '#38bdf8';
        cropCtx.lineWidth = 2;
        cropCtx.strokeRect(rx, ry, rw, rh);

        cropCtx.strokeStyle = 'rgba(255,255,255,0.28)';
        cropCtx.lineWidth = 1;
        cropCtx.beginPath();
        cropCtx.moveTo(rx + rw / 3, ry); cropCtx.lineTo(rx + rw / 3, ry + rh);
        cropCtx.moveTo(rx + (2 * rw) / 3, ry); cropCtx.lineTo(rx + (2 * rw) / 3, ry + rh);
        cropCtx.moveTo(rx, ry + rh / 3); cropCtx.lineTo(rx + rw, ry + rh / 3);
        cropCtx.moveTo(rx, ry + (2 * rh) / 3); cropCtx.lineTo(rx + rw, ry + (2 * rh) / 3);
        cropCtx.stroke();

        // Corner handles
        const corners = [
          [rx, ry], [rx + rw, ry], [rx + rw, ry + rh], [rx, ry + rh]
        ];
        corners.forEach(([cx, cy]) => drawControlHandle(cropCtx, cx, cy, 8, '#ffffff', '#0ea5e9'));

        cropCtx.restore();
      }

      function applyCropAspect(ratio) {
        cropState.aspect = ratio;
        if (ratio === 'free' || !cropState.current) {
          renderCropCanvas();
          return;
        }
        const imgAspect = cropState.disp.w / Math.max(1, cropState.disp.h);
        const cx = cropState.rect.x + cropState.rect.w / 2;
        const cy = cropState.rect.y + cropState.rect.h / 2;
        let nw = cropState.rect.w;
        let nh = (nw * imgAspect) / ratio;
        if (nh > 0.92) {
          nh = 0.92;
          nw = (nh * ratio) / imgAspect;
        }
        if (nw > 0.92) {
          nw = 0.92;
          nh = (nw * imgAspect) / ratio;
        }
        cropState.rect.w = nw;
        cropState.rect.h = nh;
        cropState.rect.x = Math.max(0, Math.min(1 - nw, cx - nw / 2));
        cropState.rect.y = Math.max(0, Math.min(1 - nh, cy - nh / 2));
        renderCropCanvas();
      }

      el.ratioGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.ratio-btn');
        if (!btn) return;
        el.ratioGroup.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const val = btn.dataset.ratio === 'free' ? 'free' : parseFloat(btn.dataset.ratio);
        applyCropAspect(val);
      });

      el.btnCropRotate.addEventListener('click', () => {
        cropState.rotDeg = (cropState.rotDeg + 90) % 360;
        cropState.rect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
        layoutCropCanvas();
        if (cropState.aspect !== 'free') applyCropAspect(cropState.aspect);
      });

      // Crop canvas pointer dragging
      el.cropCanvas.addEventListener('pointerdown', (e) => {
        if (!cropState.current) return;
        el.cropCanvas.setPointerCapture(e.pointerId);
        const br = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - br.left;
        const py = e.clientY - br.top;
        const { x, y, w, h } = cropState.disp;
        const rx = x + cropState.rect.x * w;
        const ry = y + cropState.rect.y * h;
        const rw = cropState.rect.w * w;
        const rh = cropState.rect.h * h;

        const tol = 22;
        let handle = null;
        if (Math.hypot(px - rx, py - ry) <= tol) handle = 'tl';
        else if (Math.hypot(px - (rx + rw), py - ry) <= tol) handle = 'tr';
        else if (Math.hypot(px - (rx + rw), py - (ry + rh)) <= tol) handle = 'br';
        else if (Math.hypot(px - rx, py - (ry + rh)) <= tol) handle = 'bl';
        else if (px >= rx && px <= rx + rw && py >= ry && py <= ry + rh) handle = 'move';

        if (handle) {
          cropState.drag = {
            handle,
            startPx: px,
            startPy: py,
            origRect: { ...cropState.rect }
          };
        }
      });

      el.cropCanvas.addEventListener('pointermove', (e) => {
        if (!cropState.drag) return;
        const br = el.cropCanvas.getBoundingClientRect();
        const px = e.clientX - br.left;
        const py = e.clientY - br.top;
        const { w, h } = cropState.disp;
        const dnx = (px - cropState.drag.startPx) / Math.max(1, w);
        const dny = (py - cropState.drag.startPy) / Math.max(1, h);
        const o = cropState.drag.origRect;
        const minSize = 0.08;

        let nx = o.x, ny = o.y, nw = o.w, nh = o.h;

        if (cropState.drag.handle === 'move') {
          nx = Math.max(0, Math.min(1 - o.w, o.x + dnx));
          ny = Math.max(0, Math.min(1 - o.h, o.y + dny));
        } else {
          if (cropState.drag.handle.includes('l')) {
            const right = o.x + o.w;
            nx = Math.max(0, Math.min(right - minSize, o.x + dnx));
            nw = right - nx;
          } else {
            nw = Math.max(minSize, Math.min(1 - o.x, o.w + dnx));
          }
          if (cropState.drag.handle.includes('t')) {
            const bottom = o.y + o.h;
            ny = Math.max(0, Math.min(bottom - minSize, o.y + dny));
            nh = bottom - ny;
          } else {
            nh = Math.max(minSize, Math.min(1 - o.y, o.h + dny));
          }

          if (cropState.aspect !== 'free') {
            const imgAspect = w / Math.max(1, h);
            nh = (nw * imgAspect) / cropState.aspect;
            if (cropState.drag.handle.includes('t')) {
              ny = (o.y + o.h) - nh;
            }
            if (ny < 0) {
              nh += ny;
              ny = 0;
              nw = (nh * cropState.aspect) / imgAspect;
              if (cropState.drag.handle.includes('l')) nx = (o.x + o.w) - nw;
            } else if (ny + nh > 1) {
              nh = 1 - ny;
              nw = (nh * cropState.aspect) / imgAspect;
              if (cropState.drag.handle.includes('l')) nx = (o.x + o.w) - nw;
            }
          }
        }

        cropState.rect = { x: nx, y: ny, w: nw, h: nh };
        renderCropCanvas();
      });

      const endCropDrag = () => { cropState.drag = null; };
      el.cropCanvas.addEventListener('pointerup', endCropDrag);
      el.cropCanvas.addEventListener('pointercancel', endCropDrag);

      function buildCroppedCanvas(img, rotDeg, normRect) {
        // First render rotated full image onto temp canvas (capped at 2048px for mobile memory safety)
        const dims = getRotatedDims(img, rotDeg);
        const maxDim = 2048;
        const scale = Math.min(1, maxDim / Math.max(dims.w, dims.h));
        const rw = Math.round(dims.w * scale);
        const rh = Math.round(dims.h * scale);

        const rotCanvas = document.createElement('canvas');
        rotCanvas.width = rw;
        rotCanvas.height = rh;
        const rctx = rotCanvas.getContext('2d');
        rctx.translate(rw / 2, rh / 2);
        rctx.rotate((rotDeg * Math.PI) / 180);
        const swap = rotDeg === 90 || rotDeg === 270;
        const dw = swap ? rh : rw;
        const dh = swap ? rw : rh;
        rctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

        // Extract cropped sub-region
        const sx = Math.round(normRect.x * rw);
        const sy = Math.round(normRect.y * rh);
        const sw = Math.max(16, Math.round(normRect.w * rw));
        const sh = Math.max(16, Math.round(normRect.h * rh));

        const out = document.createElement('canvas');
        out.width = sw;
        out.height = sh;
        out.getContext('2d').drawImage(rotCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
        return out;
      }

      el.btnCropConfirm.addEventListener('click', () => {
        if (!cropState.current) return;
        const cropped = buildCroppedCanvas(cropState.current.img, cropState.rotDeg, cropState.rect);

        if (cropState.recropLayer) {
          const target = state.layers.find(l => l.id === cropState.recropLayer.id);
          if (target) {
            const aspect = cropped.width / Math.max(1, cropped.height);
            target.croppedCanvas = cropped;
            target.h = target.w / aspect;
            pushHistory();
            renderMainCanvas();
            showToast('已更新局部裁切範圍');
          }
          closeCropModal();
          return;
        }

        // Place new photo layer at center of current visible CAD viewport
        const stageRect = el.canvasStage.getBoundingClientRect();
        const centerWorld = screenToWorld(stageRect.width / 2, stageRect.height / 2);
        const initW = Math.min(state.cad.width * 0.34, 460);
        const initH = initW / (cropped.width / Math.max(1, cropped.height));
        const offsetStep = (state.layers.length % 5) * 24;

        const newLayer = {
          id: genId('layer'),
          origImg: cropState.current.img,
          croppedCanvas: cropped,
          x: Math.max(initW / 2, Math.min(state.cad.width - initW / 2, centerWorld.x + offsetStep)),
          y: Math.max(initH / 2, Math.min(state.cad.height - initH / 2, centerWorld.y + offsetStep)),
          w: initW,
          h: initH,
          rotation: 0,
          exifDate: cropState.current.exifDate,
          hasGps: cropState.current.hasGps
        };

        state.layers.push(newLayer);
        state.selectedLayerId = newLayer.id;
        state.mode = 'layer';
        [el.tabView, el.tabLayer, el.tabDraw].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === 'layer');
        });
        el.drawSubbar.classList.add('hidden');
        updateExifStatusUI();
        updateContextBars();
        pushHistory();
        renderMainCanvas();

        if (cropState.queue.length > 0) {
          openNextInCropQueue();
        } else {
          closeCropModal();
          requestAnimationFrame(resizeMainCanvas);
        }
      });

      const handleCropCancel = () => {
        if (cropState.queue.length > 0 && !cropState.recropLayer) {
          openNextInCropQueue();
        } else {
          closeCropModal();
        }
      };
      el.btnCropSkip.addEventListener('click', handleCropCancel);
      el.btnCropCancelTop.addEventListener('click', closeCropModal);

      /* -------------------- O. Layer & Annotation Context Bar Actions -------------------- */
      el.btnLayerRecrop.addEventListener('click', () => {
        const layer = state.layers.find(l => l.id === state.selectedLayerId);
        if (!layer) return;
        cropState.recropLayer = layer;
        cropState.queue = [{ img: layer.origImg, exifDate: layer.exifDate, hasGps: layer.hasGps }];
        openNextInCropQueue();
      });

      el.btnLayerUp.addEventListener('click', () => {
        const idx = state.layers.findIndex(l => l.id === state.selectedLayerId);
        if (idx >= 0 && idx < state.layers.length - 1) {
          const [item] = state.layers.splice(idx, 1);
          state.layers.splice(idx + 1, 0, item);
          pushHistory();
          renderMainCanvas();
        }
      });

      el.btnLayerDown.addEventListener('click', () => {
        const idx = state.layers.findIndex(l => l.id === state.selectedLayerId);
        if (idx > 0) {
          const [item] = state.layers.splice(idx, 1);
          state.layers.splice(idx - 1, 0, item);
          pushHistory();
          renderMainCanvas();
        }
      });

      el.btnLayerDelete.addEventListener('click', () => {
        const idx = state.layers.findIndex(l => l.id === state.selectedLayerId);
        if (idx >= 0) {
          state.layers.splice(idx, 1);
          state.selectedLayerId = null;
          updateContextBars();
          updateExifStatusUI();
          pushHistory();
          renderMainCanvas();
        }
      });

      el.btnAnnEditText.addEventListener('click', () => {
        const ann = state.annotations.find(a => a.id === state.selectedAnnId);
        if (ann && ann.type === 'text') {
          openTextModal({ editAnn: ann });
        }
      });

      el.btnAnnDuplicate.addEventListener('click', () => {
        const ann = state.annotations.find(a => a.id === state.selectedAnnId);
        if (!ann) return;
        const copy = cloneAnnotation(ann);
        copy.id = genId('ann');
        const shift = 24 / state.viewport.scale;
        if (copy.type === 'arrow' || copy.type === 'line') {
          copy.x1 += shift; copy.y1 += shift; copy.x2 += shift; copy.y2 += shift;
        } else if (copy.type === 'rect' || copy.type === 'circle') {
          copy.cx += shift; copy.cy += shift;
        } else if (copy.type === 'text') {
          copy.x += shift; copy.y += shift;
        } else if (copy.type === 'freehand') {
          copy.points = copy.points.map(p => ({ x: p.x + shift, y: p.y + shift }));
        }
        state.annotations.push(copy);
        state.selectedAnnId = copy.id;
        pushHistory();
        renderMainCanvas();
      });

      el.btnAnnDelete.addEventListener('click', () => {
        const idx = state.annotations.findIndex(a => a.id === state.selectedAnnId);
        if (idx >= 0) {
          state.annotations.splice(idx, 1);
          state.selectedAnnId = null;
          updateContextBars();
          pushHistory();
          renderMainCanvas();
        }
      });

      /* -------------------- P. Customizable Quick-Phrase Text Modal -------------------- */
      const LS_PHRASES_KEY = 'cad_canvas_quick_phrases_v1';
      const LS_PHRASE_VIEW_KEY = 'cad_canvas_phrase_view_v1';

      const DEFAULT_PHRASES = [
        { id: 'p1', text: 'B1', cat: '樓層' },
        { id: 'p2', text: '1F', cat: '樓層' },
        { id: 'p3', text: '5F', cat: '樓層' },
        { id: 'p4', text: '6F', cat: '樓層' },
        { id: 'p5', text: 'RF', cat: '樓層' },
        { id: 'p6', text: 'LED', cat: '設備' },
        { id: 'p7', text: '軟條燈', cat: '設備' },
        { id: 'p8', text: '軌道燈', cat: '設備' },
        { id: 'p9', text: '配電箱', cat: '設備' },
        { id: 'p10', text: '風管', cat: '設備' },
        { id: 'p11', text: 'Q1', cat: '編號/狀態' },
        { id: 'p12', text: 'Q2', cat: '編號/狀態' },
        { id: 'p13', text: '待改善', cat: '編號/狀態' },
        { id: 'p14', text: '已確認', cat: '編號/狀態' },
        { id: 'p15', text: '缺料', cat: '編號/狀態' }
      ];

      const phraseState = {
        items: loadPhrases(),
        viewMode: loadPhraseViewMode(), // 'grouped' | 'flat'
        manageMode: false,
        editingId: null,
        resetConfirmPending: false,
        pendingTarget: null // { wx, wy } or { editAnn }
      };

      function loadPhrases() {
        try {
          const raw = localStorage.getItem(LS_PHRASES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return DEFAULT_PHRASES.map(p => ({ ...p }));
      }

      function savePhrases() {
        try {
          localStorage.setItem(LS_PHRASES_KEY, JSON.stringify(phraseState.items));
        } catch (e) {}
      }

      function loadPhraseViewMode() {
        try {
          const v = localStorage.getItem(LS_PHRASE_VIEW_KEY);
          if (v === 'flat' || v === 'grouped') return v;
        } catch (e) {}
        return 'grouped';
      }

      function savePhraseViewMode() {
        try {
          localStorage.setItem(LS_PHRASE_VIEW_KEY, phraseState.viewMode);
        } catch (e) {}
      }

      function syncCategorySelect(selectedCat) {
        const baseCats = ['樓層', '設備', '編號/狀態', '自訂'];
        const existingCats = Array.from(new Set([...baseCats, ...phraseState.items.map(i => i.cat || '自訂')]));
        el.phraseCatSelect.innerHTML = '';
        existingCats.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          el.phraseCatSelect.appendChild(opt);
        });
        const newOpt = document.createElement('option');
        newOpt.value = '__new__';
        newOpt.textContent = '＋新分類...';
        el.phraseCatSelect.appendChild(newOpt);
        if (selectedCat && existingCats.includes(selectedCat)) {
          el.phraseCatSelect.value = selectedCat;
        }
        el.phraseNewCatInput.classList.add('hidden');
        el.phraseNewCatInput.value = '';
      }

      function insertPhraseAtCursor(phraseText) {
        const input = el.textNoteInput;
        const start = input.selectionStart != null ? input.selectionStart : input.value.length;
        const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
        // Direct concatenation with NO spaces
        input.value = input.value.slice(0, start) + phraseText + input.value.slice(end);
        const nextPos = start + phraseText.length;
        input.focus();
        try {
          input.setSelectionRange(nextPos, nextPos);
        } catch (e) {}
      }

      function renderPhraseList() {
        el.btnPhraseViewToggle.textContent = phraseState.viewMode === 'grouped' ? '切換：全部清單' : '切換：分類檢視';
        el.btnPhraseManageToggle.classList.toggle('active', phraseState.manageMode);
        el.phraseManageBar.classList.toggle('hidden', !phraseState.manageMode);

        el.phraseListWrap.innerHTML = '';

        if (!phraseState.items.length) {
          const empty = document.createElement('div');
          empty.className = 'dialog-subtitle';
          empty.textContent = '目前沒有常用詞，請點「＋新增」建立。';
          el.phraseListWrap.appendChild(empty);
          return;
        }

        const buildChip = (item) => {
          if (!phraseState.manageMode) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'phrase-chip';
            btn.textContent = item.text;
            btn.addEventListener('click', () => insertPhraseAtCursor(item.text));
            return btn;
          }
          const wrap = document.createElement('div');
          wrap.className = 'chip-manage-item';
          const span = document.createElement('span');
          span.textContent = item.text;
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'chip-icon-btn';
          editBtn.title = '編輯詞彙';
          editBtn.textContent = '✎';
          editBtn.addEventListener('click', () => {
            phraseState.editingId = item.id;
            el.phraseTextInput.value = item.text;
            syncCategorySelect(item.cat || '自訂');
            el.phraseForm.classList.remove('hidden');
            el.phraseTextInput.focus();
          });
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'chip-icon-btn del';
          delBtn.title = '刪除詞彙';
          delBtn.textContent = '×';
          delBtn.addEventListener('click', () => {
            phraseState.items = phraseState.items.filter(p => p.id !== item.id);
            savePhrases();
            renderPhraseList();
          });
          wrap.append(span, editBtn, delBtn);
          return wrap;
        };

        if (phraseState.viewMode === 'flat') {
          const row = document.createElement('div');
          row.className = 'phrase-chips';
          phraseState.items.forEach(item => row.appendChild(buildChip(item)));
          el.phraseListWrap.appendChild(row);
        } else {
          const groups = new Map();
          phraseState.items.forEach(item => {
            const cat = item.cat || '自訂';
            if (!groups.has(cat)) groups.set(cat, []);
            groups.get(cat).push(item);
          });
          groups.forEach((items, cat) => {
            const gDiv = document.createElement('div');
            gDiv.className = 'phrase-cat-group';
            const lbl = document.createElement('div');
            lbl.className = 'phrase-cat-label';
            lbl.textContent = cat;
            const chips = document.createElement('div');
            chips.className = 'phrase-chips';
            items.forEach(item => chips.appendChild(buildChip(item)));
            gDiv.append(lbl, chips);
            el.phraseListWrap.appendChild(gDiv);
          });
        }
      }

      function openTextModal(target) {
        phraseState.pendingTarget = target;
        phraseState.manageMode = false;
        phraseState.editingId = null;
        phraseState.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        el.phraseForm.classList.add('hidden');

        if (target.editAnn) {
          el.textModalTitle.textContent = '編輯文字註解';
          el.btnTextConfirm.textContent = '更新文字';
          el.textNoteInput.value = target.editAnn.text || '';
        } else {
          el.textModalTitle.textContent = '新增文字註解';
          el.btnTextConfirm.textContent = '確認放置';
          el.textNoteInput.value = '';
        }

        renderPhraseList();
        el.textModal.classList.remove('hidden');
        setTimeout(() => el.textNoteInput.focus(), 60);
      }

      function closeTextModal() {
        el.textModal.classList.add('hidden');
        phraseState.pendingTarget = null;
      }

      el.btnTextClear.addEventListener('click', () => {
        el.textNoteInput.value = '';
        el.textNoteInput.focus();
      });

      el.btnPhraseViewToggle.addEventListener('click', () => {
        phraseState.viewMode = phraseState.viewMode === 'grouped' ? 'flat' : 'grouped';
        savePhraseViewMode();
        renderPhraseList();
      });

      el.btnPhraseAddToggle.addEventListener('click', () => {
        phraseState.editingId = null;
        el.phraseTextInput.value = '';
        syncCategorySelect('自訂');
        el.phraseForm.classList.toggle('hidden');
        if (!el.phraseForm.classList.contains('hidden')) {
          el.phraseTextInput.focus();
        }
      });

      el.btnPhraseManageToggle.addEventListener('click', () => {
        phraseState.manageMode = !phraseState.manageMode;
        phraseState.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        if (!phraseState.manageMode) {
          el.phraseForm.classList.add('hidden');
          phraseState.editingId = null;
        }
        renderPhraseList();
      });

      el.phraseCatSelect.addEventListener('change', () => {
        const isNew = el.phraseCatSelect.value === '__new__';
        el.phraseNewCatInput.classList.toggle('hidden', !isNew);
        if (isNew) el.phraseNewCatInput.focus();
      });

      el.btnPhraseFormCancel.addEventListener('click', () => {
        el.phraseForm.classList.add('hidden');
        phraseState.editingId = null;
      });

      el.btnPhraseSave.addEventListener('click', () => {
        const txt = el.phraseTextInput.value.trim();
        if (!txt) {
          showToast('請輸入詞彙內容');
          return;
        }
        let cat = el.phraseCatSelect.value;
        if (cat === '__new__') {
          cat = el.phraseNewCatInput.value.trim() || '自訂';
        }

        if (phraseState.editingId) {
          const item = phraseState.items.find(p => p.id === phraseState.editingId);
          if (item) {
            item.text = txt;
            item.cat = cat;
          }
        } else {
          phraseState.items.push({ id: `p_${Date.now()}`, text: txt, cat });
        }
        savePhrases();
        el.phraseForm.classList.add('hidden');
        phraseState.editingId = null;
        renderPhraseList();
      });

      el.btnPhraseReset.addEventListener('click', () => {
        if (!phraseState.resetConfirmPending) {
          phraseState.resetConfirmPending = true;
          el.btnPhraseReset.textContent = '再點一次確認恢復';
          return;
        }
        phraseState.items = DEFAULT_PHRASES.map(p => ({ ...p }));
        phraseState.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        savePhrases();
        renderPhraseList();
        showToast('已恢復預設常用詞清單');
      });

      el.btnTextConfirm.addEventListener('click', () => {
        const text = el.textNoteInput.value.trim();
        if (!text) {
          showToast('請輸入或點選文字內容');
          return;
        }
        const target = phraseState.pendingTarget;
        if (target && target.editAnn) {
          target.editAnn.text = text;
          pushHistory();
          renderMainCanvas();
        } else if (target) {
          const newAnn = {
            id: genId('ann'),
            type: 'text',
            x: target.wx,
            y: target.wy,
            text,
            color: state.draw.color,
            fontSize: state.draw.sizes.text
          };
          state.annotations.push(newAnn);
          state.justCreatedAnnId = newAnn.id; // Allow immediate − / + font size adjustment
          pushHistory();
          renderMainCanvas();
        }
        closeTextModal();
      });

      el.textNoteInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el.btnTextConfirm.click();
        }
      });

      el.btnTextCancel.addEventListener('click', closeTextModal);
      el.btnTextCancelTop.addEventListener('click', closeTextModal);

      /* -------------------- Q. Simplified Export Screenshot Modal -------------------- */
      let lastExportBlob = null;
      let lastExportUrl = null;
      let lastExportFilename = 'cad-overlay.png';

      function generateExportCanvas() {
        const out = document.createElement('canvas');
        out.width = state.cad.width;
        out.height = state.cad.height;
        const ctx = out.getContext('2d');

        // 1. CAD Base
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, out.width, out.height);
        if (state.cad.source) {
          ctx.drawImage(state.cad.source, 0, 0, out.width, out.height);
        }

        // 2. Photo Layers
        for (const layer of state.layers) {
          ctx.save();
          ctx.translate(layer.x, layer.y);
          ctx.rotate(layer.rotation);
          ctx.drawImage(layer.croppedCanvas, -layer.w / 2, -layer.h / 2, layer.w, layer.h);
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
          ctx.lineWidth = 2;
          ctx.strokeRect(-layer.w / 2, -layer.h / 2, layer.w, layer.h);
          ctx.restore();
        }

        // 3. Vector Annotations
        for (const ann of state.annotations) {
          drawAnnotation(ctx, ann);
        }

        // 4. Subtle Bottom-Right Capture Date Watermark (NO GPS text)
        const dateText = state.exif.captureDate || todayFormatted();
        const fontSize = Math.max(16, Math.min(28, Math.round(Math.min(out.width, out.height) * 0.021)));
        ctx.save();
        ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif`;
        const tw = ctx.measureText(dateText).width;
        const padX = Math.round(fontSize * 0.65);
        const padY = Math.round(fontSize * 0.38);
        const boxW = tw + padX * 2;
        const boxH = fontSize + padY * 2;
        const margin = Math.max(14, Math.round(Math.min(out.width, out.height) * 0.018));
        const bx = out.width - boxW - margin;
        const by = out.height - boxH - margin;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
        drawRoundedRect(ctx, bx, by, boxW, boxH, Math.round(boxH * 0.25));
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dateText, bx + boxW / 2, by + boxH / 2 + 1);
        ctx.restore();

        return { canvas: out, dateText };
      }

      el.btnExport.addEventListener('click', () => {
        const { canvas, dateText } = generateExportCanvas();
        const safeDate = dateText.replace(/\//g, '-');
        lastExportFilename = `工地疊圖_${safeDate}.png`;
        el.exportMetaInfo.textContent = `右下角已壓印拍攝日期：${dateText}`;

        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('產生截圖失敗，請再試一次');
            return;
          }
          if (lastExportUrl) URL.revokeObjectURL(lastExportUrl);
          lastExportBlob = blob;
          lastExportUrl = URL.createObjectURL(blob);
          el.exportPreviewImg.src = lastExportUrl;
          el.exportModal.classList.remove('hidden');
        }, 'image/png');
      });

      el.btnExportShare.addEventListener('click', async () => {
        if (!lastExportBlob) return;
        const file = new File([lastExportBlob], lastExportFilename, { type: 'image/png' });

        // Prefer Web Share API with files (iOS Safari / Android Chrome -> Save to Photos)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '工地 CAD 疊圖截圖'
            });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        // Automatic fallback download for desktop or unsupported browsers
        const a = document.createElement('a');
        a.href = lastExportUrl;
        a.download = lastExportFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('此瀏覽器不支援直接分享，已自動下載 PNG');
      });

      el.btnExportClose.addEventListener('click', () => {
        el.exportModal.classList.add('hidden');
      });

      /* -------------------- R. Bind Top, Bottom & Layout Controls -------------------- */
      // Mode tabs
      [el.tabView, el.tabAddPhoto, el.tabLayer, el.tabDraw].forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });

      // Draw tools
      el.toolRow.addEventListener('click', (e) => {
        const btn = e.target.closest('.tool-btn');
        if (!btn) return;
        setDrawTool(btn.dataset.tool);
      });

      // Swatches
      el.swatchGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.swatch');
        if (!btn) return;
        setDrawColor(btn.dataset.color);
      });

      // Independent − / + buttons
      el.btnSizeMinus.addEventListener('click', () => adjustSize(-1));
      el.btnSizePlus.addEventListener('click', () => adjustSize(1));

      // Undo / Redo
      el.btnUndo.addEventListener('click', undo);
      el.btnRedo.addEventListener('click', redo);

      // Collapse / Expand Full-Screen Canvas UI
      function setUiCollapsed(collapsed) {
        document.body.classList.toggle('ui-collapsed', collapsed);
        requestAnimationFrame(() => {
          resizeMainCanvas();
        });
      }
      el.btnCollapseUi.addEventListener('click', () => setUiCollapsed(true));
      el.btnExpandUi.addEventListener('click', () => setUiCollapsed(false));

      // Zoom buttons
      el.btnZoomIn.addEventListener('click', () => zoomAt(1.2));
      el.btnZoomOut.addEventListener('click', () => zoomAt(0.83));
      el.btnZoomFit.addEventListener('click', fitCadToScreen);

      // Keyboard shortcuts for desktop convenience
      window.addEventListener('keydown', (e) => {
        if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        } else if (e.key === 'Escape' && document.body.classList.contains('ui-collapsed')) {
          setUiCollapsed(false);
        }
      });

      // Responsive canvas observer + device rotation handler
      const resizeObserver = new ResizeObserver(() => {
        resizeMainCanvas();
        if (!el.cropModal.classList.contains('hidden')) {
          layoutCropCanvas();
        }
      });
      resizeObserver.observe(el.canvasStage);

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          resizeMainCanvas();
          if (!el.cropModal.classList.contains('hidden')) {
            layoutCropCanvas();
          }
        }, 160);
      });

      /* -------------------- S. Startup Initialization -------------------- */
      function init() {
        state.cad.source = createDemoCadCanvas();
        state.cad.width = state.cad.source.width;
        state.cad.height = state.cad.source.height;
        pushHistory();
        resizeMainCanvas();
        fitCadToScreen();
        updateExifStatusUI();
      }

      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
