      el.btnViewCategory.addEventListener('click', () => {
        state.phraseView = 'category';
        savePhrases();
        renderPhrasePanel();
      });

      el.btnViewAll.addEventListener('click', () => {
        state.phraseView = 'all';
        savePhrases();
        renderPhrasePanel();
      });

      el.btnToggleAddPhrase.addEventListener('click', () => {
        state.editingPhraseId = null;
        const isHidden = el.phraseFormBox.classList.contains('hidden');
        if (isHidden) {
          el.phraseTextInput.value = '';
          populateCategorySelect('自訂');
          el.phraseFormBox.classList.remove('hidden');
          el.phraseTextInput.focus();
        } else {
          el.phraseFormBox.classList.add('hidden');
        }
      });

      el.btnToggleManagePhrase.addEventListener('click', () => {
        state.phraseManageMode = !state.phraseManageMode;
        state.editingPhraseId = null;
        state.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        if (!state.phraseManageMode) {
          el.phraseFormBox.classList.add('hidden');
        }
        renderPhrasePanel();
      });

      el.phraseCatSelect.addEventListener('change', () => {
        const isNew = el.phraseCatSelect.value === '__NEW__';
        el.phraseCustomCatInput.classList.toggle('hidden', !isNew);
        if (isNew) el.phraseCustomCatInput.focus();
      });

      el.btnPhraseFormCancel.addEventListener('click', () => {
        state.editingPhraseId = null;
        el.phraseFormBox.classList.add('hidden');
        renderPhrasePanel();
      });

      el.btnPhraseFormSave.addEventListener('click', () => {
        const text = el.phraseTextInput.value.trim();
        if (!text) return;
        let category = el.phraseCatSelect.value;
        if (category === '__NEW__') {
          category = el.phraseCustomCatInput.value.trim() || '自訂';
        }
        if (state.editingPhraseId) {
          const item = state.phrases.find(p => p.id === state.editingPhraseId);
          if (item) {
            item.text = text;
            item.category = category;
          }
          state.editingPhraseId = null;
        } else {
          state.phrases.push({ id: genId('phr'), text, category });
        }
        savePhrases();
        el.phraseFormBox.classList.add('hidden');
        renderPhrasePanel();
      });

      el.btnPhraseReset.addEventListener('click', () => {
        if (!state.resetConfirmPending) {
          state.resetConfirmPending = true;
          el.btnPhraseReset.textContent = '再次點擊確認恢復';
          setTimeout(() => {
            if (state.resetConfirmPending) {
              state.resetConfirmPending = false;
              el.btnPhraseReset.textContent = '恢復預設';
            }
          }, 3000);
          return;
        }
        state.phrases = DEFAULT_PHRASES.map(p => ({ ...p }));
        state.resetConfirmPending = false;
        el.btnPhraseReset.textContent = '恢復預設';
        savePhrases();
        renderPhrasePanel();
      });

      el.btnTextCancelTop.addEventListener('click', closeTextModal);
      el.btnTextCancel.addEventListener('click', closeTextModal);

      el.btnTextConfirm.addEventListener('click', () => {
        const val = el.textAnnInput.value.replace(/^\s+|\s+$/g, '');
        if (!val || !textDialogContext) {
          closeTextModal();
          return;
        }
        if (textDialogContext.mode === 'edit') {
          textDialogContext.ann.text = val;
        } else {
          const ann = {
            id: genId('ann'),
            type: 'text',
            x: textDialogContext.worldX,
            y: textDialogContext.worldY,
            text: val,
            color: state.draw.color,
            size: state.draw.sizes.text || 40
          };
          state.annotations.push(ann);
          state.lastCreatedAnnId = ann.id;
        }
        pushHistory();
        closeTextModal();
        renderMainCanvas();
      });

      /* ==================== O. Full-Resolution Export with Watermark ==================== */
      function isDesktopDevice() {
        const ua = navigator.userAgent || '';
        const isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        const isMobileOrTablet = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || isTouchMac;
        return !isMobileOrTablet;
      }

      function buildExportCanvas() {
        const out = document.createElement('canvas');
        out.width = state.cad.width;
        out.height = state.cad.height;
        const g = out.getContext('2d');

        // 1. CAD Base
        if (state.cad.source) {
          g.drawImage(state.cad.source, 0, 0, out.width, out.height);
        }

        // 2. Photo Layers
        for (const layer of state.layers) {
          g.save();
          g.translate(layer.x, layer.y);
          g.rotate(layer.rotation || 0);
          g.drawImage(layer.croppedCanvas, -layer.w / 2, -layer.h / 2, layer.w, layer.h);
          g.restore();
        }

        // 3. Vector Annotations
        for (const ann of state.annotations) {
          drawAnnotation(g, ann);
        }

        // 4. Shooting Date Watermark (Bottom-Right)
        const dateLabel = `拍攝日期：${state.exif.shootDate || formatToday()}`;
        const fontSize = Math.max(18, Math.round(out.width * 0.018));
        g.save();
        g.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
        const tw = g.measureText(dateLabel).width;
        const padX = Math.round(fontSize * 0.7);
        const padY = Math.round(fontSize * 0.45);
        const margin = Math.round(fontSize * 0.8);
        const bx = out.width - tw - padX * 2 - margin;
        const by = out.height - fontSize - padY * 2 - margin;

        g.fillStyle = 'rgba(15, 23, 42, 0.78)';
        g.fillRect(bx, by, tw + padX * 2, fontSize + padY * 2);
        g.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        g.lineWidth = Math.max(1, Math.round(fontSize * 0.08));
        g.strokeRect(bx, by, tw + padX * 2, fontSize + padY * 2);

        g.fillStyle = '#f8fafc';
        g.textBaseline = 'middle';
        g.textAlign = 'left';
        g.fillText(dateLabel, bx + padX, by + (fontSize + padY * 2) / 2);
        g.restore();

        return out;
      }

      function buildExportFilename() {
        const d = new Date();
        const datePart = (state.exif.shootDate || formatToday()).replace(/\//g, '');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `CAD紀錄_${datePart}_${hh}${mm}${ss}.png`;
      }

      function canvasToBlobAsync(canvas, mimeType, quality) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), mimeType, quality);
        });
      }

      function triggerDirectDownload(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      }

      el.btnExport.addEventListener('click', async () => {
        const out = buildExportCanvas();
        const suggestedName = buildExportFilename();

        // Desktop: skip preview modal and open native Save As dialog directly
        if (isDesktopDevice()) {
          if (typeof window.showSaveFilePicker === 'function') {
            try {
              const fileHandle = await window.showSaveFilePicker({
                suggestedName,
                types: [
                  {
                    description: 'PNG 圖片',
                    accept: { 'image/png': ['.png'] }
                  },
                  {
                    description: 'JPEG 圖片',
                    accept: { 'image/jpeg': ['.jpg', '.jpeg'] }
                  }
                ]
              });
              const chosenName = (fileHandle.name || suggestedName).toLowerCase();
              const isJpeg = chosenName.endsWith('.jpg') || chosenName.endsWith('.jpeg');
              const mimeType = isJpeg ? 'image/jpeg' : 'image/png';
              const blob = await canvasToBlobAsync(out, mimeType, isJpeg ? 0.92 : undefined);
              if (!blob) return;
              const writable = await fileHandle.createWritable();
              await writable.write(blob);
              await writable.close();
              showToast('已儲存截圖至本機', 1400);
              return;
            } catch (err) {
              if (err && err.name === 'AbortError') {
                return;
              }
              // Fall back to standard download if Save File Picker is unavailable in current context
            }
          }

          const blob = await canvasToBlobAsync(out, 'image/png');
          if (!blob) return;
          triggerDirectDownload(blob, suggestedName);
          showToast('已開始下載截圖', 1400);
          return;
        }

        // Mobile / Tablet: keep existing Export Preview Modal & Web Share flow unchanged
        const blob = await canvasToBlobAsync(out, 'image/png');
        if (!blob) return;
        state.exportBlob = blob;
        state.exportFilename = suggestedName;
        if (el.exportPreviewImg.dataset.objUrl) {
          URL.revokeObjectURL(el.exportPreviewImg.dataset.objUrl);
        }
        const url = URL.createObjectURL(blob);
        el.exportPreviewImg.src = url;
        el.exportPreviewImg.dataset.objUrl = url;
        el.exportModal.classList.remove('hidden');
      });

      function closeExportModal() {
        el.exportModal.classList.add('hidden');
      }

      el.btnExportCloseTop.addEventListener('click', closeExportModal);
      el.btnExportClose.addEventListener('click', closeExportModal);

      el.btnExportShare.addEventListener('click', async () => {
        if (!state.exportBlob) return;
        const file = new File([state.exportBlob], state.exportFilename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '工地 CAD 疊圖紀錄'
            });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        // Fallback: direct PNG download
        triggerDirectDownload(state.exportBlob, state.exportFilename);
        showToast('已下載圖片檔案', 1400);
      });

      /* ==================== P. Top Bar & Collapse UI Controls ==================== */
      el.btnUndo.addEventListener('click', undo);
      el.btnRedo.addEventListener('click', redo);
      el.btnZoomIn.addEventListener('click', () => zoomAtCenter(1.25));
      el.btnZoomOut.addEventListener('click', () => zoomAtCenter(1 / 1.25));
      el.btnZoomFit.addEventListener('click', fitCadToScreen);

      function setUiCollapsed(collapsed) {
        document.body.classList.toggle('ui-collapsed', collapsed);
        requestAnimationFrame(() => resizeMainCanvas());
      }

      el.btnCollapseUi.addEventListener('click', () => setUiCollapsed(true));
      el.btnExpandUi.addEventListener('click', () => setUiCollapsed(false));

      /* ==================== Q. Mobile Anti-Zoom Protection ==================== */
      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const target = e.target;
        if (
          target.closest('canvas') ||
          target.closest('button') ||
          target.closest('input') ||
          target.closest('select') ||
          target.closest('textarea')
        ) {
          return;
        }
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      /* ==================== R. JS-Driven Landscape Orientation Sync (Chrome Fix) ==================== */
      let orientationTimers = [];

      function syncOrientationLayout() {
        const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
        const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        const isLandscape = vw > vh;
        const prevLandscape = document.body.classList.contains('is-landscape');

        if (isLandscape !== prevLandscape) {
          document.body.classList.toggle('is-landscape', isLandscape);

          // Force DOM reflow to fix mobile Chrome display:contents / Grid layout stall on rotation
          if (el.bottomBar) {
            el.bottomBar.style.display = 'none';
            void el.workspace.offsetHeight;
            el.bottomBar.style.display = '';
          }
          void el.workspace.offsetHeight;
        }

        requestAnimationFrame(() => {
          resizeMainCanvas();
          if (!el.cropModal.classList.contains('hidden')) {
            layoutCropCanvas();
          }
        });
      }

      function scheduleOrientationSync() {
        orientationTimers.forEach(t => clearTimeout(t));
        orientationTimers = [];
        syncOrientationLayout();
        orientationTimers.push(setTimeout(syncOrientationLayout, 150));
        orientationTimers.push(setTimeout(syncOrientationLayout, 350));
      }

      const resizeObserver = new ResizeObserver(() => {
        resizeMainCanvas();
        if (!el.cropModal.classList.contains('hidden')) {
          layoutCropCanvas();
        }
      });
      resizeObserver.observe(el.canvasStage);

      window.addEventListener('resize', scheduleOrientationSync);
      window.addEventListener('orientationchange', scheduleOrientationSync);
      if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
        window.screen.orientation.addEventListener('change', scheduleOrientationSync);
      }
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener('resize', scheduleOrientationSync);
      }

      /* ==================== S. Startup Initialization ==================== */
      let initialized = false;
      function init() {
        if (initialized) {
          scheduleOrientationSync();
          return;
        }
        initialized = true;
        loadPhrases();
        pushHistory();
        syncOrientationLayout();
        fitCadToScreen();
        updateExifStatusUI();
      }

      document.addEventListener('DOMContentLoaded', () => {
        syncOrientationLayout();
      });
      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
