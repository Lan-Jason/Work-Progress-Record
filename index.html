<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>工地 CAD 疊圖與局部裁切標註畫布 v2.1</title>
  <style>
    /* ==================== 1. Design Tokens & Base Reset ==================== */
    :root {
      --bg-dark: #0b1120;
      --bg-panel: #111827;
      --bg-panel-2: #162033;
      --bg-stage: #060b16;
      --border: #243249;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0284c7;
      --danger: #ef4444;
      --warn-bg: rgba(250, 204, 21, 0.16);
      --warn-border: rgba(250, 204, 21, 0.55);
      --warn-text: #fde047;
      --success: #22c55e;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button, input, select, textarea {
      font-family: inherit;
      touch-action: manipulation;
    }

    button {
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    canvas {
      touch-action: none;
    }

    .hidden {
      display: none !important;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==================== 2. App Shell Layout (Portrait Default) ==================== */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* Top Bar */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(7px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 7px calc(10px + env(safe-area-inset-left));
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    .btn-export {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.28);
    }

    .btn-secondary {
      background: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
      font-weight: 500;
      padding: 7px 9px;
      border-radius: 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #283548;
      border-color: #475569;
    }

    .btn-icon-only {
      min-width: 34px;
      min-height: 34px;
      padding: 6px;
    }

    .status-strip {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid #1e293b;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
    }

    .cad-name {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e2e8f0;
      font-weight: 500;
    }

    .status-date {
      white-space: nowrap;
      color: #cbd5e1;
    }

    .gps-warn-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==================== 3. Center Workspace & Canvas Stage ==================== */
    .workspace {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .canvas-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg-stage);
    }

    #mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lbl-short {
      display: none;
    }

    /* Floating HUDs inside Canvas Stage */
    .mode-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 15;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e2e8f0;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      max-width: calc(100% - 110px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .zoom-btn {
      width: 38px;
      height: 34px;
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.86);
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .zoom-fit-btn {
      width: 38px;
      height: 30px;
      font-size: 10px;
      font-weight: 600;
      padding: 0 2px;
    }

    .zoom-percent {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #1e293b;
      padding: 2px 6px;
      border-radius: 6px;
      min-width: 38px;
      text-align: center;
    }

    /* Floating Context Bars */
    .context-bar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #334155;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      max-width: calc(100% - 20px);
    }

    #annContextBar {
      top: 46px;
    }

    #layerContextBar {
      bottom: 12px;
    }

    .ctx-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .ctx-btn:hover {
      background: #2c3c54;
    }

    .ctx-btn.danger {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    /* Floating Toast (1s Size / Rotation Angle / Status Feedback) */
    .floating-toast {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.65);
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .floating-toast.show {
      opacity: 1;
    }

    /* Floating Expand Button when UI is Collapsed */
    .expand-ui-btn {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      z-index: 45;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.65);
      color: #f8fafc;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    body:not(.ui-collapsed) .expand-ui-btn {
      display: none !important;
    }

    /* ==================== 4. Bottom Bar (Portrait Mode) ==================== */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      z-index: 25;
    }

    .draw-subbar {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 7px 10px;
      background: var(--bg-panel-2);
      border-bottom: 1px solid var(--border);
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .tool-row::-webkit-scrollbar { display: none; }

    .tool-btn {
      flex: 1 0 auto;
      min-width: 56px;
      padding: 7px 8px;
      border-radius: 9px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .tool-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #ffffff;
    }

    .style-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .swatch-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 0;
      flex-shrink: 0;
    }

    .swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.08);
    }

    .size-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .step-btn {
      width: 38px;
      height: 32px;
      border-radius: 9px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 700;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 7px calc(8px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
      background: var(--bg-panel);
    }

    .mode-tab {
      flex-direction: column;
      gap: 3px;
      padding: 8px 4px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .mode-tab.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.55);
      color: #38bdf8;
    }

    /* Small Portrait Tweaks */
    @media (max-width: 640px) {
      .top-bar {
        padding: calc(6px + env(safe-area-inset-top)) 8px 6px 8px;
        gap: 5px;
      }
      .btn-primary, .btn-export {
        padding: 6px 9px;
        font-size: 12px;
      }
      .hide-xs {
        display: none;
      }
      .cad-name, .status-sep {
        display: none;
      }
      .mode-tab {
        font-size: 11px;
        padding: 7px 2px;
      }
    }

    /* ==================== 5. JS-Driven Landscape 3-Column Layout ==================== */
    body.is-landscape .hide-land {
      display: none !important;
    }
    body.is-landscape .lbl-full {
      display: none;
    }
    body.is-landscape .lbl-short {
      display: inline;
    }

    /* Compact Top Bar (~38px) — Version Badge Remains Visible */
    body.is-landscape .top-bar {
      height: 38px;
      padding: 3px calc(8px + env(safe-area-inset-right)) 3px calc(8px + env(safe-area-inset-left));
      gap: 6px;
    }
    body.is-landscape .top-group {
      gap: 5px;
    }
    body.is-landscape .version-badge {
      padding: 2px 6px;
      font-size: 10px;
    }
    body.is-landscape .top-bar .btn-primary,
    body.is-landscape .top-bar .btn-export,
    body.is-landscape .top-bar .btn-secondary {
      padding: 4px 8px;
      font-size: 12px;
      min-height: 30px;
      border-radius: 8px;
    }
    body.is-landscape .top-bar .btn-icon-only {
      min-width: 32px;
      min-height: 30px;
      padding: 4px;
    }
    body.is-landscape .top-bar .icon {
      width: 16px;
      height: 16px;
    }
    body.is-landscape .status-strip {
      background: transparent;
      border: none;
      padding: 0;
      justify-content: flex-start;
    }
    body.is-landscape .cad-name,
    body.is-landscape .status-sep,
    body.is-landscape .status-date {
      display: none;
    }
    body.is-landscape .gps-warn-pill {
      padding: 2px 7px;
      font-size: 11px;
    }

    /* 3-Column Workspace Grid */
    body.is-landscape .workspace {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr);
    }
    body.is-landscape .canvas-stage {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
    }
    body.is-landscape .bottom-bar {
      display: contents;
    }

    /* Left Sidebar: 4 Main Mode Tabs */
    body.is-landscape .mode-tabs {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 5px;
      width: calc(58px + env(safe-area-inset-left));
      padding: 6px 5px 6px calc(5px + env(safe-area-inset-left));
      background: var(--bg-dark);
      border-right: 1px solid var(--border);
      border-top: none;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body.is-landscape .mode-tabs::-webkit-scrollbar { display: none; }
    body.is-landscape .mode-tab {
      flex: 1;
      min-height: 48px;
      padding: 5px 2px;
      font-size: 10px;
      gap: 3px;
      border-radius: 8px;
    }
    body.is-landscape .mode-tab .icon {
      width: 17px;
      height: 17px;
    }

    /* Right Sidebar (Draw Mode) */
    body.is-landscape .draw-subbar {
      grid-column: 3;
      grid-row: 1;
      width: calc(64px + env(safe-area-inset-right));
      padding: 6px calc(5px + env(safe-area-inset-right)) 6px 5px;
      border-left: 1px solid var(--border);
      border-bottom: none;
      overflow-y: auto;
      overflow-x: hidden;
      gap: 6px;
      justify-content: flex-start;
    }
    body.is-landscape .draw-subbar::-webkit-scrollbar { display: none; }
    body.is-landscape .tool-row {
      flex-direction: column;
      overflow: visible;
      padding-bottom: 0;
      gap: 4px;
    }
    body.is-landscape .tool-btn {
      flex: none;
      width: 100%;
      min-width: 0;
      padding: 6px 2px;
      font-size: 11px;
      border-radius: 7px;
    }
    body.is-landscape .style-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
    }
    body.is-landscape .swatch-group {
      display: grid;
      grid-template-columns: repeat(2, 22px);
      justify-content: center;
      gap: 5px;
    }
    body.is-landscape .swatch {
      width: 22px;
      height: 22px;
    }
    body.is-landscape .size-stepper {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
    }
    body.is-landscape .step-btn {
      width: 100%;
      height: 30px;
      font-size: 16px;
      border-radius: 7px;
    }

    /* Right Sidebar (Layer Mode when layer selected) */
    body.is-landscape #layerContextBar {
      grid-column: 3;
      grid-row: 1;
      position: static;
      transform: none;
      max-width: none;
      width: calc(62px + env(safe-area-inset-right));
      padding: 8px calc(5px + env(safe-area-inset-right)) 8px 5px;
      border-radius: 0;
      border: none;
      border-left: 1px solid var(--border);
      background: var(--bg-panel-2);
      box-shadow: none;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 6px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body.is-landscape #layerContextBar .ctx-btn {
      width: 100%;
      padding: 9px 4px;
      font-size: 11px;
      border-radius: 8px;
    }

    /* Sleeker Floating HUDs in Landscape */
    body.is-landscape .mode-badge {
      top: 6px;
      left: 6px;
      padding: 4px 10px;
      font-size: 11px;
    }
    body.is-landscape #annContextBar {
      top: 34px;
      padding: 4px 6px;
    }
    body.is-landscape .zoom-controls {
      top: 6px;
      right: 6px;
      gap: 4px;
    }
    body.is-landscape .zoom-btn {
      width: 34px;
      height: 30px;
      font-size: 16px;
      border-radius: 8px;
    }
    body.is-landscape .zoom-fit-btn {
      height: 28px;
      font-size: 10px;
    }
    body.is-landscape .zoom-percent {
      font-size: 10px;
      padding: 2px 4px;
    }

    /* ==================== 6. Full-Screen Collapsed UI Mode ==================== */
    body.ui-collapsed .top-bar,
    body.ui-collapsed .bottom-bar,
    body.ui-collapsed .mode-tabs,
    body.ui-collapsed .draw-subbar,
    body.ui-collapsed .context-bar,
    body.ui-collapsed .zoom-controls,
    body.ui-collapsed .mode-badge {
      display: none !important;
    }

    body.ui-collapsed .workspace {
      display: flex !important;
      width: 100vw;
      height: 100dvh;
    }

    body.ui-collapsed .canvas-stage {
      width: 100%;
      height: 100%;
    }

    /* ==================== 7. Modals & Dialogs ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      max-height: 92dvh;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-card.wide {
      max-width: 820px;
      height: 88dvh;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel-2);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }

    .modal-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 11px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel-2);
    }

    /* Crop Modal Stage */
    .crop-stage {
      flex: 1;
      min-height: 220px;
      position: relative;
      background: #020617;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #cropCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .crop-meta {

      gap: 6px;

      color: #ffffff;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.45;
      resize: vertical;
      min-height: 76px;
      max-height: 180px;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--accent);
    }

    .phrase-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .phrase-toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-toggle {
      padding: 5px 10px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }

    .pill-toggle.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #7dd3fc;
    }

    .phrase-add-box {
      background: #0f172a;
      border: 1px solid #2c3e59;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .phrase-add-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .phrase-add-row input,
    .phrase-add-row select {
      flex: 1;
      min-width: 110px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 7px 9px;
      font-size: 13px;
      outline: none;
    }

    .phrase-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .phrase-cat-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .phrase-cat-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .phrase-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 500;
    }

    .phrase-chip:hover {
      border-color: var(--accent);
      background: #24344c;
    }

    .phrase-chip.editing {
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.12);
    }

    .chip-del {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
    }

    /* Export Preview */
    .export-preview-wrap {
      flex: 1;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px;
      overflow: hidden;
    }

    #exportPreviewImg {
      max-width: 100%;
      max-height: 58dvh;
      border-radius: 6px;
      object-fit: contain;
    }

</head>
<body>
  <div class="app-shell">
    <!-- ==================== Top Bar ==================== -->
    <header class="top-bar">
      <div class="top-group">
        <button id="btnImportCad" class="btn-primary" title="匯入 CAD 平面圖影像">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>匯入 CAD</span>
        </button>
        <span class="version-badge" title="程式版本">v2.1</span>
        <input id="cadFileInput" type="file" accept="image/*" class="hidden" />
        <input id="photoFileInput" type="file" accept="image/*" multiple class="hidden" />
      </div>

      <div class="status-strip">
        <span id="cadFileName" class="cad-name">尚未匯入底圖</span>
        <span class="status-sep">|</span>
        <span id="shootDateText" class="status-date">拍攝日: —</span>
        <span id="gpsWarnPill" class="gps-warn-pill hidden" title="匯入的照片未偵測到 GPS 座標資訊">

          <span class="lbl-full">無 GPS 訊號</span>
          <span class="lbl-short">無GPS</span>
        </span>
      </div>

      <div class="top-group">
        <button id="btnUndo" class="btn-secondary btn-icon-only" title="復原 (Undo)" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button id="btnRedo" class="btn-secondary btn-icon-only" title="重做 (Redo)" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
        <button id="btnCollapseUi" class="btn-secondary" title="收合介面以全畫面檢視">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <span class="hide-xs hide-land">收合介面</span>
        </button>
        <button id="btnExport" class="btn-export" title="匯出合成圖檔">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="hide-xs">匯出截圖</span>
        </button>
      </div>
    </header>

    <!-- ==================== Main Workspace ==================== -->
    <main id="workspace" class="workspace">
      <section id="canvasStage" class="canvas-stage">
        <canvas id="mainCanvas"></canvas>

        <!-- Expand UI Floating Button (Visible only in Full-Screen Collapsed Mode) -->
        <button id="btnExpandUi" class="expand-ui-btn">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <span>展開工具</span>
        </button>

        <!-- Mode Indicator Badge -->
        <div id="modeBadge" class="mode-badge">底圖檢視：拖曳平移、滾輪或雙指縮放</div>

        <!-- Annotation Floating Context Bar -->
        <div id="annContextBar" class="context-bar hidden">
          <button id="btnAnnEditText" class="ctx-btn hidden">編輯文字</button>
          <button id="btnAnnDuplicate" class="ctx-btn">複製</button>
          <button id="btnAnnDelete" class="ctx-btn danger">刪除</button>
        </div>

        <!-- Zoom Controls -->
        <div class="zoom-controls">
          <button id="btnZoomIn" class="zoom-btn" title="放大">+</button>
          <div id="zoomPercent" class="zoom-percent">100%</div>
          <button id="btnZoomOut" class="zoom-btn" title="縮小">−</button>
          <button id="btnZoomFit" class="zoom-btn zoom-fit-btn" title="適合畫面">適合</button>
        </div>

        <!-- Floating Numeric / Angle Toast -->
        <div id="floatingToast" class="floating-toast"></div>
      </section>

      <!-- Layer Context Bar (Floating in Portrait, Right Sidebar in Landscape) -->
      <div id="layerContextBar" class="context-bar hidden">
        <button id="btnLayerRecrop" class="ctx-btn">
          <span class="lbl-full">重新裁切</span>
          <span class="lbl-short">重裁</span>
        </button>
        <button id="btnLayerUp" class="ctx-btn">上移</button>
        <button id="btnLayerDown" class="ctx-btn">下移</button>
        <button id="btnLayerDelete" class="ctx-btn danger">刪除</button>
      </div>

      <!-- Bottom Bar (Bottom in Portrait; Left/Right Sidebars via display:contents in Landscape) -->
      <footer class="bottom-bar">
        <!-- Draw Mode Sub-toolbar -->
        <div id="drawSubbar" class="draw-subbar hidden">
          <div class="tool-row" id="toolRow">
            <button class="tool-btn active" data-tool="select">選取編輯</button>
            <button class="tool-btn" data-tool="arrow">箭頭</button>
            <button class="tool-btn" data-tool="line">直線</button>
            <button class="tool-btn" data-tool="rect">矩形</button>
            <button class="tool-btn" data-tool="ellipse">圓形</button>
            <button class="tool-btn" data-tool="cloud">雲朵</button>
            <button class="tool-btn" data-tool="freehand">手繪</button>
            <button class="tool-btn" data-tool="text">文字</button>
          </div>
          <div class="style-row">
            <div class="swatch-group" id="swatchGroup">
              <button class="swatch active" data-color="#ef4444" style="background:#ef4444" title="紅色"></button>
              <button class="swatch" data-color="#facc15" style="background:#facc15" title="黃色"></button>
              <button class="swatch" data-color="#38bdf8" style="background:#38bdf8" title="青色"></button>
              <button class="swatch" data-color="#22c55e" style="background:#22c55e" title="綠色"></button>
              <button class="swatch" data-color="#f97316" style="background:#f97316" title="橘色"></button>
              <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="白色"></button>
              <button class="swatch" data-color="#0f172a" style="background:#0f172a" title="黑色"></button>
            </div>
            <div class="size-stepper">
              <button id="btnSizeMinus" class="step-btn" title="縮小線寬或字體">−</button>
              <button id="btnSizePlus" class="step-btn" title="放大線寬或字體">+</button>
            </div>
          </div>
        </div>

        <!-- 4 Main Mode Tabs -->
        <nav class="mode-tabs" id="modeTabs">
          <button class="mode-tab active" data-mode="view">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            <span>底圖檢視</span>
          </button>
          <button class="mode-tab" data-mode="importPhoto">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>匯入照片</span>
          </button>
          <button class="mode-tab" data-mode="layer">
            <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>圖層編輯</span>
          </button>
          <button class="mode-tab" data-mode="draw">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
            <span>標註繪圖</span>
          </button>
        </nav>
      </footer>
    </main>
  </div>

  <!-- ==================== Crop Modal ==================== -->
  <div id="cropModal" class="modal-backdrop hidden">
    <div class="modal-card wide">
      <div class="modal-header">
        <h3 id="cropModalTitle" class="modal-title">局部裁切照片</h3>
        <span id="cropQueueInfo" style="font-size:12px;color:#94a3b8;"></span>
      </div>
      <div class="modal-body">
        <div class="crop-meta">
          <span id="cropExifInfo">正在讀取拍攝資訊...</span>
          <span>拖曳方框移動或拉動四角調整裁切範圍</span>
        </div>
        <div id="cropStage" class="crop-stage">
          <canvas id="cropCanvas"></canvas>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnCropFull" class="btn-secondary">全圖</button>
        <button id="btnCropSkip" class="btn-secondary">跳過</button>
        <button id="btnCropConfirm" class="btn-primary">確認裁切</button>
      </div>
    </div>
  </div>

  <!-- ==================== Text Annotation & Quick-Phrase Modal ==================== -->
  <div id="textModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="textModalTitle" class="modal-title">新增／編輯文字註解</h3>
        <button id="btnTextCancelTop" class="btn-secondary" style="padding:4px 9px;">✕</button>
      </div>
      <div class="modal-body">
        <div class="text-input-row">
          <textarea id="textAnnInput" class="text-input" rows="3" placeholder="輸入文字（按 Enter 可換行）或點擊下方常用詞組合..." autocomplete="off"></textarea>
          <button id="btnTextClear" class="btn-secondary">清除</button>
        </div>

        <div class="phrase-toolbar">
          <div class="phrase-toolbar-group">
            <button id="btnViewCategory" class="pill-toggle active">分類檢視</button>
            <button id="btnViewAll" class="pill-toggle">全部清單</button>
          </div>
          <div class="phrase-toolbar-group">
            <button id="btnToggleAddPhrase" class="pill-toggle">＋新增</button>
            <button id="btnToggleManagePhrase" class="pill-toggle">編輯／刪除</button>
          </div>
        </div>

        <!-- Add / Edit Phrase Form -->
        <div id="phraseFormBox" class="phrase-add-box hidden">
          <div class="phrase-add-row">
            <input id="phraseTextInput" type="text" placeholder="輸入常用詞（例如：5F、LED）" />
            <select id="phraseCatSelect"></select>
            <input id="phraseCustomCatInput" type="text" placeholder="輸入新分類名稱" class="hidden" />
          </div>
          <div style="display:flex;justify-content:flex-end;gap:6px;">
            <button id="btnPhraseFormCancel" class="btn-secondary" style="padding:5px 10px;">取消</button>
            <button id="btnPhraseFormSave" class="btn-primary" style="padding:5px 12px;">儲存詞彙</button>
          </div>
        </div>

        <!-- Manage Mode Reset Bar -->
        <div id="phraseManageBar" class="hidden" style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#facc15;">
          <span>點選詞彙可編輯內容，點 × 可刪除</span>
          <button id="btnPhraseReset" class="ctx-btn danger" style="padding:4px 9px;font-size:11px;">恢復預設</button>

      <div class="modal-footer">
        <button id="btnTextCancel" class="btn-secondary">取消</button>
        <button id="btnTextConfirm" class="btn-primary">確認套用</button>
      </div>
    </div>
  </div>

  <!-- ==================== Export Preview Modal ==================== -->
  <div id="exportModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">匯出預覽（已含拍攝日期浮水印）</h3>

    </div>
  </div>

  <script>
    (() => {
      'use strict';

      /* ==================== A. Constants & Default Phrases ==================== */
      const APP_VERSION = 'v2.1';
      const STORAGE_PHRASES_KEY = 'cad_overlay_phrases_v2';
      const STORAGE_PHRASE_VIEW_KEY = 'cad_overlay_phrase_view_v2';

      const DEFAULT_PHRASES = [
        { id: 'p1', text: '1F', category: '樓層' },
        { id: 'p2', text: '2F', category: '樓層' },
        { id: 'p3', text: '3F', category: '樓層' },
        { id: 'p4', text: '4F', category: '樓層' },

        { id: 'p14', text: '插座', category: '設備' },
        { id: 'p15', text: '開關', category: '設備' },
        { id: 'p16', text: 'Q1', category: '編號狀態' },
        { id: 'p17', text: 'Q2', category: '編號狀態' },
        { id: 'p18', text: '已完工', category: '編號狀態' },
        { id: 'p19', text: '待修繕', category: '編號狀態' },

        { id: 'p22', text: '位置偏移', category: '編號狀態' }

      /* ==================== B. DOM References ==================== */
      const el = {
        workspace: document.getElementById('workspace'),
        canvasStage: document.getElementById('canvasStage'),
        mainCanvas: document.getElementById('mainCanvas'),
        bottomBar: document.querySelector('.bottom-bar'),
        btnImportCad: document.getElementById('btnImportCad'),

        photoFileInput: document.getElementById('photoFileInput'),

        shootDateText: document.getElementById('shootDateText'),
        gpsWarnPill: document.getElementById('gpsWarnPill'),
        btnUndo: document.getElementById('btnUndo'),
